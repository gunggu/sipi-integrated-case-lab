<body><header><small>SIPI · Kelas Profesional IKPI · Sesi 4</small><h1>Control Breakdown: ERP Pasca-Go-Live</h1><div class="sub">PT NusaNiaga Digital | Investigasi bukti · diagnosis kontrol · keputusan profesional</div></header>
<main><div class="layout"><aside class="panel sidebar"><b>Navigasi simulasi</b><div id="steps" class="navlist"></div><hr><p class="muted" style="font-size:13px">Estimasi 25–30 menit. Simulasi formatif, bukan ujian aman. Data dan bukti fiktif. Hasil disimpan lokal.</p><button class="btn light" id="restart" type="button">Mulai ulang</button></aside><section class="panel"><div id="app"></div></section></div></main>
<script>
const cases=[
{id:"vendor",title:"Perubahan rekening vendor",area:"Master data / Treasury",amount:"Rp1,8 miliar",risk:"Pembayaran salah tujuan",prompt:"Rekening bank pemasok diganti sehari sebelum pembayaran besar. Dua approval internal tercatat. Apa keputusan yang paling dapat dipertanggungjawabkan?",evidence:[
{label:"VM-204 · Vendor change log",body:"Pemasok: PT Mitra Sumber. Rekening lama: ****2801; rekening baru: ****7719. Perubahan 18:42, H-1 pembayaran. Request berasal dari email yang mengklaim alamat pemasok. Bukti autentikasi pemohon: belum tersedia."},
{label:"AP-204 · Maker–checker approval",body:"Maker: staf master data; checker: supervisor A/P, 18:56. Kedua akun berbeda. Checker mengonfirmasi kelengkapan field, bukan kepemilikan rekening atau keaslian permintaan."},
{label:"PAY-901 · Payment queue",body:"Pembayaran Rp1.800.000.000 terjadwal pukul 14:00. Tidak ada independent callback ke nomor pemasok di master data yang tervalidasi. Dokumen purchase order dan penerimaan barang mendukung liability, bukan identitas rekening baru."}
],choices:[["release","Lepas karena maker–checker sudah selesai."],["hold","Tahan pembayaran dan lakukan callback independen ke kontak pemasok yang sebelumnya tervalidasi."],["split","Bayar sebagian ke rekening baru dengan otorisasi CFO."],["delete","Hapus data rekening lama dan lanjutkan proses normal."]],best:"hold",points:15,why:"Maker–checker internal hanya membuktikan pemisahan persetujuan internal, belum membuktikan permintaan benar berasal dari vendor. Hold dan verifikasi melalui kanal independen mengatasi risiko pengalihan pembayaran." ,effects:{release:"Instruksi pembayaran menuju rekening yang kepemilikannya belum tervalidasi; exposure tetap terbuka.",hold:"Payment queue ditandai HOLD untuk verifikasi vendor; kewajiban tetap tercatat dan harus dikelola sesuai jatuh tempo.",split:"Sebagian dana masih berisiko salah tujuan; pembatasan nominal tidak menyelesaikan kelemahan autentikasi.",delete:"Jejak data dan histori perubahan berpotensi hilang; investigasi menjadi lebih sulit."}},
{id:"access",title:"Akses admin darurat",area:"IT General Controls",amount:"23:16–23:42",risk:"Privileged misuse / override",prompt:"Akun emergency admin mengubah konfigurasi ERP setelah jam kerja. Tiket insiden tersedia, tetapi rekaman sesi belum ditelaah. Apa respons terkuat?",evidence:[
{label:"IAM-117 · Privileged access log",body:"Akun breakglass-01 diaktifkan 23:16 dan otomatis nonaktif 23:42. Perubahan parameter posting dilakukan pada modul A/P. Identitas personal operator tertaut di vault, namun belum ada secondary review."},
{label:"INC-551 · Incident ticket",body:"Alasan penggunaan: mengatasi batch posting yang tertahan. Ticket disetujui IT operations on-call. Referensi rollback ada, tetapi hasil reconciliation setelah perubahan tidak dilampirkan."},
{label:"MON-14 · Monitoring register",body:"Prosedur mewajibkan review sesi dalam 1 hari kerja. Dua hari kerja kemudian status masih 'pending'. Tidak ada bukti penyalahgunaan; tidak ada pula evidence bahwa perubahan telah ditinjau lengkap."}
],choices:[["ignore","Tutup kejadian karena akses telah otomatis kedaluwarsa."],["password","Ganti kata sandi admin saja dan tutup insiden."],["review","Amankan log, lakukan review independen atas sesi dan perubahan, uji dampak posting, serta eskalasi keterlambatan monitoring."],["fraud","Langsung simpulkan fraud dan umumkan pelanggaran ke seluruh unit."]],best:"review",points:15,why:"Emergency access dapat dibenarkan tetapi memerlukan atribusi, pembatasan, review independen, dan verifikasi dampak transaksi. Bukti belum cukup untuk menyimpulkan fraud; kegagalan monitoring harus ditangani.",effects:{ignore:"Risiko konfigurasi tak terotorisasi atau salah tetap tidak diuji.",password:"Kontrol kredensial membaik, tetapi perubahan historis dan akurasi posting belum diverifikasi.",review:"Akses tetap berakhir, bukti diamankan, dan pemeriksaan dampak dapat menentukan apakah perlu koreksi tambahan.",fraud:"Kesimpulan melewati bukti yang tersedia dan berisiko mengganggu investigasi yang objektif."}},
{id:"interface",title:"Interface bertanda sukses",area:"Integrasi / GL",amount:"27 transaksi",risk:"Kelengkapan transaksi",prompt:"Dashboard menunjukkan status SUCCESS, padahal 27 record berada di rejected queue. Bagaimana diagnosis dan respons yang paling kuat?",evidence:[
{label:"IF-88 · Run summary",body:"Source count 2.410; target posted count 2.383; rejected 27. Sistem memberi SUCCESS karena API transport berhasil. Nilai sumber Rp12.480.000.000; nilai posted Rp12.325.000.000; selisih Rp155.000.000."},
{label:"ERR-88 · Rejected queue",body:"27 record tertolak: 19 mapping akun kosong, 8 kode entitas tidak valid. Queue memiliki timestamp, tetapi owner belum ditetapkan dan tidak ada SLA penyelesaian."},
{label:"GL-REC · Rekonsiliasi",body:"Rekonsiliasi saat ini hanya membandingkan jumlah transaksi yang sudah diterima GL dengan ledger staging, sehingga rejected population di luar cakupan dashboard keuangan."}
],choices:[["success","Terima status sukses karena endpoint API berhasil."],["manual","Posting jurnal penyeimbang Rp155 juta tanpa menelusuri transaksi sumber."],["recon","Rekonsiliasi source–interface–GL termasuk rejected items, perbaiki mapping dengan approval, assign owner/SLA dan retest dashboard."],["later","Tunggu sampai audit tahunan agar perubahan sistem tidak mengganggu operasi."]],best:"recon",points:15,why:"Transport success berbeda dari completeness accounting. Perlu control totals, inklusi rejected items, kepemilikan exception, approved mapping, dan pembuktian posting yang lengkap.",effects:{success:"Dashboard tetap menyesatkan dan 27 transaksi belum tercatat.",manual:"Saldo mungkin tampak cocok, tetapi transaksi rinci, klasifikasi, dan jejak audit tetap tidak dapat dipertanggungjawabkan.",recon:"Selisih sumber-ke-buku besar dapat ditelusuri, diperbaiki, dan dicegah berulang melalui ownership dan monitoring.",later:"Risiko kelengkapan pelaporan berlanjut hingga periode berikutnya."}},
{id:"dashboard",title:"Dashboard tidak mutakhir",area:"Pelaporan manajemen",amount:"T−2 hari",risk:"Keputusan dari stale data",prompt:"Tim manajemen menggunakan dashboard yang terlihat normal tetapi feed ke data warehouse tertunda dua hari. Apa keputusan publikasi yang tepat?",evidence:[
{label:"DWH-73 · Data pipeline",body:"Last successful refresh: 24 Oktober 2026 pukul 02:00. Waktu simulasi: 26 Oktober pukul 10:00. Dua job berikutnya gagal karena perubahan skema kolom; tidak ada failed-load alert aktif."},
{label:"BI-22 · Report metadata",body:"Dashboard 'Monthly Performance' tidak menampilkan timestamp refresh. KPI gross margin memakai snapshot lama, tetapi label antarmuka menyebut 'current'."},
{label:"REV-5 · Release workflow",body:"Controller menandatangani review bulanan atas laporan lama. Belum ada approval untuk data terbaru atau disclosure bahwa snapshot lama digunakan."}
],choices:[["publish","Terbitkan tanpa catatan karena review bulan lalu sudah ditandatangani."],["label","Tambahkan catatan 'data sementara', tanpa memperbaiki data atau meminta penelaahan."],["hold","Tahan klaim sebagai laporan terkini, pulihkan feed, rekonsiliasi ke sumber final, tampilkan freshness, lalu review versi baru."],["silence","Biarkan pengguna menemukan sendiri perbedaan tanggal data."]],best:"hold",points:15,why:"Report control memerlukan ketepatan versi dan freshness serta rilis yang disetujui. Review pada snapshot lama tidak berlaku otomatis bagi output baru.",effects:{publish:"Manajemen dapat menggunakan KPI kedaluwarsa sebagai informasi mutakhir.",label:"Risiko berkurang secara komunikasi tetapi data dan approval belum dipulihkan.",hold:"Laporan mutakhir belum dirilis sebelum pipeline dan review bukti selesai.",silence:"Risiko informasi tidak transparan dan salah keputusan tetap berlangsung."}},
{id:"ai",title:"Narasi AI atas margin",area:"AI / Financial reporting",amount:"Margin +4,2 pp",risk:"Unsupported explanatory claim",prompt:"AI menyatakan margin meningkat 'akibat efisiensi pembelian' meskipun hanya menerima angka ringkasan. CFO meminta narasi segera dikirim. Apa tindakan yang tepat?",evidence:[
{label:"AI-042 · Prompt/output record",body:"Prompt: 'Jelaskan kenaikan gross margin berdasarkan summary P&L'. Output: 'Kenaikan terutama berasal dari efisiensi pembelian'. Tidak ada analisis harga input, bauran produk, atau perubahan cost allocation."},
{label:"FIN-042 · Source/version",body:"Dataset yang dipakai adalah pre-close snapshot v18. Final approved close v20 memperlihatkan margin +3,7 pp, bukan +4,2 pp. Rekonsiliasi sebab perubahan margin belum tersedia."},
{label:"GOV-8 · AI policy",body:"Kebijakan meminta approved data, validasi angka dan causal claims, reviewer manusia, serta retensi sumber/prompt/output/perubahan. Log review belum dibuat."}
],choices:[["send","Kirim karena narasi AI cukup masuk akal bagi manajemen."],["delete","Hapus seluruh log AI lalu tulis klaim yang sama secara manual."],["minor","Koreksi angka menjadi 3,7 pp tetapi biarkan klaim efisiensi."],["validate","Tahan narasi, gunakan snapshot final, verifikasi penyebab dengan bukti, lakukan review manusia dan arsipkan jejak perubahan."]],best:"validate",points:15,why:"Angka pre-close dan klaim kausal tanpa bukti bukan dasar narasi profesional. Human review, source lineage, claim validation, dan sign-off wajib sebelum release.",effects:{send:"Narasi dapat memuat angka usang dan atribusi sebab yang belum dapat dibuktikan.",delete:"Audit trail hilang dan klaim tetap tidak didukung.",minor:"Nilai diperbaiki tetapi dasar kausal masih lemah.",validate:"Narasi baru dapat dirilis setelah sumber final dan penjelasan diverifikasi serta direview."}}
];
const allSteps=["Briefing","Vendor","Akses admin","Interface","Dashboard","AI narrative","Memo & hasil"];
const KEY="sipi4ikpi_v2";
const blank=()=>({step:0,name:"",answers:{},opened:{},diagnosis:{},framework:{},owner:{},rationale:{},memo:"",submitted:false});
let state;try{state=Object.assign(blank(),JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){state=blank()}
const $=x=>document.getElementById(x),save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function nav(){ $("steps").innerHTML=allSteps.map((t,i)=>'<button class="step '+(i===state.step?'active':'')+'" data-nav="'+i+'" '+(i>maxReach()?'disabled':'')+'><span class="n">'+(i+1)+'</span>'+esc(t)+'</button>').join("");document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>go(+b.dataset.nav))}
function maxReach(){let r=0;for(let i=0;i<5;i++){if(!isComplete(cases[i]))break;r=i+2}return Math.min(6,Math.max(r,state.step))}
function go(n){if(state.submitted&&n!==6)return;state.step=Math.min(n,maxReach());save();render();window.scrollTo({top:0,behavior:"smooth"})}
function viewEvidence(c){return c.evidence.map((e,i)=>'<details class="evidence" data-evidence="'+c.id+':'+i+'" '+(state.opened[c.id]?.includes(i)?'open':'')+'><summary>📄 '+esc(e.label)+' <span class="muted" style="font-weight:normal;font-size:12px">· buka dokumen</span></summary><div class="inner">'+esc(e.body)+'</div></details>').join("")}
function render(){nav();let s=state.submitted?6:state.step,h='';
if(s===0){h='<span class="pill">SIMULASI MANDIRI · KELAS PROFESIONAL</span><h2 style="margin-top:14px">Anda memimpin Control Assessment Team</h2><p>PT NusaNiaga Digital baru selesai go-live ERP. Direksi mengklaim semua transaksi terotorisasi. Namun lima indikasi anomali ditemukan saat review pasca-implementasi. Anda harus memutuskan apakah kontrol dapat diandalkan, bukti apa yang masih diperlukan, serta langkah penanganan yang paling profesional.</p><div class="statgrid"><div class="stat">Area investigasi<b>5</b></div><div class="stat">Waktu sasaran<b>25–30 mnt</b></div><div class="stat">Nilai total<b>100</b></div></div><div class="alert">Anda tidak sedang mem-posting ke ERP nyata. Pilihan mengubah status simulasi dan akan dianalisis pada akhir kegiatan. Tidak ada kunci yang ditampilkan sebelum memo dikirim.</div><label><b>Nama / kelompok (opsional)</b><input id="participant" type="text" maxlength="90" placeholder="Kelompok A"></label><h3>Penugasan</h3><p>Untuk setiap area: baca bukti digital, tentukan keputusan, lalu identifikasi jenis kelemahan kontrol. Akhiri dengan memo kepada komite audit berisi prioritas, ownership, bukti, dan monitoring.</p><div class="controls"><button class="btn" id="next">Mulai investigasi →</button></div>'}
else if(s>=1&&s<=5){const c=cases[s-1],a=state.answers[c.id],d=state.diagnosis[c.id]||'';h='<div class="pill">INVESTIGASI '+s+' / 5</div><h2 style="margin-top:14px">'+esc(c.title)+'</h2><p class="muted">'+esc(c.area)+' · '+esc(c.risk)+'</p><div class="statgrid"><div class="stat">Indikator<b>'+esc(c.amount)+'</b></div><div class="stat">Dokumen<b>3</b></div><div class="stat">Keputusan<b>'+(a?'Tercatat':'Belum')+'</b></div></div><h3>Berita awal</h3><p>'+esc(c.prompt)+'</p><h3>Evidence Explorer</h3><p class="muted">Buka dokumen yang relevan sebelum memutuskan. Bukti belum tentu lengkap dan tidak selalu membuktikan kecurangan.</p>'+viewEvidence(c)+'<h3>Keputusan profesional</h3><div>'+c.choices.map(([id,txt])=>'<label class="choice"><input type="radio" name="decision" value="'+id+'" '+(a===id?'checked':'')+'>'+esc(txt)+'</label>').join('')+'</div><h3>Analisis profesional</h3><p class="muted">Semua dokumen perlu dibuka. Pilih kerangka, owner, dan tulis alasan keputusan berdasarkan bukti.</p><label>Kerangka utama<select id="framework" style="display:block;width:100%;padding:10px;margin:8px 0"><option value="">Pilih kerangka</option><option value="COSO IC">COSO Internal Control</option><option value="COSO ERM">COSO ERM</option><option value="COBIT">COBIT</option><option value="Three Lines">Three Lines</option></select></label><label>Penanggung jawab kontrol<select id="owner" style="display:block;width:100%;padding:10px;margin:8px 0"><option value="">Pilih owner</option><option value="Finance">Finance / Treasury</option><option value="IT">IT / Security</option><option value="Process">Business process owner</option><option value="Data">Data / reporting owner</option><option value="Audit">Internal audit (assurance)</option></select></label><label>Alasan berbasis bukti (minimal 35 karakter)<textarea id="rationale" style="min-height:80px" placeholder="Bukti ...; risiko ...; kontrol ..."></textarea></label><h3>Klasifikasi kelemahan utama</h3><p class="muted">Pilih diagnosis dominan. Satu kasus mungkin mengandung lebih dari satu jenis kelemahan.</p><select id="diagnosis" style="width:100%;padding:12px;border-radius:8px;border:1px solid #c4d5df"><option value="">— Pilih diagnosis —</option><option value="design" '+(d==='design'?'selected':'')+'>Design deficiency</option><option value="operating" '+(d==='operating'?'selected':'')+'>Operating deficiency</option><option value="monitoring" '+(d==='monitoring'?'selected':'')+'>Monitoring deficiency</option><option value="mixed" '+(d==='mixed'?'selected':'')+'>Kombinasi / interconnected deficiencies</option></select><p id="readstatus" class="muted"></p><div id="status"></div><div class="controls"><button class="btn alt" id="back">← Kembali</button><button class="btn" id="next" '+(!a||!d?'disabled':'')+'>'+(s===5?'Susun memo →':'Lanjut investigasi →')+'</button></div>'}
else{h='<span class="pill">FINAL ASSESSMENT</span><h2 style="margin-top:14px">Memo komite audit</h2><p>Susun rekomendasi profesional. Jangan menyimpulkan fraud tanpa bukti yang memadai. Jelaskan apa yang harus di-hold, apa yang perlu diperbaiki, siapa pemilik tindakan, bagaimana pembuktian, serta kapan eskalasi diperlukan.</p><label><b>Memo ringkas (minimal 180 karakter)</b><textarea id="memo" placeholder="Kepada Komite Audit: Prioritas pertama ...">'+esc(state.memo)+'</textarea></label><p class="muted" id="count"></p><div class="controls"><button class="btn alt" id="back">← Investigasi terakhir</button>'+(state.submitted?'<button class="btn light" id="print">Cetak / simpan PDF</button><button class="btn light" id="export">Unduh laporan TXT</button>':'<button class="btn" id="submit" '+(state.memo.trim().length<180?'disabled':'')+'>Kirim penilaian akhir</button>')+'</div><div id="finalout"></div>'}
$("app").innerHTML=h;
if(s===0){$("participant").value=state.name||"";$("participant").oninput=e=>{state.name=e.target.value;save()};$("next").onclick=()=>go(1)}
else if(s<=5){const c=cases[s-1];document.querySelectorAll('details[data-evidence]').forEach(d=>d.addEventListener('toggle',()=>{const i=+d.dataset.evidence.split(':')[1];let arr=state.opened[c.id]||[];if(d.open&&!arr.includes(i))arr.push(i);state.opened[c.id]=arr;save();validCase(c)}));document.querySelectorAll('input[name=decision]').forEach(r=>r.onchange=()=>{state.answers[c.id]=r.value;save();showConsequence(c);validCase(c)});$("diagnosis").onchange=e=>{state.diagnosis[c.id]=e.target.value;save();validCase(c)};$("back").onclick=()=>go(s-1);$("next").onclick=()=>go(s+1);showConsequence(c);$("framework").value=state.framework[c.id]||"";$("owner").value=state.owner[c.id]||"";$("rationale").value=state.rationale[c.id]||"";for(const key of ["framework","owner","rationale"]){$(key).addEventListener(key==="rationale"?"input":"change",e=>{state[key][c.id]=e.target.value;save();validCase(c)})}validCase(c)}
else{$("memo").oninput=e=>{state.memo=e.target.value;save();$("count").textContent=e.target.value.trim().length+' karakter';if($("submit"))$("submit").disabled=e.target.value.trim().length<180};$("count").textContent=state.memo.trim().length+' karakter';$("back").onclick=()=>go(5);if(!state.submitted){$("submit").onclick=()=>{if(!state.submitted&&state.memo.trim().length>=180&&cases.every(isComplete)){state.submitted=true;state.step=6;save();render()}}}else{$("print").onclick=()=>window.print();$("export").onclick=exportTxt;results()}}}
function isComplete(c){return (state.opened[c.id]||[]).length===3&&!!state.answers[c.id]&&!!state.diagnosis[c.id]&&!!state.framework[c.id]&&!!state.owner[c.id]&&(state.rationale[c.id]||"").trim().length>=35}function validCase(c){const b=$("next");if(b)b.disabled=!isComplete(c);const t=$("readstatus");if(t)t.textContent="Dokumen dibuka: "+(state.opened[c.id]||[]).length+"/3 · "+(isComplete(c)?"Siap melanjutkan":"Lengkapi bukti, keputusan, diagnosis, framework, owner, dan alasan")}function showConsequence(c){const a=state.answers[c.id];if(!a)return;$("status").innerHTML='<div class="consequence"><b>Status skenario setelah keputusan</b><p>'+esc(c.effects[a])+'</p><small class="muted">Umpan balik normatif dan skor baru dibuka pada laporan akhir.</small></div>'}
const dx={vendor:"design",access:"monitoring",interface:"mixed",dashboard:"mixed",ai:"mixed"};
function score(){const dec=cases.reduce((n,c)=>n+(state.answers[c.id]===c.best?c.points:0),0);const diag=cases.reduce((n,c)=>n+(state.diagnosis[c.id]===dx[c.id]?2:0),0);return{dec,diag,auto:dec+diag}}
function results(){let p=score();let grade=p.auto>=75?"Keputusan sangat kuat":p.auto>=60?"Cukup baik, ada risiko residual":"Perlu perbaikan signifikan";$("finalout").innerHTML='<hr><h2>Hasil keputusan otomatis</h2><div class="result">'+p.auto+' / 85</div><p><b>'+grade+'</b>. Skor memo profesional maksimal 15 poin ditetapkan pengajar melalui rubrik, bukan oleh algoritme sederhana.</p><table><thead><tr><th>Area</th><th>Keputusan</th><th>Nilai pilihan</th><th>Diagnosa</th></tr></thead><tbody>'+cases.map(c=>'<tr><td>'+esc(c.title)+'</td><td>'+esc(c.choices.find(o=>o[0]===state.answers[c.id])?.[1]||"—")+'</td><td>'+(state.answers[c.id]===c.best?c.points:0)+'/'+c.points+'</td><td>'+(state.diagnosis[c.id]===dx[c.id]?'Sesuai model':'Diskusikan alternatif')+'</td></tr>').join('')+'</tbody></table><h3>Kunci dan pembahasan</h3>'+cases.map((c,i)=>'<div style="border-bottom:1px solid #dbe5e8;padding:12px 0"><b>'+(i+1)+'. '+esc(c.title)+'</b><p><b>Keputusan yang diharapkan:</b> '+esc(c.choices.find(o=>o[0]===c.best)[1])+'</p><p>'+esc(c.why)+'</p><p class="muted"><b>Diagnosis dominan model:</b> '+esc(dx[c.id])+'; gunakan professional judgment jika argumentasi diagnosis lain didukung bukti.</p></div>').join('')+'<h3>Rubrik penilaian akhir</h3><p>Kerangka 20 · Analisis risiko 20 · Desain kontrol & ownership 25 · Bukti & monitoring 20 · Memo 15. Skor otomatis di atas merepresentasikan indikator pilihan (75) dan diagnosis (10) dari total 85, bukan pengganti rubrik kelas.</p><h3>Analisis profesional peserta</h3>'+cases.map(c=>'<p><b>'+esc(c.title)+'</b><br>Kerangka: '+esc(state.framework[c.id])+'; owner: '+esc(state.owner[c.id])+'<br>Alasan: '+esc(state.rationale[c.id])+'</p>').join('')+'<h3>Memo peserta</h3><p style="white-space:pre-wrap">'+esc(state.memo)+'</p><p class="foot">Skenario fiktif. Kunci dan skor tersedia dalam kode situs statis. Untuk ujian resmi diperlukan backend dan autentikasi. Alasan serta memo dinilai pengajar.</p>'}
function exportTxt(){let p=score(),txt=['SIPI IKPI SESI 4 — CONTROL BREAKDOWN','Peserta: '+(state.name||'—'),'Skor pilihan dan diagnosis: '+p.auto+'/85','Memo dinilai pengajar: 0–15',...cases.map(c=>'\n'+c.title+'\nPilihan: '+(c.choices.find(x=>x[0]===state.answers[c.id])?.[1]||'—')+'\nDiagnosis: '+(state.diagnosis[c.id]||'—')+'\nPembahasan: '+c.why),...cases.map(c=>'\nKERANGKA '+c.title+': '+(state.framework[c.id]||'—')+'\nOWNER: '+(state.owner[c.id]||'—')+'\nARGUMENTASI: '+(state.rationale[c.id]||'—')),'\nMEMO\n'+state.memo].join('\n');const blob=new Blob([txt],{type:'text/plain;charset=utf-8'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='SIPI_Sesi_4_IKPI_Laporan_'+(state.name.replace(/[^a-z0-9]/gi,'_')||'peserta')+'.txt';a.click();URL.revokeObjectURL(u)}
$("restart").onclick=()=>{if(confirm("Hapus seluruh keputusan lokal dan mulai ulang simulasi?")){state=blank();save();go(0)}};render();
</script></body></html>
