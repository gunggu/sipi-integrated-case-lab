<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIPI Decision Lab — The Assurance Board</title><style>
:root{--navy:#142a41;--teal:#087e83;--gold:#d7a44c;--ink:#1c3041;--soft:#eff5f7;--line:#cbd9e0}*{box-sizing:border-box}body{margin:0;font:16px/1.55 system-ui,-apple-system,Segoe UI,Arial;background:#edf3f5;color:var(--ink)}header{background:linear-gradient(120deg,#142a41,#195574);color:white;padding:24px max(20px,calc((100vw - 1120px)/2));border-bottom:5px solid var(--gold)}header h1{margin:2px 0;font-size:30px}header p{margin:4px 0;opacity:.88}main{max-width:1120px;margin:22px auto;padding:0 18px 50px}.panel{background:white;border:1px solid var(--line);border-radius:15px;padding:22px;margin:15px 0;box-shadow:0 5px 16px #132e4210}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:13px}.box{border:1px solid var(--line);padding:17px;border-radius:12px;background:#f8fbfc}.muted{color:#53697b}.small{font-size:13px}.pill{display:inline-block;border:1px solid #a9cbd0;background:#e9f6f6;border-radius:20px;padding:3px 11px;font-size:12px;font-weight:700;color:#075a5c}h2{margin:0 0 12px}h3{margin:0 0 8px}button{border:0;border-radius:9px;padding:11px 17px;background:var(--navy);color:white;font-weight:700;cursor:pointer}button:hover{filter:brightness(1.1)}button:disabled{opacity:.4;cursor:not-allowed}.outline{background:white;border:1px solid #a6b9c5;color:#183b56}.danger{background:#963e3e}.accent{background:var(--teal)}input,textarea,select{font:inherit;border:1px solid #b3c6d0;border-radius:8px;padding:10px;background:white;max-width:100%;width:100%}textarea{min-height:90px;resize:vertical}label{display:block;font-weight:650;margin:9px 0 4px}.steps{display:flex;gap:5px;flex-wrap:wrap}.step{font-size:12px;padding:8px 10px;border-radius:8px;background:#dce8ed;color:#385269}.step.active{background:#146777;color:white}.actions{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:18px}.choice{display:block;padding:12px;border:1px solid var(--line);border-radius:9px;margin:7px 0;cursor:pointer;background:white}.choice:has(input:checked){border-color:#087e83;background:#edfafa}.choice input{width:auto;margin-right:10px}.private{background:#fff8e8;border-left:5px solid var(--gold)}.evidence{background:#f8fafb}.tag{font-size:12px;font-weight:700;color:#366174}details{border:1px solid var(--line);border-radius:9px;padding:12px;margin:8px 0;background:#fafcfd}summary{cursor:pointer;font-weight:700}.warn{border-left:4px solid #b46020;background:#fff8ea;padding:12px}.ok{border-left:4px solid #138466;background:#eaf8f2;padding:12px}.bar{height:8px;border-radius:8px;background:#d2e0e5;overflow:hidden}.bar span{display:block;height:100%;background:var(--teal)}footer{font-size:12px;color:#5f7480;text-align:center;margin:24px auto} @media(max-width:600px){header h1{font-size:24px}.panel{padding:16px}}@media print{button,.actions,header .small,.steps{display:none!important}body{background:white}.panel{box-shadow:none}}
</style></head><body><header><span class="pill">SIPI • Laboratorium Keputusan Profesional</span><h1>SIPI Decision Lab</h1><p>The Assurance Board · Simulasi Kelompok 30 Menit</p><p class="small">Investigasi Bukti · Keputusan Komite · Tindak Lanjut</p></header><main id="app"></main><footer>Seluruh kasus dan perusahaan dalam aplikasi bersifat simulatif. Hasil keputusan kelompok dibahas dalam forum kelas.</footer><script>
const DATA={
s11:{label:'Sesi 11 — The Broken Assurance Chain',company:'PT Arunika Distribusi',focus:'Kasus Integratif I • Data, ERP, Proses, Pengendalian, dan Audit',brief:'PT Arunika akan mengaktifkan ERP terintegrasi di 35 cabang dalam 48 jam. Komite menerima pernyataan bahwa migrasi dan UAT telah disetujui. Temuan awal menunjukkan masalah identitas pelanggan, akses, dan antarmuka. Putuskan kelayakan go-live dengan bukti yang tersedia.',roles:[
['CFO','Target go-live terkait kontrak distribusi penting. Penundaan mengakibatkan biaya tambahan, tetapi CFO tidak diberi mandat mengabaikan kontrol kritis.','Minta batas kuantitatif dampak salah saldo dan biaya penundaan.'],
['CIO','Uji akses setelah perubahan role terakhir belum dijalankan; laporan UAT mengacu konfigurasi sebelumnya.','Tanyakan bukti atas konfigurasi produksi terkini.'],
['Auditor Internal','Status closed pada dua isu hanya dibuktikan lewat tiket administrasi, tanpa retest independen.','Bedakan closed ticket dan control operating effectiveness.'],
['Risk & Compliance','Manajemen belum menetapkan siapa menerima risiko SoD yang tersisa saat go-live.','Tanyakan otoritas penerimaan risiko residual.'],
['Direktur Operasi','Prosedur fallback untuk 35 cabang tersedia sebagai dokumen, belum diuji pada skenario offline.','Tanyakan apakah operasi cabang tetap dapat berjalan saat interface gagal.']],
evidence:[
['E01 • Hasil migrasi pelanggan','Dua pelanggan berbeda NPWP tergabung; 68 transaksi bernilai Rp760 juta terdampak. Dampak terhadap saldo piutang dan batas kredit belum dipastikan.','Bagaimana menentukan luas dampak penggabungan identitas?'],
['E02 • Matriks akses ERP','Supervisor di empat cabang dapat membuat vendor sekaligus menyetujui pembayaran hingga Rp150 juta. Ada laporan review harian, tetapi sampel pelaksanaannya belum tersedia.','Apakah review harian sudah cukup sebagai kontrol kompensasi?'],
['E03 • Rekonsiliasi interface','Sumber 12.480 transaksi (Rp19,7 miliar), GL menerima 12.433. Dari 47 reject (Rp310 juta), 30 ditangani; 17 masih menunggu pembuktian posting dan cut-off.','Bukti apa yang dapat mendukung completeness dan cut-off?'],
['E04 • Catatan UAT','Approval UAT dibuat sebelum konfigurasi otorisasi terakhir. Dua skenario berisiko tinggi belum diuji ulang; pilot tiga cabang tidak mencakup pengujian hak akses.','Kapan UAT harus dilakukan ulang?'],
['E05 • Dashboard audit','Opsi transisi: go-live penuh menghindari biaya penundaan Rp180 juta/minggu; pilot tiga cabang membatasi cakupan risiko; penundaan penuh memerlukan proses manual sementara.','Bagaimana menilai pilihan implementasi secara proporsional?']],
shock:'Temuan tambahan: 17 reject senilai Rp125 juta berkaitan dengan penjualan periode berjalan yang belum masuk GL. Ada perubahan vendor master oleh role yang berwenang menyetujui pembayaran; bukti pembayaran tidak sah belum ditemukan.',shockQuestion:'Apa perubahan keputusan atau syarat go-live setelah dua temuan ini?',initial:'Apakah perusahaan dapat melakukan go-live ke seluruh 35 cabang?',final:'Putuskan Go-live / Go-live bersyarat / Tunda, lengkap dengan syarat dan evidence gate.',
choices:['Go-live','Go-live bersyarat','Tunda'],critical:['Rekonsiliasi source-to-GL termasuk seluruh reject','Perbaikan/mitigasi konflik akses dan uji ulang','Pengujian ulang UAT pascaperubahan','Koreksi identitas master dan dampak hilir','Fallback operasi yang diuji']
},
s13:{label:'Sesi 13 — The Digital Trust Crisis',company:'PT Cakrawala Layanan Digital',focus:'Professional Update • Cloud, Cyber, AI, RPA, Analytics, Privasi',brief:'PT Cakrawala berencana meluncurkan platform digital nasional. Komite harus menilai kesiapan teknologi, risiko residual, dan roadmap 30/60/90 hari. Bahan awal tampak meyakinkan, tetapi ada kesenjangan tanggung jawab dan operating evidence.',roles:[
['CFO','Mitra pembiayaan menunggu laporan final; narasi AI yang positif sudah masuk materi investor.','Tantang kesesuaian versi sumber data dan klaim kausal.'],
['CIO','SOC report vendor tersedia tetapi CUECs belum dipetakan ke pemilik kontrol internal.','Tentukan pembagian tanggung jawab provider dan customer.'],
['Auditor Internal','Enam temuan diberi label resolved oleh unit terkait, namun belum ada bukti retest untuk beberapa kontrol.','Tentukan standar penutupan temuan yang dapat diuji.'],
['Risk & Compliance','Data biometrik telah disimpan selama empat tahun tanpa jadwal penghapusan yang disetujui.','Uji tujuan, minimisasi, retensi, dan fallback.'],
['Direktur Operasi','Akun bot bersama digunakan dua otomasi pembayaran; perubahan skrip produksi tidak melalui change approval.','Tentukan containment operasi dan rollback yang aman.']],
evidence:[
['E01 • SOC report cloud','SOC 2 Type 2 mencakup periode hingga 60 hari lalu. CUECs mewajibkan review akses dan uji pemulihan. Bukti review tersedia, tetapi uji pemulihan belum terdokumentasi.','Siapa yang harus membuktikan operasi kontrol pelanggan?'],
['E02 • Privileged access','Tiga akun vendor masih aktif 21 hari setelah pekerjaan selesai. Log menunjukkan satu login malam hari, tetapi perubahan konfigurasi tidak dapat dipastikan dari log saat ini.','Apa yang dapat dan tidak dapat disimpulkan dari log?'],
['E03 • Paket narasi AI','Draft AI menyebut margin +4,2 poin persentase dari snapshot v18; laporan final v20 menunjukkan +3,7 poin. Klaim efisiensi vendor tanpa analisis harga-volume; materi belum dipublikasikan.','Bukti apa yang memadai untuk publikasi narasi?'],
['E04 • Bot register','Dua bot pembayaran berbagi akun layanan; satu perubahan skrip produksi belum disetujui. Belum ada indikasi transaksi salah, tetapi atribusi dan rollback belum teruji.','Tindakan mana yang perlu didahulukan dan mengapa?'],
['E05 • Analytics run log','Dashboard mengklaim cakupan 100%; 83 record reject (0,6% populasi) tidak melalui aturan analitik. Dampak nominal belum ditelusuri.','Apakah kesimpulan cakupan dashboard dapat diterima?'],
['E06 • Biometric policy','Sistem absensi biometrik menyimpan template empat tahun tanpa jadwal hapus. Alternatif kartu manual tersedia, tetapi kebijakan retensi belum disetujui.','Apa bukti yang diperlukan untuk menyatakan kontrol privasi memadai?']],
shock:'Vendor mengonfirmasi pengecualian pemulihan yang belum ditutup. Ada login vendor malam hari, tetapi belum ada bukti cukup bahwa login menyebabkan perubahan bot atau kesalahan narasi AI.',shockQuestion:'Apakah kondisi ini mengubah readiness dan containment prioritas 0–30 hari?',initial:'Apakah platform layak diluncurkan secara nasional?',final:'Putuskan Ready / Conditionally Ready / Not Ready dan syarat perubahan status berdasarkan bukti.',
choices:['Ready','Conditionally Ready','Not Ready'],critical:['Tetapkan owner CUECs dan uji backup recovery','Tinjau dan amankan privileged access vendor','Validasi ulang narasi AI dari final close','Pisahkan identitas bot, vault, dan change control','Validasi populasi analytics dan privacy controls']
}};
const STAGES=['Mulai','Kartu Peran','Evidence Board','Keputusan Awal','Bukti Tambahan','Remediation & Memo'];
const ROLE=['CFO','CIO','Auditor Internal','Risk & Compliance','Direktur Operasi'];
const KEY='sipi-decision-v2';
let model={ep:'s11',team:'',members:'',stage:0,role:0,opened:[],initial:'',initialReason:'',shockReason:'',final:'',risks:'',actions:'',roadmap:'',residual:'',memo:'',dissent:'',submitted:false,initialLocked:false,lockedInitial:null,startAt:null,votes:{}};
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function persist(){try{localStorage.setItem(KEY+':'+model.ep,JSON.stringify(model));localStorage.setItem(KEY+':last',model.ep)}catch(e){}}
function defaults(ep){return {ep,team:'',members:'',stage:0,role:0,opened:[],initial:'',initialReason:'',shockReason:'',final:'',risks:'',actions:'',roadmap:'',residual:'',memo:'',dissent:'',submitted:false,initialLocked:false,lockedInitial:null,startAt:null,votes:{}}}
function loadEpisode(ep){try{const z=JSON.parse(localStorage.getItem(KEY+':'+ep));model=z&&z.ep===ep?{...defaults(ep),...z}:defaults(ep)}catch(e){model=defaults(ep)}}
function load(){const ep=localStorage.getItem(KEY+':last');loadEpisode(DATA[ep]?ep:'s11')}
function switchEpisode(ep){if(!DATA[ep]||ep===model.ep)return;getFields();loadEpisode(ep);persist();render()}
function change(key,value){if(model.submitted)return;if(model.initialLocked&&(key==='initial'||key==='initialReason'))return;model[key]=value;persist()}
function field(id,label,value,placeholder='',rows=0){return '<label for="'+id+'">'+label+'</label>'+(rows?'<textarea id="'+id+'" placeholder="'+esc(placeholder)+'" '+(model.submitted||(model.initialLocked&&id==='initialReason')?'disabled':'')+'>'+esc(value)+'</textarea>':'<input id="'+id+'" placeholder="'+esc(placeholder)+'" value="'+esc(value)+'" '+(model.submitted?'disabled':'')+'>')}
function getFields(){if(model.submitted)return;for(const k of ['team','members','initialReason','shockReason','risks','actions','roadmap','residual','memo','dissent']){let e=$(k);if(e)change(k,e.value)}}
function vote(role,value){if(model.submitted)return;model.votes[role]=value;persist();render()}
function choose(id,value){if(id==='ep'){switchEpisode(value);return}getFields();change(id,value);render()}
function toStage(n){getFields();if(n>model.stage&&!valid())return;if(model.stage===3&&n>3&&!model.initialLocked){model.lockedInitial={decision:model.initial,reason:model.initialReason,at:new Date().toISOString()};model.initialLocked=true}model.stage=Math.max(0,Math.min(5,n));if(!model.startAt)model.startAt=Date.now();persist();render();window.scrollTo({top:0,behavior:'smooth'})}
function warn(msg){let e=$('message');if(e){e.innerHTML='<div class="warn">'+esc(msg)+'</div>';e.scrollIntoView({behavior:'smooth',block:'center'})}}
function valid(){if(model.submitted)return true;if(model.stage===0&&(!model.team.trim()||!model.members.trim())){warn('Isi nama kelompok dan anggota sebelum mulai.');return false}
if(model.stage===1)return true;
if(model.stage===2&&model.opened.length<DATA[model.ep].evidence.length){warn('Buka seluruh kartu bukti sebelum membuat keputusan awal.');return false}
if(model.stage===3&&!model.initialLocked&&(!model.initial||model.initialReason.trim().length<90)){warn('Pilih keputusan awal dan tulis alasan minimal 90 karakter.');return false}
if(model.stage===4&&model.shockReason.trim().length<90){warn('Jelaskan dampak evidence shock minimal 90 karakter.');return false}
return true}
function render(){const d=DATA[model.ep];$('app').innerHTML='<div class="steps">'+STAGES.map((t,i)=>'<span class="step '+(i===model.stage?'active':'')+'">'+(i+1)+'. '+t+'</span>').join('')+'</div><div id="message"></div><div class="panel small">Waktu kerja: <b><span id="clock">'+clockText()+'</span></b> · Batas sasaran: 30 menit · Forum setelah pengumpulan</div>'+page(d)+'<div class="actions"><button class="outline" onclick="toStage('+Math.max(0,model.stage-1)+')" '+(model.stage===0?'disabled':'')+'>← Sebelumnya</button>'+(model.stage<5?'<button onclick="toStage('+(model.stage+1)+')">Berikutnya →</button>':'<button onclick="exportText()">Unduh memo TXT ↓</button>')+'</div>';bindFields()}
function bindFields(){document.querySelectorAll('input:not([type]),input[type=text],textarea').forEach(e=>{e.addEventListener('input',()=>change(e.id,e.value))})}
function clockText(){if(!model.startAt)return 'Belum mulai';let t=Math.floor((Date.now()-model.startAt)/1000);return Math.floor(t/60)+'m '+String(t%60).padStart(2,'0')+'s'}
setInterval(()=>{let e=$('clock');if(e)e.textContent=clockText()},1000);
function page(d){let s=model.stage;
if(s===0)return '<section class="panel"><h2>Pilih episode</h2><div class="grid">'+Object.entries(DATA).map(([k,x])=>'<div class="box"><span class="pill">'+(k==='s11'?'SESI 11':'SESI 13')+'</span><h3>'+x.label+'</h3><p>'+x.focus+'</p><button class="'+(model.ep===k?'accent':'outline')+'" onclick="choose(\'ep\',\''+k+'\')">'+(model.ep===k?'Terpilih':'Pilih episode')+'</button></div>').join('')+'</div><p class="muted">Satu perangkat per kelompok. Kartu peran dibuka bergiliran; masing-masing peserta membaca informasi khususnya dan menyampaikan dalam rapat. Jangan tampilkan seluruh kartu sekaligus kepada tim.</p>'+field('team','Nama kelompok',model.team,'Contoh: Kelompok 4')+field('members','Nama anggota dan pembagian peran',model.members,'Sebutkan 4–5 anggota')+'<div class="box"><b>Alur 30 menit</b><p>0–4 pembagian peran · 4–12 bukti · 12–16 keputusan awal · 16–21 bukti tambahan · 21–30 keputusan akhir dan pengumpulan. Forum kelas sesudahnya.</p><p class="small muted">Mode lokal: jawaban tersimpan hanya pada browser/perangkat ini. Jangan masukkan data pribadi sensitif.</p></div></section>';
if(s===1)return '<section class="panel"><span class="pill">'+d.company+'</span><h2>Mandat Dewan Assurance</h2><p>'+d.brief+'</p><div class="warn">Pembagian informasi tidak simetris: setiap peserta hanya melihat kartu perannya. Informasi dapat dikomunikasikan secara lisan kepada tim.</div><label>Pilih kartu peran untuk ditampilkan</label><div class="grid">'+d.roles.map((r,i)=>'<button class="'+(model.role===i?'accent':'outline')+'" onclick="choose(\'role\','+i+')">'+esc(r[0])+'</button>').join('')+'</div><div class="panel private"><h3>KARTU PRIVAT — '+esc(d.roles[model.role][0])+'</h3><p><b>Informasi khusus:</b> '+esc(d.roles[model.role][1])+'</p><p><b>Pertanyaan wajib:</b> '+esc(d.roles[model.role][2])+'</p></div><p class="small muted">Fasilitator dapat meminta setiap anggota menyampaikan apa yang diketahui dan tidak diketahui, sebelum membuka Evidence Board.</p></section>';
if(s===2)return '<section class="panel"><h2>Evidence Board</h2><p>Periksa setiap bukti. Bedakan fakta yang sudah terverifikasi, dugaan risiko, dan bukti tambahan yang dibutuhkan. '+model.opened.length+'/'+d.evidence.length+' dokumen dibuka.</p><div class="bar"><span style="width:'+(model.opened.length/d.evidence.length*100)+'%"></span></div>'+d.evidence.map((e,i)=>'<details ontoggle="markEvidence('+i+',this.open)"><summary>'+esc(e[0])+(model.opened.includes(i)?' ✓':'')+'</summary><p>'+esc(e[1])+'</p><p class="tag">Pertanyaan penelaahan: '+esc(e[2])+'</p></details>').join('')+'<div class="box"><b>Pertanyaan diskusi</b><p>Apakah evidence membuktikan bahwa kontrol telah beroperasi? Mana yang hanya berupa pernyataan manajemen? Apakah masalahnya bersifat individual atau sistemik?</p></div></section>';
if(s===3)return '<section class="panel"><h2>Keputusan awal — dikunci pada babak berikutnya</h2><p><b>'+esc(d.initial)+'</b></p>'+d.choices.map(x=>'<label class="choice"><input type="radio" name="initial" '+(model.initial===x?'checked':'')+' onchange="choose(\'initial\',\''+x+'\')" '+(model.submitted||model.initialLocked?'disabled':'')+'> '+x+'</label>').join('')+field('initialReason','Argumen awal berbasis bukti (minimum 90 karakter)',model.initialReason,'Nyatakan fakta, keterbatasan bukti, blocker, dan alasan keputusan...',4)+'<p class="small muted">Keputusan awal akan dikunci ketika memasuki tahap berikutnya.</p></section>';
if(s===4)return '<section class="panel"><h2>Bukti Tambahan</h2><div class="warn"><h3>Informasi baru</h3><p>'+esc(d.shock)+'</p></div><div class="box"><b>Keputusan awal tersimpan:</b> '+esc(model.lockedInitial?.decision||model.initial)+'<p>'+esc(model.lockedInitial?.reason||model.initialReason)+'</p></div><p>'+esc(d.shockQuestion)+'</p>'+field('shockReason','Bagaimana informasi baru mengubah penilaian? (minimum 90 karakter)',model.shockReason,'Apa dampak pada risiko, kontrol, populasi, dan keputusan?',5)+'<p class="small muted">Jelaskan secara eksplisit jika keputusan tidak berubah; alasan mempertahankan keputusan tetap harus didukung bukti.</p></section>';
return '<section class="panel"><h2>Remediation Board & Executive Memo</h2><p><b>'+esc(d.final)+'</b></p><label>Keputusan akhir</label>'+d.choices.map(x=>'<label class="choice"><input type="radio" name="final" '+(model.final===x?'checked':'')+' onchange="choose(\'final\',\''+x+'\')" '+(model.submitted?'disabled':'')+'> '+x+'</label>').join('')+'<div class="box"><h3>Posisi setiap peran (opsional)</h3>'+d.roles.map(r=>'<label>'+esc(r[0])+'</label><select onchange="vote(\''+r[0]+'\',this.value)" '+(model.submitted?'disabled':'')+'><option value="">Belum menyampaikan posisi</option>'+d.choices.map(v=>'<option value="'+esc(v)+'" '+(model.votes[r[0]]===v?'selected':'')+'>'+esc(v)+'</option>').join('')+'</select>').join('')+'</div>'+field('risks','Dua risiko prioritas (cantumkan ID bukti: E01, E02, dan seterusnya)',model.risks,'Contoh: E02 – risiko utama dan dampaknya; E03 – risiko kedua dan dampaknya',4)+field('actions','Dua tindakan prioritas, pemilik kontrol, dan bukti retest',model.actions,'Sebutkan siapa, kontrol apa, bukti dan retest apa',4)+field('roadmap','Langkah tindak lanjut 30/60/90 hari (opsional)',model.roadmap,'Cantumkan urutan, dependensi, dan escalation',4)+field('residual','Risiko residual, kewenangan acceptance, dan dissent',model.residual,'Risiko yang belum terselesaikan dan persetujuan yang dibutuhkan',4)+field('memo','Catatan penutup (opsional)',model.memo,'Keputusan, argumen, bukti pendukung, blocker, syarat perubahan status',6)+field('dissent','Pendapat berbeda anggota tim (jika ada)',model.dissent,'Alasan pendapat berbeda, atau tulis: Tidak ada',3)+'<div class="'+(model.submitted?'ok':'warn')+'">'+(model.submitted?'Keputusan kelompok terkunci. Unduh hasil untuk forum kelas.':'Periksa kembali bukti dan pertimbangan sebelum mengunci keputusan akhir.')+'</div>'+(model.submitted?'':'<button class="accent" onclick="submitMemo()">Kunci keputusan & memo</button>')+' <button class="outline" onclick="exportText()">Ekspor TXT</button> <button class="outline" onclick="exportCSV()">Ekspor CSV</button> '+(model.submitted?'<details><summary>Debriefing: critical control gates</summary><ul>'+d.critical.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></details>':'')+'<p class="small muted">Penilaian dosen: risk linkage 20%; evidence 20%; control/remediation 20%; judgment/residual risk 25%; komunikasi 15%. Tidak ada skor otomatis untuk keputusan akhir karena penilaian bersifat kontekstual.</p></section>'}
function markEvidence(i,open){if(open&&!model.opened.includes(i)&&!model.submitted){model.opened.push(i);persist();let x=document.querySelector('.bar span');if(x)x.style.width=(model.opened.length/DATA[model.ep].evidence.length*100)+'%'}}
function submitMemo(){getFields();if(!model.final||new Set((model.risks.match(/E0[1-6]/gi)||[]).map(v=>v.toUpperCase())).size<2||model.risks.trim().length<55||model.actions.trim().length<60||model.residual.trim().length<35){warn('Lengkapi keputusan, dua risiko dengan ID bukti berbeda, tindakan dengan pemilik, dan risiko residual.');return}model.submitted=true;model.submittedAt=new Date().toISOString();persist();render()}
function exportCSV(){getFields();const row={episode:model.ep,kelompok:model.team,anggota:model.members,keputusan_awal:model.lockedInitial?.decision||model.initial,alasan_awal:model.lockedInitial?.reason||model.initialReason,waktu_kunci_awal:model.lockedInitial?.at||'',bukti_dibuka:model.opened.map(i=>DATA[model.ep].evidence[i][0]).join('; '),bukti_tambahan_respons:model.shockReason,keputusan_akhir:model.final,voting_peran:JSON.stringify(model.votes),risiko_dan_ID_bukti:model.risks,tindakan:model.actions,roadmap:model.roadmap,risiko_residual:model.residual,catatan:model.memo,pendapat_berbeda:model.dissent,waktu_pengumpulan:model.submittedAt||'',status:model.submitted?'TERKUNCI':'DRAF'};const keys=Object.keys(row);const csv=keys.join(',')+'\n'+keys.map(k=>'"'+String(row[k]??'').replace(/"/g,'""')+'"').join(',');const b=new Blob([csv],{type:'text/csv;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='SIPI_Decision_'+model.ep+'_'+model.team.replace(/[^a-z0-9_-]/gi,'_')+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function exportText(){getFields();let d=DATA[model.ep];let lines=['SIPI DECISION LAB — THE ASSURANCE BOARD',d.label,d.company,'Kelompok: '+model.team,'Anggota: '+model.members,'Tanggal ekspor: '+new Date().toLocaleString('id-ID'),'Status: '+(model.submitted?'TERKUNCI LOKAL':'DRAF'),'','Bukti dibaca: '+model.opened.map(i=>d.evidence[i][0]).join('; '),'','KEPUTUSAN AWAL: '+(model.lockedInitial?.decision||model.initial),(model.lockedInitial?.reason||model.initialReason),'Terkunci: '+(model.lockedInitial?.at||'Belum'),'','EVIDENCE SHOCK: '+d.shock,'PERUBAHAN PENILAIAN:',model.shockReason,'','KEPUTUSAN AKHIR: '+model.final,'','PENDAPAT PERAN:',JSON.stringify(model.votes),'','RISIKO:',model.risks,'','CONTROLS & REMEDIATION:',model.actions,'','30/60/90:',model.roadmap,'','RESIDUAL RISK:',model.residual,'','MEMO:',(model.memo||('Ringkasan keputusan '+model.final+'. Risiko utama: '+model.risks+'. Rencana tindakan: '+model.actions+'. Risiko residual dan syarat: '+model.residual)),'','DISSENT:',model.dissent,'','Rubrik: 20 risiko; 20 bukti; 20 kontrol; 25 judgment; 15 komunikasi.'];let blob=new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='SIPI_Decision_Lab_'+model.ep+'_'+model.team.trim().replace(/[^a-z0-9_-]+/gi,'_').slice(0,40)+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function resetAll(){if(confirm('Hapus progres episode ini?')){localStorage.removeItem(KEY+':'+model.ep);loadEpisode(model.ep);persist();render()}}
load();render();let foot=document.querySelector('footer');foot.insertAdjacentHTML('beforeend','<div style="margin:14px"><button class="outline" onclick="resetAll()">Reset progres lokal</button></div>');
</script></body></html>
