<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIPI Decision Lab — The Assurance Board</title><style>
:root{--navy:#142a41;--teal:#087e83;--gold:#d7a44c;--ink:#1c3041;--soft:#eff5f7;--line:#cbd9e0}*{box-sizing:border-box}body{margin:0;font:16px/1.55 system-ui,-apple-system,Segoe UI,Arial;background:#edf3f5;color:var(--ink)}header{background:linear-gradient(120deg,#142a41,#195574);color:white;padding:24px max(20px,calc((100vw - 1120px)/2));border-bottom:5px solid var(--gold)}header h1{margin:2px 0;font-size:30px}header p{margin:4px 0;opacity:.88}main{max-width:1120px;margin:22px auto;padding:0 18px 50px}.panel{background:white;border:1px solid var(--line);border-radius:15px;padding:22px;margin:15px 0;box-shadow:0 5px 16px #132e4210}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:13px}.box{border:1px solid var(--line);padding:17px;border-radius:12px;background:#f8fbfc}.muted{color:#53697b}.small{font-size:13px}.pill{display:inline-block;border:1px solid #a9cbd0;background:#e9f6f6;border-radius:20px;padding:3px 11px;font-size:12px;font-weight:700;color:#075a5c}h2{margin:0 0 12px}h3{margin:0 0 8px}button{border:0;border-radius:9px;padding:11px 17px;background:var(--navy);color:white;font-weight:700;cursor:pointer}button:hover{filter:brightness(1.1)}button:disabled{opacity:.4;cursor:not-allowed}.outline{background:white;border:1px solid #a6b9c5;color:#183b56}.danger{background:#963e3e}.accent{background:var(--teal)}input,textarea,select{font:inherit;border:1px solid #b3c6d0;border-radius:8px;padding:10px;background:white;max-width:100%;width:100%}textarea{min-height:90px;resize:vertical}label{display:block;font-weight:650;margin:9px 0 4px}.steps{display:flex;gap:5px;flex-wrap:wrap}.step{font-size:12px;padding:8px 10px;border-radius:8px;background:#dce8ed;color:#385269}.step.active{background:#146777;color:white}.actions{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:18px}.choice{display:block;padding:12px;border:1px solid var(--line);border-radius:9px;margin:7px 0;cursor:pointer;background:white}.choice:has(input:checked){border-color:#087e83;background:#edfafa}.choice input{width:auto;margin-right:10px}.private{background:#fff8e8;border-left:5px solid var(--gold)}.evidence{background:#f8fafb}.tag{font-size:12px;font-weight:700;color:#366174}details{border:1px solid var(--line);border-radius:9px;padding:12px;margin:8px 0;background:#fafcfd}summary{cursor:pointer;font-weight:700}.warn{border-left:4px solid #b46020;background:#fff8ea;padding:12px}.ok{border-left:4px solid #138466;background:#eaf8f2;padding:12px}.bar{height:8px;border-radius:8px;background:#d2e0e5;overflow:hidden}.bar span{display:block;height:100%;background:var(--teal)}footer{font-size:12px;color:#5f7480;text-align:center;margin:24px auto} @media(max-width:600px){header h1{font-size:24px}.panel{padding:16px}}@media print{button,.actions,header .small,.steps{display:none!important}body{background:white}.panel{box-shadow:none}}
</style></head><body><header><span class="pill">SIPI • Laboratorium Keputusan Profesional</span><h1>SIPI Decision Lab</h1><p>The Assurance Board · Simulasi Kelompok 30 Menit</p><p class="small">Investigasi Bukti · Keputusan Komite · Tindak Lanjut</p></header><main id="app"></main><footer>Seluruh kasus dan perusahaan dalam aplikasi bersifat simulatif. Hasil keputusan kelompok dibahas dalam forum kelas.</footer><script>
const DATA={integrated:{label:'The Financial Reporting Crisis',company:'PT Arunika Digital Group',focus:'ICoFR & Digital Assurance • Sesi 11 dan 13',brief:'PT Arunika Digital Group akan menyetujui laporan keuangan tahunannya. Pelaporan bergantung pada cloud ERP, bot rekonsiliasi, data analitik, dan narasi AI. Manajemen menyatakan seluruh salah saji telah dikoreksi. Komite harus menilai efektivitas ICoFR dan kelayakan persetujuan laporan, membedakan kelemahan kontrol yang terbukti dari dugaan hubungan sebab-akibat.',roles:[
['CFO','Persetujuan laporan tertunda berbiaya Rp120 juta per minggu. CFO menyatakan angka final sudah dikoreksi, tetapi belum menilai efektivitas kontrol sepanjang periode.','Apakah angka yang telah dikoreksi cukup untuk menyatakan ICoFR efektif?'],
['Controller','Dua rekonsiliasi bulanan tidak memiliki bukti sign-off. Tim mempunyai penjelasan lisan, tanpa rekaman review independen.','Bukti pengganti apa yang memadai dan apa keterbatasannya?'],
['Auditor Internal','Uji enam dari 12 rekonsiliasi menemukan dua pengecualian review. Perlu evaluasi lebih lanjut sebelum menyimpulkan seluruh populasi.','Bagaimana menghubungkan likelihood, magnitude, dan kontrol kompensasi?'],
['IT Control Owner','Role vendor cloud memiliki akses perubahan mapping jurnal selama 21 hari. Log login tersedia, tetapi log perubahan belum direkonsiliasi dengan approval.','Apa bukti hubungan atau ketidakhubungan akses dengan perubahan angka?'],
['Ketua Komite Audit','Komite menerima laporan final, hasil uji kontrol, dan catatan isu publikasi. Kesimpulan harus mengidentifikasi blocker dan prasyarat persetujuan.','Apa rekomendasi yang dapat dipertanggungjawabkan berdasarkan bukti yang tersedia?']],
evidence:[
['E01 • Rekonsiliasi penjualan–GL','Dokumen FIN-RC-12 | Disusun: 6 Januari | Pemilik: Controller | Cakupan: Desember. Saldo subledger piutang Rp19.028.400.000; GL piutang Rp19.003.400.000; selisih Rp25.000.000. Penjelasan: 11 transaksi akhir bulan menunggu posting. Dari enam rekonsiliasi bulanan yang diuji auditor, dua tidak memiliki tanda review. Lampiran working paper mencantumkan pembuat, tetapi kolom reviewer kosong.','Apakah jumlah yang dapat direkonsiliasi, tetapi tanpa jejak review, membuktikan kontrol beroperasi?','Sumber: rekonsiliasi internal dan catatan auditor; bukti dokumen langsung atas saldo/sampel, bukan bukti independen seluruh populasi.'],
['E02 • Hak akses cloud dan CUECs','Dokumen IT-AC-09 | Disusun: 8 Januari | Pemilik: IT Security | Cakupan: November–Desember. SOC 2 Type 2 vendor berlaku hingga September. Matriks CUECs mengharuskan pelanggan meninjau akses istimewa setiap triwulan. Role VEND-ADMIN dapat mengubah mapping GL selama 21 hari; satu login pukul 23:14 tercatat. Tidak ada log perubahan berpasangan yang membuktikan mapping diubah. Form review akses pelanggan belum disahkan.','Apa yang sungguh-sungguh didukung log login? Apa yang tidak bisa disimpulkan?','Sumber: log autentikasi sistem dan matriks CUECs; log dihasilkan sistem tetapi tidak cukup untuk atribusi perubahan konfigurasi.'],
['E03 • Bot RPA dan exception queue','Dokumen OPS-RPA-04 | Disusun: 7 Januari | Pemilik: Process Automation | Populasi: 12.480 transaksi Rp19,7 miliar. Status: 12.433 diterima; 47 ditolak (Rp310 juta). Dari 47, sebanyak 30 telah ditelusuri dengan tiket koreksi; 17 senilai Rp125 juta masih menunggu bukti posting. Laporan bot menyebut status completed karena seluruh file masukan berhasil dibaca, bukan karena seluruh transaksi berhasil diposting.','Apakah status completed cukup persuasif untuk asersi completeness dan cut-off?','Sumber: run log bot, exception queue, tiket koreksi; bukti sistem relevan tetapi belum direkonsiliasi penuh sampai GL.'],
['E04 • Pengujian jurnal penutupan','Dokumen IA-JE-02 | Disusun: 9 Januari | Pemilik: Internal Audit | Sampel: 40 dari 860 jurnal penutupan. Satu jurnal Rp2,4 miliar tanpa lampiran awal; dijurnal balik saat diminta auditor. Review independen tidak dapat diverifikasi. Materialitas laporan Rp3 miliar; performance materiality Rp1,8 miliar. Auditor belum menguji seluruh jurnal dari periode hak akses VEND-ADMIN. Nilai jurnal yang diuji bukan otomatis ukuran salah saji potensial.','Bagaimana bobot bukti jurnal dibanding cakupan dan potensi risiko pada populasi?','Sumber: ekstrak GL, log jurnal, dan kertas kerja audit; dokumen mendukung adanya pengecualian sampel, bukan estimasi salah saji populasi.'],
['E05 • Analitik dan narasi keuangan','Dokumen RPT-PUB-03 | Disusun: 10 Januari | Pemilik: Financial Reporting | Dashboard mencatat 100% reviewed untuk 12.433 transaksi yang diterima, tetapi 47 exception tidak masuk denominator. Draft narasi AI menyebut margin naik 4,2 poin berdasarkan snapshot v18; file final bertanda persetujuan controller, v20, menunjukkan kenaikan 3,7 poin. Klaim penyebab efisiensi pembelian belum dilengkapi data harga-volume. Draft belum dirilis.','Seberapa persuasif approval v20 untuk angka final dan apakah itu mendukung narasi kausal?','Sumber: snapshot v18/v20, definisi KPI, draf laporan; approval final membantu reliabilitas angka tetapi belum mendukung klaim sebab-akibat.']
],
shock:'Audit lanjutan menemukan dua jurnal tambahan Rp1,1 miliar dari periode akses vendor rangkap, belum memiliki review independen. Tidak ada bukti bahwa akses vendor menyebabkan jurnal tersebut. Pada saat yang sama, tim pelaporan ingin merilis narasi AI hari ini. Komite harus menilai apakah bukti baru mengubah kesimpulan ICoFR dan persetujuan publikasi.',shockQuestion:'Apa yang berubah setelah bukti baru? Hindari menyimpulkan fraud atau hubungan kausal tanpa dukungan.',initial:'Berdasarkan bukti awal, apa rekomendasi komite mengenai persetujuan laporan keuangan dan narasi publikasi?',final:'Putuskan Setujui / Setujui bersyarat / Tunda persetujuan, dengan dua bukti penentu, tindakan prioritas, dan syarat perubahan keputusan.',choices:['Setujui','Setujui bersyarat','Tunda persetujuan'],critical:['Pisahkan efektivitas ICoFR dari koreksi salah saji','Uji operasi review rekonsiliasi dan jurnal','Tinjau CUECs dan hak akses terhadap mapping GL','Rekonsiliasi exception RPA ke GL dan populasi analytics','Validasi laporan final serta narasi AI sebelum publikasi']
}};
const STAGES=['Mulai','Peran','Bukti','Keputusan Awal','Bukti Tambahan','Keputusan Akhir'];
const ROLE=['CFO','Controller','Auditor Internal','IT Control Owner','Ketua Komite Audit'];
const KEY='sipi-decision-integrated-v3';
let model={ep:'integrated',team:'',members:'',stage:0,role:0,opened:[],initial:'',initialReason:'',shockReason:'',final:'',icofr:'',evidenceLimit:'',risks:'',actions:'',roadmap:'',residual:'',memo:'',dissent:'',submitted:false,initialLocked:false,lockedInitial:null,startAt:null,votes:{},roleAssignments:{},roleArguments:{},evidenceAssessments:{}};
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function persist(){try{localStorage.setItem(KEY+':'+model.ep,JSON.stringify(model));localStorage.setItem(KEY+':last',model.ep)}catch(e){}}
function defaults(ep){return {ep,team:'',members:'',stage:0,role:0,opened:[],initial:'',initialReason:'',shockReason:'',final:'',icofr:'',evidenceLimit:'',risks:'',actions:'',roadmap:'',residual:'',memo:'',dissent:'',submitted:false,initialLocked:false,lockedInitial:null,startAt:null,votes:{},roleAssignments:{},roleArguments:{},evidenceAssessments:{}}}
function loadEpisode(ep){try{const z=JSON.parse(localStorage.getItem(KEY+':'+ep));model=z&&z.ep===ep?{...defaults(ep),...z}:defaults(ep)}catch(e){model=defaults(ep)}}
function load(){loadEpisode('integrated')}
function switchEpisode(ep){if(!DATA[ep]||ep===model.ep)return;getFields();loadEpisode(ep);persist();render()}
function change(key,value){if(model.submitted)return;if(model.initialLocked&&(key==='initial'||key==='initialReason'))return;model[key]=value;persist()}
function field(id,label,value,placeholder='',rows=0){return '<label for="'+id+'">'+label+'</label>'+(rows?'<textarea id="'+id+'" placeholder="'+esc(placeholder)+'" '+(model.submitted||(model.initialLocked&&id==='initialReason')?'disabled':'')+'>'+esc(value)+'</textarea>':'<input id="'+id+'" placeholder="'+esc(placeholder)+'" value="'+esc(value)+'" '+(model.submitted?'disabled':'')+'>')}
function getFields(){if(model.submitted)return;for(const k of ['team','members','initialReason','shockReason','evidenceLimit','risks','actions','roadmap','residual','memo','dissent']){let e=$(k);if(e)change(k,e.value)}}
function assignRole(role,value){if(model.submitted)return;model.roleAssignments[role]=value;persist();render()}
function setRoleArgument(role,value){if(model.submitted)return;model.roleArguments[role]=value;persist()}
function evidenceRating(id,value){if(model.submitted)return;model.evidenceAssessments[id]=value;persist()}
function vote(role,value){if(model.submitted)return;model.votes[role]=value;persist();render()}
function choose(id,value){if(id==='ep'){switchEpisode(value);return}getFields();change(id,value);render()}
function toStage(n){getFields();if(n>model.stage&&!valid())return;if(model.stage===3&&n>3&&!model.initialLocked){model.lockedInitial={decision:model.initial,reason:model.initialReason,at:new Date().toISOString()};model.initialLocked=true}model.stage=Math.max(0,Math.min(5,n));if(!model.startAt)model.startAt=Date.now();persist();render();window.scrollTo({top:0,behavior:'smooth'})}
function warn(msg){let e=$('message');if(e){e.innerHTML='<div class="warn">'+esc(msg)+'</div>';e.scrollIntoView({behavior:'smooth',block:'center'})}}
function valid(){if(model.submitted)return true;if(model.stage===0&&(!model.team.trim()||!model.members.trim())){warn('Isi nama kelompok dan anggota sebelum mulai.');return false}
if(model.stage===1){const mandatory=['CFO','Auditor Internal','Ketua Komite Audit'];if(mandatory.some(x=>!(model.roleAssignments[x]||'').trim()||!(model.roleArguments[x]||'').trim())){warn('Tugaskan CFO, Auditor Internal, dan Ketua Komite Audit; masing-masing perlu menulis satu posisi awal.');return false}return true;}
if(model.stage===2&&model.opened.length<DATA[model.ep].evidence.length){warn('Buka seluruh kartu bukti sebelum membuat keputusan awal.');return false}
if(model.stage===3&&!model.initialLocked&&(!model.initial||model.initialReason.trim().length<90)){warn('Pilih keputusan awal dan tulis alasan minimal 90 karakter.');return false}
if(model.stage===4&&model.shockReason.trim().length<90){warn('Jelaskan dampak evidence shock minimal 90 karakter.');return false}
return true}
function render(){const d=DATA[model.ep];$('app').innerHTML='<div class="steps">'+STAGES.map((t,i)=>'<span class="step '+(i===model.stage?'active':'')+'">'+(i+1)+'. '+t+'</span>').join('')+'</div><div id="message"></div><div class="panel small">Waktu kerja: <b><span id="clock">'+clockText()+'</span></b> · Batas sasaran: 30 menit · Forum setelah pengumpulan</div>'+page(d)+'<div class="actions"><button class="outline" onclick="toStage('+Math.max(0,model.stage-1)+')" '+(model.stage===0?'disabled':'')+'>← Sebelumnya</button>'+(model.stage<5?'<button onclick="toStage('+(model.stage+1)+')">Berikutnya →</button>':'<button onclick="exportText()">Unduh memo TXT ↓</button>')+'</div>';bindFields()}
function bindFields(){document.querySelectorAll('input:not([type]),input[type=text],textarea').forEach(e=>{e.addEventListener('input',()=>change(e.id,e.value))})}
function clockText(){if(!model.startAt)return 'Belum mulai';let t=Math.floor((Date.now()-model.startAt)/1000);return Math.floor(t/60)+'m '+String(t%60).padStart(2,'0')+'s'}
setInterval(()=>{let e=$('clock');if(e)e.textContent=clockText()},1000);
function page(d){let s=model.stage;
if(s===0)return '<section class="panel"><span class="pill">ICoFR × Digital Assurance</span><h2>'+esc(d.label)+'</h2><p><b>'+esc(d.company)+'</b> · '+esc(d.focus)+'</p><p>Diskusikan satu kasus secara berkelompok. Gunakan ID bukti saat menyusun alasan. Kesimpulan kelompok akan menjadi bahan forum kelas setelah 30 menit.</p>'+field('team','Nama kelompok',model.team,'Contoh: Kelompok 4')+field('members','Anggota dan pembagian peran',model.members,'Cantumkan nama anggota')+'<div class="box"><b>Alur 30 menit</b><p>0–4 peran dan briefing · 4–12 analisis lima bukti · 12–16 keputusan awal · 16–21 bukti tambahan · 21–30 keputusan akhir dan ekspor. Forum kelas dilakukan setelah pengerjaan.</p></div></section>';
if(s===1)return '<section class="panel"><h2>Rapat Komite — Pembagian Peran</h2><p>'+esc(d.brief)+'</p><p>Setiap kelompok menugaskan minimal tiga posisi: CFO, Auditor Internal, dan Ketua Komite Audit. Anggota boleh merangkap. Setiap pemegang peran membaca mandat lalu menyampaikan satu sikap awal kepada tim, bukan sekadar memilih nama peran.</p><div class="grid">'+d.roles.map((r,i)=>'<div class="box"><button class="outline" onclick="choose(\'role\','+i+')">Lihat mandat '+esc(r[0])+'</button><label>Nama pemegang peran</label><input placeholder="Nama / inisial" value="'+esc(model.roleAssignments[r[0]]||'')+'" oninput="assignRole(\''+r[0]+'\',this.value)" '+(model.submitted?'disabled':'')+'></div>').join('')+'</div><div class="panel private"><h3>'+esc(d.roles[model.role][0])+'</h3><p><b>Informasi mandat:</b> '+esc(d.roles[model.role][1])+'</p><p><b>Pertanyaan untuk menantang forum:</b> '+esc(d.roles[model.role][2])+'</p><label>Posisi awal singkat (1 kalimat, maksimal ±20 kata)</label><textarea oninput="setRoleArgument(\''+d.roles[model.role][0]+'\',this.value)" '+(model.submitted?'disabled':'')+'>'+esc(model.roleArguments[d.roles[model.role][0]]||'')+'</textarea></div><p class="small muted">Perbedaan pendapat antarperan adalah bagian dari latihan. Tidak ada kewajiban semua anggota langsung setuju.</p></section>';
if(s===2)return '<section class="panel"><h2>Evidence Room — Berkas Kerja</h2><p>Lima dokumen memiliki asal, periode, cakupan, dan keterbatasan berbeda. Baca terlebih dahulu sebelum menilai kekuatan pembuktiannya. Penilaian persuasivitas merupakan kesimpulan kelompok, bukan skor bawaan dokumen.</p><div class="bar"><span style="width:'+(model.opened.length/d.evidence.length*100)+'%"></span></div>'+d.evidence.map((e,i)=>'<details ontoggle="markEvidence('+i+',this.open)"><summary>'+esc(e[0])+(model.opened.includes(i)?' ✓':'')+'</summary><p>'+esc(e[1])+'</p><p class="small muted">'+esc(e[3])+'</p><p><b>Pertanyaan pemeriksaan:</b> '+esc(e[2])+'</p></details>').join('')+'<p class="small muted">Untuk menghemat waktu, bagi lima dokumen antaranggota. Pada Decision Canvas kelompok wajib mempertahankan penilaian persuasivitas minimal dua dokumen yang paling menentukan.</p></section>';
if(s===3)return '<section class="panel"><h2>Keputusan awal — dikunci pada babak berikutnya</h2><p><b>'+esc(d.initial)+'</b></p>'+d.choices.map(x=>'<label class="choice"><input type="radio" name="initial" '+(model.initial===x?'checked':'')+' onchange="choose(\'initial\',\''+x+'\')" '+(model.submitted||model.initialLocked?'disabled':'')+'> '+x+'</label>').join('')+field('initialReason','Argumen awal berbasis bukti (minimum 90 karakter)',model.initialReason,'Nyatakan fakta, keterbatasan bukti, blocker, dan alasan keputusan...',4)+'<p class="small muted">Keputusan awal akan dikunci ketika memasuki tahap berikutnya.</p></section>';
if(s===4)return '<section class="panel"><h2>Bukti Tambahan</h2><div class="warn"><h3>Informasi baru</h3><p>'+esc(d.shock)+'</p></div><div class="box"><b>Keputusan awal tersimpan:</b> '+esc(model.lockedInitial?.decision||model.initial)+'<p>'+esc(model.lockedInitial?.reason||model.initialReason)+'</p></div><p>'+esc(d.shockQuestion)+'</p>'+field('shockReason','Bagaimana informasi baru mengubah penilaian? (minimum 90 karakter)',model.shockReason,'Apa dampak pada risiko, kontrol, populasi, dan keputusan?',5)+'<p class="small muted">Jelaskan secara eksplisit jika keputusan tidak berubah; alasan mempertahankan keputusan tetap harus didukung bukti.</p></section>';
return '<section class="panel"><h2>Decision Canvas — Keputusan Komite</h2><p>Berikan dua penilaian berbeda. Kesimpulan ICoFR tidak otomatis menentukan apakah angka dan narasi laporan siap dipublikasikan.</p><label>1. Penilaian efektivitas ICoFR</label>'+['Efektif berdasarkan bukti','Terdapat defisiensi; tingkat keparahan perlu dinilai','Belum cukup bukti menyimpulkan efektivitas'].map(x=>'<label class="choice"><input type="radio" name="icofr" '+(model.icofr===x?'checked':'')+' onchange="choose(\'icofr\',\''+x+'\')" '+(model.submitted?'disabled':'')+'> '+x+'</label>').join('')+'<label>2. Keputusan persetujuan laporan</label>'+d.choices.map(x=>'<label class="choice"><input type="radio" name="final" '+(model.final===x?'checked':'')+' onchange="choose(\'final\',\''+x+'\')" '+(model.submitted?'disabled':'')+'> '+x+'</label>').join('')+field('risks','3. Dua risiko prioritas dan ID bukti terkait',model.risks,'E01 — risiko/asersi/dampak; E03 — risiko/asersi/dampak',3)+'<div class="box"><h3>Penilaian persuasivitas dua bukti</h3><p class="small muted">Pilih dua bukti yang paling menentukan dan simpulkan daya buktinya berdasarkan sumber, relevansi, reliabilitas, dan kecukupan.</p>'+['E01','E02','E03','E04','E05'].map(id=>'<label>'+id+'</label><select onchange="evidenceRating(\''+id+'\',this.value)" '+(model.submitted?'disabled':'')+'><option value="">Tidak dipilih</option>'+['Kuat','Sedang','Lemah'].map(v=>'<option value="'+v+'" '+(model.evidenceAssessments[id]===v?'selected':'')+'>'+v+'</option>').join('')+'</select>').join('')+'</div>'+field('evidenceLimit','4. Mengapa dua bukti tersebut persuasif atau belum memadai?',model.evidenceLimit,'Contoh: bukti review independen atau cakupan testing belum tersedia',2)+field('actions','5. Dua tindakan segera: pemilik dan bukti penyelesaian',model.actions,'Pemilik — tindakan — bukti retest atau kriteria closure',3)+field('residual','6. Syarat persetujuan atau risiko residual',model.residual,'Kondisi yang harus dipenuhi dan siapa yang berwenang',2)+'<details><summary>Isian tambahan (opsional)</summary>'+field('roadmap','Roadmap 30/60/90 hari',model.roadmap,'Tindak lanjut pascakeputusan',2)+field('memo','Catatan komite',model.memo,'Pertimbangan tambahan',2)+field('dissent','Pendapat berbeda',model.dissent,'Jika ada',2)+'<label>Posisi tiap peran</label>'+d.roles.map(r=>'<label>'+esc(r[0])+'</label><select onchange="vote(\''+r[0]+'\',this.value)" '+(model.submitted?'disabled':'')+'><option value="">Belum dicatat</option>'+d.choices.map(v=>'<option value="'+esc(v)+'" '+(model.votes[r[0]]===v?'selected':'')+'>'+esc(v)+'</option>').join('')+'</select>').join('')+'</details><div class="'+(model.submitted?'ok':'warn')+'">'+(model.submitted?'Keputusan terkunci. Unduh hasil untuk diskusi forum kelas.':'Periksa kedua penilaian, rujukan bukti, dan syarat keputusan sebelum mengunci.')+'</div>'+(model.submitted?'':'<button class="accent" onclick="submitMemo()">Kunci keputusan komite</button>')+' <button class="outline" onclick="exportText()">Ekspor TXT</button> <button class="outline" onclick="exportCSV()">Ekspor CSV</button> '+(model.submitted?'<details><summary>Pokok debriefing kelas</summary><ul>'+d.critical.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></details>':'')+'<p class="small muted">Rubrik: evaluasi bukti 25%, judgment ICoFR dan laporan 25%, risiko 20%, tindakan kontrol 20%, akuntabilitas 10%. Penilaian dilakukan dosen.</p></section>'}

function markEvidence(i,open){if(open&&!model.opened.includes(i)&&!model.submitted){model.opened.push(i);persist();let x=document.querySelector('.bar span');if(x)x.style.width=(model.opened.length/DATA[model.ep].evidence.length*100)+'%'}}
function submitMemo(){getFields();const ids=new Set((model.risks.match(/E0[1-5]/gi)||[]).map(x=>x.toUpperCase()));if(!model.icofr||!model.final||ids.size<2||model.risks.trim().length<55||model.evidenceLimit.trim().length<55||[...ids].some(id=>!model.evidenceAssessments[id])||model.actions.trim().length<55||model.residual.trim().length<30){warn('Lengkapi kedua keputusan, dua risiko ber-ID bukti, rating persuasivitas untuk kedua ID tersebut, alasannya, tindakan, dan syarat keputusan.');return}model.submitted=true;model.submittedAt=new Date().toISOString();persist();render()}
function exportCSV(){getFields();const row={episode:model.ep,kelompok:model.team,anggota:model.members,keputusan_awal:model.lockedInitial?.decision||model.initial,alasan_awal:model.lockedInitial?.reason||model.initialReason,waktu_kunci_awal:model.lockedInitial?.at||'',bukti_dibuka:model.opened.map(i=>DATA[model.ep].evidence[i][0]).join('; '),posisi_peran:JSON.stringify(model.roleArguments),pemegang_peran:JSON.stringify(model.roleAssignments),persuasivitas_bukti:JSON.stringify(model.evidenceAssessments),bukti_tambahan_respons:model.shockReason,penilaian_icofr:model.icofr,keputusan_akhir:model.final,keterbatasan_bukti:model.evidenceLimit,perubahan_keputusan:(model.lockedInitial?.decision||model.initial)+' → '+model.final,voting_peran:JSON.stringify(model.votes),risiko_dan_ID_bukti:model.risks,tindakan:model.actions,roadmap:model.roadmap,risiko_residual:model.residual,catatan:model.memo,pendapat_berbeda:model.dissent,waktu_pengumpulan:model.submittedAt||'',status:model.submitted?'TERKUNCI':'DRAF'};const keys=Object.keys(row);const csv=keys.join(',')+'\n'+keys.map(k=>'"'+String(row[k]??'').replace(/"/g,'""')+'"').join(',');const b=new Blob([csv],{type:'text/csv;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='SIPI_Decision_'+model.ep+'_'+model.team.replace(/[^a-z0-9_-]/gi,'_')+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function exportText(){getFields();let d=DATA[model.ep];let lines=['SIPI DECISION LAB — THE ASSURANCE BOARD',d.label,d.company,'Kelompok: '+model.team,'Anggota: '+model.members,'Tanggal ekspor: '+new Date().toLocaleString('id-ID'),'Status: '+(model.submitted?'TERKUNCI LOKAL':'DRAF'),'','Bukti dibaca: '+model.opened.map(i=>d.evidence[i][0]).join('; '),'','KEPUTUSAN AWAL: '+(model.lockedInitial?.decision||model.initial),(model.lockedInitial?.reason||model.initialReason),'Terkunci: '+(model.lockedInitial?.at||'Belum'),'','EVIDENCE SHOCK: '+d.shock,'PERUBAHAN PENILAIAN:',model.shockReason,'','PENILAIAN ICoFR: '+model.icofr,'KEPUTUSAN AKHIR: '+model.final,'','PERBANDINGAN: '+(model.lockedInitial?.decision||model.initial)+' → '+model.final,'','EVALUASI PERSUASIVITAS:',JSON.stringify(model.evidenceAssessments),'POSISI PERAN:',JSON.stringify(model.roleArguments),'KETERBATASAN BUKTI:',model.evidenceLimit,'','PENDAPAT PERAN:',JSON.stringify(model.votes),'','RISIKO:',model.risks,'','CONTROLS & REMEDIATION:',model.actions,'','30/60/90:',model.roadmap,'','RESIDUAL RISK:',model.residual,'','MEMO:',(model.memo||('Ringkasan keputusan '+model.final+'. Risiko utama: '+model.risks+'. Rencana tindakan: '+model.actions+'. Risiko residual dan syarat: '+model.residual)),'','DISSENT:',model.dissent,'','Rubrik: 25 bukti; 25 judgment; 20 risiko; 20 kontrol; 10 akuntabilitas.'];let blob=new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='SIPI_Decision_Lab_'+model.ep+'_'+model.team.trim().replace(/[^a-z0-9_-]+/gi,'_').slice(0,40)+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function resetAll(){if(confirm('Hapus progres episode ini?')){localStorage.removeItem(KEY+':'+model.ep);loadEpisode(model.ep);persist();render()}}
load();render();let foot=document.querySelector('footer');foot.insertAdjacentHTML('beforeend','<div style="margin:14px"><button class="outline" onclick="resetAll()">Reset progres lokal</button></div>');
