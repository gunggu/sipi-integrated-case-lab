function wireEvidence(i){const cards=[...document.querySelectorAll(".artifact")],readCount=document.getElementById("readcount");function update(){const viewed=read(seenKey(i),[]);readCount.textContent=viewed.length+"/"+EVIDENCE[i].length+" diperiksa"}cards.forEach(d=>d.addEventListener("toggle",()=>{if(d.open){const v=read(seenKey(i),[]),id=d.dataset.id;if(!v.includes(id)){v.push(id);write(seenKey(i),v)}d.querySelector(".seen").textContent="Dibaca";update()}}));document.getElementById("openAll").onclick=()=>cards.forEach(d=>d.open=true);document.getElementById("closeAll").onclick=()=>cards.forEach(d=>d.open=false);update()}

async function sha256(value){const buffer=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(value));return Array.from(new Uint8Array(buffer),b=>b.toString(16).padStart(2,"0")).join("")}
const result=s=>({app:"PSI11_FFR",version:2,groupId:s.groupId,group:s.group,startedAt:s.startedAt,completedAt:s.completedAt||null,exportedAt:new Date().toISOString(),answers:s.answers.map(a=>({stage:a.stage,choice:a.choice,reason:a.reason,evidenceIds:a.evidenceIds,procedure:a.procedure})),mode:"formative-offline-class-discussion"});
function renderStart(){clearInterval(clock);const s=read(STORE,null);app.innerHTML='<div class="grid"><section class="panel"><span class="pill">30 MENIT • 4 TAHAP • 4 MENIT SERAH HASIL</span><h1>The Missing Evidence</h1><p class="notice"><strong>Jawaban dibahas bersama di kelas.</strong> Pilihan kelompok dikunci; skor dan evaluasi tidak ditampilkan selama simulasi.</p><p>Simulasi pengambilan keputusan saat investigasi forensik digital dan continuous auditing.</p><p>Dalam kelompok 3–5 mahasiswa, identifikasi prioritas, pertahankan bukti dan tentukan kesimpulan yang dapat dipertanggungjawabkan.</p><div class="notice">Satu perangkat per kelompok. Tanpa SQL atau unggahan dokumen. Di akhir sesi, unduh hasil JSON untuk diberikan kepada dosen.</div></section><section class="panel"><h2>Masuk area mahasiswa</h2>'+(s?'<p class="muted">Ada sesi tersimpan untuk <b>'+esc(s.group)+'</b>.</p><button class="btn" id="resume">Lanjutkan sesi</button><button class="btn secondary" id="reset">Mulai ulang di perangkat ini</button>':'<label>Nama kelompok<input class="input" id="groupName" maxlength="70" placeholder="Contoh: Kelompok 4"></label><button class="btn" id="start">Mulai simulasi</button>')+'<p class="muted">Penghitungan 30 menit total: maksimal 26 menit keputusan dan 4 menit untuk ekspor serta debrief. Timer menggunakan jam perangkat dan tidak boleh dipakai sebagai bukti waktu resmi. Progres tersimpan pada browser ini.</p></section></div>';
if(s){document.getElementById("resume").onclick=renderStudent;document.getElementById("reset").onclick=()=>{if(confirm("Hapus sesi kelompok dari browser ini?")){localStorage.removeItem(STORE);for(let i=0;i<4;i++)localStorage.removeItem(seenKey(i));renderStart()}}}else{document.getElementById("start").onclick=()=>{const name=document.getElementById("groupName").value.trim();if(name.length<2)return showError("Nama kelompok minimal 2 karakter.");write(STORE,{groupId:groupId(),group:name,startedAt:Date.now(),answers:[],completedAt:null});renderStudent()}}}
function showError(s){status.textContent=s}
function renderStudent(){clearInterval(clock);status.textContent="";const s=read(STORE,null);if(!s)return renderStart();if(s.answers.length>=4||Date.now()-s.startedAt>=1560000)return renderFinish(s);const i=s.answers.length,stage=STAGES[i];const remaining=1560000-(Date.now()-s.startedAt);
app.innerHTML='<div class="grid"><section class="panel caseleft"><span class="pill">TAHAP '+(i+1)+' DARI 4</span><h1>'+esc(stage.title)+'</h1><b>'+stage.time+'</b><p>'+esc(stage.context)+'</p>'+evidenceRoom(i)+'</section><section class="panel decisionsticky"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><strong>Sisa waktu investigasi</strong><strong class="timer" id="timer">'+seconds(remaining)+'</strong></div><div class="meter"><div style="width:'+(i/4*100)+'%"></div></div><h2>Keputusan kelompok</h2><p class="muted">Bahas alasan sebelum mengunci pilihan.</p>'+stage.choices.map(c=>'<label class="choice"><input type="radio" name="choice" value="'+c[0]+'"><b>'+esc(c[1])+'</b><small>'+esc(c[2])+'</small></label>').join("")+practiceHTML(i)+'<label>Alasan keputusan<input class="input" id="reason" maxlength="220" placeholder="Jelaskan trade-off dan keterbatasan, min. 25 karakter"></label><button class="btn" id="lock">Kunci keputusan</button><div id="feedback"></div></section></div>';
wireEvidence(i);const deadline=s.startedAt+1560000;clock=setInterval(()=>{const remain=deadline-Date.now(),el=document.getElementById("timer");if(el)el.textContent=seconds(remain);if(remain<=0){clearInterval(clock);renderStudent()}},1000);
document.getElementById("lock").onclick=()=>{const selected=document.querySelector('input[name="choice"]:checked')?.value,reason=document.getElementById("reason").value.trim(),c=stage.choices.find(x=>x[0]===selected);const cited=[...document.querySelectorAll(".evidence-cite:checked")].map(x=>x.value);const procedure=document.querySelector('input[name="procedure"]:checked')?.value;if(!c||reason.length<25||cited.length<1||cited.length>2||(PRACTICE[i]&&!procedure))return showError("Pilih tindakan, rujuk 1–2 artefak, pilih prosedur bila tersedia, dan tulis alasan minimal 25 karakter.");if(Date.now()>=deadline)return renderStudent();s.answers.push({stage:i,choice:c[0],reason,evidenceIds:cited,procedure:procedure||null});if(s.answers.length===4)s.completedAt=Date.now();write(STORE,s);clearInterval(clock);document.getElementById("lock").disabled=true;document.querySelectorAll("input").forEach(el=>el.disabled=true);document.getElementById("feedback").innerHTML='<div class="notice"><b>Keputusan telah dicatat</b><p>Pilihan, alasan, dan referensi bukti kelompok disimpan. Konsekuensi dan evaluasi keputusan akan dibahas bersama dosen setelah seluruh kelompok selesai.</p><button class="btn secondary" id="next">Lanjutkan</button></div>';document.getElementById("next").onclick=renderStudent}}
function download(filename,data){const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));const a=document.createElement("a");a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function renderFinish(s){clearInterval(clock);const finished=s.answers.length===4;app.innerHTML='<section class="panel"><span class="pill">'+(finished?"JAWABAN TERKUNCI":"WAKTU INVESTIGASI SELESAI")+'</span><h1>Siap untuk diskusi kelas</h1><p class="muted">'+esc(s.group)+' · '+esc(s.groupId||"")+'</p><div class="notice"><strong>'+s.answers.length+' dari 4 keputusan telah direkam.</strong><p>Tidak ada penilaian benar/salah atau skor yang dibuka pada tahap ini. Siapkan argumentasi kelompok; pembahasan dilakukan bersama dosen setelah semua kelompok menyerahkan hasil.</p></div><h2>Ringkasan jawaban kelompok</h2>'+s.answers.map((a,i)=>'<details class="artifact"><summary><strong>Tahap '+(i+1)+' · '+esc(STAGES[i].title)+'</strong><span class="seen">Buka ringkasan</span></summary><div class="artifactbody"><p><strong>Keputusan:</strong> '+esc(STAGES[i].choices.find(c=>c[0]===a.choice)?.[1]||a.choice)+'</p><p><strong>Referensi bukti:</strong> '+esc((a.evidenceIds||[]).join(", ")||"Tidak dicatat")+'</p>'+(PRACTICE[i]?'<p><strong>Prosedur:</strong> '+esc(PRACTICE[i].options.find(x=>x.id===a.procedure)?.label||"Belum diisi")+'</p>':"")+'<p><strong>Alasan kelompok:</strong> '+esc(a.reason)+'</p></div></details>').join("")+'<h3>Pertanyaan untuk diskusi pleno</h3><ol><li>Bukti apa yang paling menentukan dan apa keterbatasannya?</li><li>Trade-off apa yang mungkin membuat kelompok lain memilih tindakan berbeda?</li><li>Kesimpulan apa yang masih belum dapat dibenarkan oleh bukti?</li></ol><div class="notice warn"><strong>Langkah akhir:</strong> unduh berkas jawaban JSON dan serahkan kepada dosen. Diskusikan hasil di kelas; jangan mengubah jawaban yang sudah terkunci.</div><button class="btn" id="download">Unduh jawaban kelompok (JSON)</button><button class="btn secondary" onclick="window.print()">Cetak ringkasan diskusi</button><p class="muted">Berkas berisi pilihan, alasan, dan ID bukti; penilaian dilakukan dari dashboard dosen setelah berkas diimpor.</p></section>';document.getElementById("download").onclick=()=>download("PSI11_FFR_"+s.group.replace(/[^a-zA-Z0-9_-]/g,"_")+".json",result(s))}
function login(){clearInterval(clock);app.innerHTML='<section class="panel"><span class="pill">AREA DOSEN • PROTEKSI RINGAN SHA-256</span><h1>Dashboard Dosen</h1><div class="notice warn">Mode uji coba GitHub Pages: hash sandi dan kode dapat diperiksa publik. Jangan gunakan sandi akun pribadi. Semua hasil mahasiswa perlu diimpor manual.</div><form id="login"><label>Sandi dosen<input class="input" type="password" id="password" autocomplete="off" required></label><button class="btn">Masuk</button></form></section>';document.getElementById("login").onsubmit=async e=>{e.preventDefault();const hash=await sha256(document.getElementById("password").value);if(hash!==HASH)return showError("Sandi dosen tidak sesuai.");teacherUnlocked=true;dashboard()}}
function validSubmission(d){if(!d||d.app!=="PSI11_FFR"||d.version!==2||typeof d.group!=="string"||d.group.length<2||d.group.length>70||typeof d.groupId!=="string"||!/^FFR-[0-9A-F]{8}$/.test(d.groupId)||!Number.isFinite(d.startedAt)||!Array.isArray(d.answers)||d.answers.length>4)return false;return d.answers.every((a,i)=>a.stage===i&&STAGES[i].choices.some(c=>c[0]===a.choice)&&typeof a.reason==="string"&&a.reason.length>=25&&a.reason.length<=220&&Array.isArray(a.evidenceIds)&&a.evidenceIds.length>=1&&a.evidenceIds.length<=2&&new Set(a.evidenceIds).size===a.evidenceIds.length&&a.evidenceIds.every(id=>EVIDENCE[i].some(e=>e.id===id))&&(!PRACTICE[i]||PRACTICE[i].options.some(p=>p.id===a.procedure)))}
function normalize(d){const a=d.answers.map((r,i)=>{const c=STAGES[i].choices.find(x=>x[0]===r.choice);return {stage:i,choice:c[0],reason:r.reason,evidenceIds:r.evidenceIds,procedure:r.procedure||null,score:calculateAnswer({...r,stage:i}),consequence:c[4]}});return {app:"PSI11_FFR",version:2,groupId:d.groupId,group:d.group,startedAt:d.startedAt,completedAt:d.completedAt,answers:a,score:a.reduce((sum,x)=>sum+x.score,0),maxScore:112}}
function dashboard(){if(!teacherUnlocked)return login();const entries=read(IMPORTS,{}),all=Object.values(entries);app.innerHTML='<section class="panel"><div class="inline" style="justify-content:space-between"><div><span class="pill">AREA DOSEN</span><h1>Ringkasan kelas</h1></div><button class="btn secondary" id="logout">Keluar</button></div><div class="notice warn">Skor otomatis hanya indikator tindakan, bukti, dan praktik; kualitas alasan dinilai dosen. Tidak ada koneksi antarperangkat. Impor file JSON dari kelompok untuk menggabungkan hasil. Data yang diimpor hanya tersimpan di browser dosen ini. SHA-256 bukan autentikasi aman.</div><div class="inline"><div class="chip">Kelompok diimpor: <strong>'+all.length+'</strong></div><div class="chip">Selesai: <strong>'+all.filter(x=>x.answers.length===4).length+'</strong></div></div><h3>Impor hasil kelompok</h3><input class="input" id="files" type="file" accept=".json,application/json" multiple><button class="btn" id="import">Impor JSON</button><button class="btn secondary" id="export">Ekspor rekap CSV</button><button class="btn secondary" id="clear">Hapus impor lokal</button><h3>Hasil kelompok</h3><div class="scroll"><table><thead><tr><th>Kelompok</th><th>Tahap</th><th>Skor</th><th>Mulai (perangkat kelompok)</th></tr></thead><tbody>'+all.map(e=>'<tr><td>'+esc(e.group)+'</td><td>'+e.answers.length+'/4</td><td>'+e.score+'/112</td><td>'+esc(new Date(e.startedAt).toLocaleString("id-ID"))+'</td></tr>').join("")+'</tbody></table></div><h3>Distribusi keputusan</h3>'+STAGES.map((stage,i)=>'<div class="notice"><b>Tahap '+(i+1)+' — '+esc(stage.title)+'</b>'+stage.choices.map(c=>'<p>'+esc(c[1])+': <strong>'+all.filter(x=>x.answers[i]?.choice===c[0]).length+'</strong></p>').join("")+'</div>').join("")+'<h3>Audit trail jawaban kelompok</h3>'+all.map(e=>'<details class="artifact"><summary><strong>'+esc(e.group)+' • '+esc(e.groupId)+'</strong><span class="seen">Lihat alasan</span></summary><div class="artifactbody">'+e.answers.map((a,i)=>'<div class="notice"><b>Tahap '+(i+1)+' — '+esc(STAGES[i].title)+'</b><p>Tindakan: '+esc(STAGES[i].choices.find(c=>c[0]===a.choice)?.[1]||a.choice)+'</p><p>Bukti: '+esc(a.evidenceIds.join(', '))+'</p><p>Prosedur: '+esc(PRACTICE[i]?.options.find(p=>p.id===a.procedure)?.label||'-')+'</p><p>Alasan: '+esc(a.reason)+'</p></div>').join("")+'</div></details>').join("")+'<div class="notice"><b>Rubrik penilaian dosen (manual)</b><p>Periksa ketepatan rujukan bukti, kesadaran ketidakpastian, alasan trade-off, dan proporsionalitas kesimpulan. Skor otomatis hanya indikator; jangan menjadikannya nilai final tanpa telaah alasan.</p></div><p class="muted">Catatan: hasil JSON, jam perangkat, dan skor dapat dimodifikasi oleh peserta. Gunakan untuk diskusi formatif, bukan ujian berintegritas tinggi.</p></section>';
document.getElementById("logout").onclick=()=>{teacherUnlocked=false;login()};document.getElementById("clear").onclick=()=>{if(confirm("Hapus seluruh hasil impor di browser dosen?")){localStorage.removeItem(IMPORTS);dashboard()}};
document.getElementById("import").onclick=async()=>{const files=Array.from(document.getElementById("files").files),data=read(IMPORTS,{});let count=0;for(const file of files){try{if(file.size>100000)throw Error("Berkas terlalu besar.");const parsed=JSON.parse(await file.text());if(!validSubmission(parsed))throw Error("Format hasil tidak sesuai.");const normal=normalize(parsed);if(data[normal.groupId]&&!confirm("Hasil dengan ID "+normal.groupId+" sudah diimpor. Timpa data lama?"))continue;data[normal.groupId]=normal;count++}catch(e){showError(file.name+": "+e.message)}}write(IMPORTS,data);if(count)dashboard()};
document.getElementById("export").onclick=()=>{const rows=[["Kelompok","Tahap selesai","Skor","Mulai"],...all.map(e=>[e.group,e.answers.length,e.score,new Date(e.startedAt).toISOString()])];const csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\r\n");const blob=URL.createObjectURL(new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"}));const a=document.createElement("a");a.href=blob;a.download="PSI11_Rekap_Kelas.csv";a.click();setTimeout(()=>URL.revokeObjectURL(blob),1000)}
}
document.getElementById("studentNav").onclick=()=>{mode="student";renderStart()};document.getElementById("teacherNav").onclick=()=>{mode="teacher";teacherUnlocked?dashboard():login()};renderStart();
</script></body></html>
