<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forensic First Response | PSI Sesi 11</title><meta name="theme-color" content="#09182d">
<style>
:root{font:15px/1.55 system-ui,-apple-system,Segoe UI,sans-serif;color:#ebf4ff;background:#081629}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 88% 0,#173c5b,transparent 48%),#081629;min-height:100vh}.wrap{max-width:1120px;margin:auto;padding:20px}header{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-bottom:18px;margin-bottom:22px;border-bottom:1px solid #3b556c}.eyebrow{font-size:11px;letter-spacing:.13em;color:#52dfdb;font-weight:800}h1{font-size:clamp(27px,4vw,43px);line-height:1.15}h2{font-size:23px;margin:8px 0 20px}h3{font-size:16px;margin-top:25px}p{line-height:1.65}.muted{color:#b7c8db}.panel{border:1px solid #365472;background:#11283f;border-radius:18px;padding:24px;box-shadow:0 12px 35px #0003}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.btn{background:#2bdbd8;border:0;border-radius:11px;padding:12px 17px;color:#07232c;font:inherit;font-weight:800;cursor:pointer}.btn.secondary{color:#eef9ff;background:#244760;border:1px solid #628196}.btn:disabled{opacity:.45;cursor:not-allowed}.btn:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:3px}.choice{display:block;background:#18344d;border:1px solid #58728b;border-radius:12px;padding:14px;margin:10px 0;cursor:pointer}.choice:has(input:checked){background:#194650;border:2px solid #34d9d7;padding:13px}.choice small{display:block;margin:7px 0 0 25px;color:#b9cce0}.choice input{margin-right:8px}.input{width:100%;border:1px solid #6b8aa4;background:#0a1d32;color:#fff;border-radius:9px;padding:12px;font:inherit;margin:7px 0 14px}.notice{background:#153b4b;border-left:4px solid #34d9d7;padding:14px;border-radius:8px;margin:14px 0}.warn{background:#4a3524;border-left-color:#ffbc6e}.pill{border:1px solid #568d96;color:#86eee8;border-radius:30px;padding:5px 11px;font-weight:750;font-size:12px}.timer{font-size:30px;font-variant-numeric:tabular-nums;font-weight:900}.evidence li{padding:10px 0;border-bottom:1px solid #365471}.meter{height:8px;background:#365370;border-radius:8px;overflow:hidden;margin:13px 0 20px}.meter>div{height:100%;background:#2bdbd8}.status{color:#ffc4a1;min-height:22px;margin-top:13px}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;border-bottom:1px solid #3d5871;padding:11px 7px;vertical-align:top}.scroll{overflow:auto}nav{display:flex;gap:8px;flex-wrap:wrap}button{margin:5px 4px 5px 0}footer{font-size:12px;color:#a6bfd1;margin-top:25px}.chip{display:inline-block;padding:4px 9px;background:#21465c;border-radius:12px;margin:3px}.hide{display:none}.big{font-size:34px;font-weight:900}.inline{display:flex;gap:10px;align-items:center;flex-wrap:wrap}input[type=file]{max-width:100%}@media(max-width:750px){.grid{grid-template-columns:1fr}.wrap{padding:13px}.panel{padding:18px}}@media print{header,footer,button,#status{display:none}body,.panel{color:black;background:white}.muted{color:#444}}
</style></head><body><div class="wrap"><header><div><div class="eyebrow">AKU3304 • INFORMATION SYSTEMS AUDITING</div><strong>FORENSIC FIRST RESPONSE</strong></div><nav><button class="btn secondary" id="studentNav">Area Mahasiswa</button><button class="btn secondary" id="teacherNav">Area Dosen 🔒</button></nav></header><main id="app"></main><div class="status" id="status" role="alert" aria-live="polite"></div><footer>PSI Sesi 11 • Simulasi independen PT ArtaPay Digital • Data kasus sintetis • Versi GitHub Pages untuk uji kelas, tanpa server.</footer></div>
<script>
"use strict";
const HASH="29a61395a7789960227133fba86e4ec1622850f0f078493b346f542a021b771b",STORE="psi11-ffr-static-v1",IMPORTS="psi11-ffr-imports-v1";
const STAGES=[
{title:"Preserve or Restore?",time:"09.20 WIB",context:"Sistem pembayaran PT ArtaPay Digital menampilkan perubahan rekening pemasok terkait transaksi Rp480 juta. Tim IT ingin me-restart layanan yang terganggu. Data memori dan sebagian log akan hilang jika langkah tidak dikoordinasikan.",evidence:["INC-01 • Aplikasi pembayaran tidak stabil sejak 09.12","OPS-02 • Administrator meminta restart segera","RET-03 • Sebagian log cloud akan segera melewati masa retensi"],choices:[["restart","Izinkan restart segera","Pulihkan layanan dan periksa log setelahnya.",4,"Layanan pulih tetapi jejak volatil hilang; kekuatan pembuktian menurun."],["preserve","Koordinasikan preservasi sebelum pemulihan","Minta tim yang berwenang menyimpan bukti relevan secara tercatat sebelum perubahan layanan.",30,"Bukti dipreservasi dengan otorisasi, dokumentasi sumber, dan koordinasi pemulihan."],["wait","Tunggu izin CFO tanpa tindakan teknis","Bekukan semua aktivitas sampai manajemen memberi keputusan formal.",12,"Penundaan tanpa preservasi aktif meningkatkan risiko hilangnya log dan gangguan layanan."]]},
{title:"Evidence Under Pressure",time:"09.28 WIB",context:"Audit menerima dua berkas log: ekspor sistem menggunakan UTC sedangkan laporan transaksi menggunakan WIB. Sebuah screenshot melalui chat tidak memiliki metadata asal atau catatan transfer.",evidence:["LOG-11 • Peristiwa tercatat 02.14 UTC","CSV-12 • Transaksi tercatat 09.14 WIB","CHAT-13 • Screenshot tanpa provenance"],choices:[["chat","Gunakan screenshot sebagai bukti utama","Bentuknya mudah dipahami.",3,"Bukti chat tidak menyediakan provenance yang cukup untuk klaim atribusi."],["verify","Cocokkan sumber, zona waktu, hash, dan transfer","Validasi dua sumber primer serta jalur penguasaan bukti.",30,"Selisih waktu dapat dijelaskan dan keterlacakan bukti diperkuat."],["reject","Buang seluruh log","Perbedaan timestamp dianggap bukti palsu.",10,"Bukti potensial disingkirkan sebelum penilaian sumber dan zona waktu."]]},
{title:"Alert or False Alarm?",time:"09.37 WIB",context:"Tim hanya memiliki kapasitas memeriksa satu alert terlebih dahulu. Monitoring melaporkan perubahan rekening, login administrator dari perangkat terdaftar, serta lonjakan retry API saat gangguan.",evidence:["A-201 • Perubahan rekening pemasok pukul 09.11; pembayaran masih pending","A-202 • Login administrator dari perangkat terdaftar","A-203 • 280 kali retry API sesudah timeout"],choices:[["retry","Utamakan retry API berjumlah besar","Volume tertinggi dianggap risiko tertinggi.",8,"Prioritas teralihkan ke gangguan operasional; risiko finansial terlambat ditindaklanjuti."],["bank","Utamakan perubahan rekening dan pembayaran","Periksa approval, histori master data, dan status pembayaran.",30,"Risiko finansial prioritas ditindaklanjuti tanpa menganggap alert sebagai bukti fraud."],["login","Utamakan login administrator","Akses administrator selalu diperiksa pertama.",12,"Pemeriksaan akses tetap relevan, tetapi prioritas transaksi berisiko tertunda."]]},
{title:"Audit Judgment",time:"09.47 WIB",context:"Audit committee meminta penjelasan. Pembayaran Rp480 juta masih pending. Rekening pemasok tercatat berubah tetapi dokumen approval belum tersedia. Bukti atribusi belum cukup.",evidence:["PAY-41 • Status transaksi pending, bukan settled","MDM-42 • Histori perubahan rekening pukul 09.11","APR-43 • Dokumen persetujuan belum diserahkan"],choices:[["fraud","Simpulkan fraud dan kerugian terbukti","Berikan pernyataan pasti untuk mendorong tindakan.",0,"Kesimpulan melampaui bukti: dana belum terbukti hilang dan pelaku belum ditetapkan."],["limited","Laporkan risiko tinggi, batasan bukti, dan tindak lanjut","Tahan pembayaran, amankan bukti, dan verifikasi otorisasi perubahan.",30,"Kesimpulan proporsional memisahkan fakta, dugaan, dan tindak lanjut."],["clear","Nyatakan tidak ada masalah","Belum terjadi settlement, sehingga tidak ada risiko.",5,"Risiko pengendalian tetap ada walaupun kerugian belum terbukti."]]}
];
const app=document.getElementById("app"),status=document.getElementById("status");let mode="student",teacherUnlocked=false,clock=null;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const read=(key,defaultValue)=>{try{return JSON.parse(localStorage.getItem(key))||defaultValue}catch{return defaultValue}};
const write=(key,obj)=>localStorage.setItem(key,JSON.stringify(obj));
const seconds=ms=>{let n=Math.max(0,Math.ceil(ms/1000));return String(Math.floor(n/60)).padStart(2,"0")+":"+String(n%60).padStart(2,"0")};
async function sha256(value){const buffer=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(value));return Array.from(new Uint8Array(buffer),b=>b.toString(16).padStart(2,"0")).join("")}
const result=s=>({app:"PSI11_FFR",version:1,group:s.group,startedAt:s.startedAt,completedAt:s.completedAt||null,exportedAt:new Date().toISOString(),answers:s.answers.map(a=>({...a})),score:s.answers.reduce((v,a)=>v+a.score,0),maxScore:120});
function renderStart(){clearInterval(clock);const s=read(STORE,null);app.innerHTML='<div class="grid"><section class="panel"><span class="pill">30 MENIT • 4 TAHAP</span><h1>The Missing Evidence</h1><p>Simulasi pengambilan keputusan saat investigasi forensik digital dan continuous auditing.</p><p>Dalam kelompok 3–5 mahasiswa, identifikasi prioritas, pertahankan bukti dan tentukan kesimpulan yang dapat dipertanggungjawabkan.</p><div class="notice">Satu perangkat per kelompok. Tanpa SQL atau unggahan dokumen. Di akhir sesi, unduh hasil JSON untuk diberikan kepada dosen.</div></section><section class="panel"><h2>Masuk area mahasiswa</h2>'+(s?'<p class="muted">Ada sesi tersimpan untuk <b>'+esc(s.group)+'</b>.</p><button class="btn" id="resume">Lanjutkan sesi</button><button class="btn secondary" id="reset">Mulai ulang di perangkat ini</button>':'<label>Nama kelompok<input class="input" id="groupName" maxlength="70" placeholder="Contoh: Kelompok 4"></label><button class="btn" id="start">Mulai simulasi</button>')+'<p class="muted">Penghitungan 30 menit dimulai saat kelompok memulai sesi. Progres tersimpan pada browser ini.</p></section></div>';
if(s){document.getElementById("resume").onclick=renderStudent;document.getElementById("reset").onclick=()=>{if(confirm("Hapus sesi kelompok dari browser ini?")){localStorage.removeItem(STORE);renderStart()}}}else{document.getElementById("start").onclick=()=>{const name=document.getElementById("groupName").value.trim();if(name.length<2)return showError("Nama kelompok minimal 2 karakter.");write(STORE,{group:name,startedAt:Date.now(),answers:[],completedAt:null});renderStudent()}}}
function showError(s){status.textContent=s}
function renderStudent(){clearInterval(clock);status.textContent="";const s=read(STORE,null);if(!s)return renderStart();if(s.answers.length>=4||Date.now()-s.startedAt>=1800000)return renderFinish(s);const i=s.answers.length,stage=STAGES[i];const remaining=1800000-(Date.now()-s.startedAt);
app.innerHTML='<div class="grid"><section class="panel"><span class="pill">TAHAP '+(i+1)+' DARI 4</span><h1>'+esc(stage.title)+'</h1><b>'+stage.time+'</b><p>'+esc(stage.context)+'</p><h3>Bukti dan petunjuk</h3><ul class="evidence">'+stage.evidence.map(x=>'<li>'+esc(x)+'</li>').join("")+'</ul></section><section class="panel"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><strong>Waktu tersisa</strong><strong class="timer" id="timer">'+seconds(remaining)+'</strong></div><div class="meter"><div style="width:'+(i/4*100)+'%"></div></div><h2>Keputusan kelompok</h2><p class="muted">Bahas alasan sebelum mengunci pilihan.</p>'+stage.choices.map(c=>'<label class="choice"><input type="radio" name="choice" value="'+c[0]+'"><b>'+esc(c[1])+'</b><small>'+esc(c[2])+'</small></label>').join("")+'<label>Alasan keputusan<input class="input" id="reason" maxlength="220" placeholder="Minimal 8 karakter"></label><button class="btn" id="lock">Kunci keputusan</button><div id="feedback"></div></section></div>';
const deadline=s.startedAt+1800000;clock=setInterval(()=>{const remain=deadline-Date.now(),el=document.getElementById("timer");if(el)el.textContent=seconds(remain);if(remain<=0){clearInterval(clock);renderStudent()}},1000);
document.getElementById("lock").onclick=()=>{const selected=document.querySelector('input[name="choice"]:checked')?.value,reason=document.getElementById("reason").value.trim(),c=stage.choices.find(x=>x[0]===selected);if(!c||reason.length<8)return showError("Pilih tindakan dan tulis alasan minimal 8 karakter.");if(Date.now()>=deadline)return renderStudent();s.answers.push({stage:i,choice:c[0],reason,score:c[3],consequence:c[4]});if(s.answers.length===4)s.completedAt=Date.now();write(STORE,s);clearInterval(clock);document.getElementById("lock").disabled=true;document.querySelectorAll("input").forEach(el=>el.disabled=true);document.getElementById("feedback").innerHTML='<div class="notice"><b>Konsekuensi keputusan</b><p>'+esc(c[4])+'</p><button class="btn secondary" id="next">Lanjutkan</button></div>';document.getElementById("next").onclick=renderStudent}}
function download(filename,data){const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));const a=document.createElement("a");a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function renderFinish(s){clearInterval(clock);const finished=s.answers.length===4,score=s.answers.reduce((v,a)=>v+a.score,0);app.innerHTML='<section class="panel"><span class="pill">'+(finished?"SESI SELESAI":"WAKTU HABIS")+'</span><h1>Debrief kelompok</h1><p class="muted">'+esc(s.group)+'</p><div class="big">'+score+' / 120</div><p>'+s.answers.length+' dari 4 keputusan tercatat.</p>'+s.answers.map((a,i)=>'<div class="notice"><b>Tahap '+(i+1)+'</b><p>'+esc(a.consequence)+'</p><small>Alasan: '+esc(a.reason)+'</small></div>').join("")+'<h3>Diskusi penutup</h3><ol><li>Keputusan mana paling memengaruhi integritas bukti?</li><li>Bagaimana menyeimbangkan pemulihan layanan dan chain of custody?</li><li>Mengapa alert dan dugaan tidak otomatis membuktikan fraud?</li></ol><button class="btn" id="download">Unduh hasil kelompok (JSON)</button><button class="btn secondary" onclick="window.print()">Cetak ringkasan</button><p class="muted">Serahkan JSON kepada dosen. Halaman statis tidak mengirim hasil secara otomatis.</p></section>';document.getElementById("download").onclick=()=>download("PSI11_FFR_"+s.group.replace(/[^a-zA-Z0-9_-]/g,"_")+".json",result(s))}
function login(){clearInterval(clock);app.innerHTML='<section class="panel"><span class="pill">AREA DOSEN • PROTEKSI RINGAN SHA-256</span><h1>Dashboard Dosen</h1><div class="notice warn">Mode uji coba GitHub Pages: hash sandi dan kode dapat diperiksa publik. Jangan gunakan sandi akun pribadi. Semua hasil mahasiswa perlu diimpor manual.</div><form id="login"><label>Sandi dosen<input class="input" type="password" id="password" autocomplete="off" required></label><button class="btn">Masuk</button></form></section>';document.getElementById("login").onsubmit=async e=>{e.preventDefault();const hash=await sha256(document.getElementById("password").value);if(hash!==HASH)return showError("Sandi dosen tidak sesuai.");teacherUnlocked=true;dashboard()}}
function validSubmission(d){if(!d||d.app!=="PSI11_FFR"||d.version!==1||typeof d.group!=="string"||d.group.length>70||!Array.isArray(d.answers)||d.answers.length>4)return false;return d.answers.every((a,i)=>a.stage===i&&STAGES[i].choices.some(c=>c[0]===a.choice)&&typeof a.reason==="string"&&a.reason.length<=220)}
function normalize(d){const a=d.answers.map((r,i)=>{const c=STAGES[i].choices.find(x=>x[0]===r.choice);return {stage:i,choice:c[0],reason:r.reason,score:c[3],consequence:c[4]}});return {app:"PSI11_FFR",version:1,group:d.group,startedAt:d.startedAt,completedAt:d.completedAt,answers:a,score:a.reduce((sum,x)=>sum+x.score,0),maxScore:120}}
function dashboard(){if(!teacherUnlocked)return login();const entries=read(IMPORTS,{}),all=Object.values(entries);app.innerHTML='<section class="panel"><div class="inline" style="justify-content:space-between"><div><span class="pill">AREA DOSEN</span><h1>Ringkasan kelas</h1></div><button class="btn secondary" id="logout">Keluar</button></div><div class="notice warn">Tidak ada koneksi antarperangkat. Impor file JSON dari kelompok untuk menggabungkan hasil. Data yang diimpor hanya tersimpan di browser dosen ini. SHA-256 bukan autentikasi aman.</div><div class="inline"><div class="chip">Kelompok diimpor: <strong>'+all.length+'</strong></div><div class="chip">Selesai: <strong>'+all.filter(x=>x.answers.length===4).length+'</strong></div></div><h3>Impor hasil kelompok</h3><input class="input" id="files" type="file" accept=".json,application/json" multiple><button class="btn" id="import">Impor JSON</button><button class="btn secondary" id="export">Ekspor rekap CSV</button><button class="btn secondary" id="clear">Hapus impor lokal</button><h3>Hasil kelompok</h3><div class="scroll"><table><thead><tr><th>Kelompok</th><th>Tahap</th><th>Skor</th><th>Mulai (perangkat kelompok)</th></tr></thead><tbody>'+all.map(e=>'<tr><td>'+esc(e.group)+'</td><td>'+e.answers.length+'/4</td><td>'+e.score+'/120</td><td>'+esc(new Date(e.startedAt).toLocaleString("id-ID"))+'</td></tr>').join("")+'</tbody></table></div><h3>Distribusi keputusan</h3>'+STAGES.map((stage,i)=>'<div class="notice"><b>Tahap '+(i+1)+' — '+esc(stage.title)+'</b>'+stage.choices.map(c=>'<p>'+esc(c[1])+': <strong>'+all.filter(x=>x.answers[i]?.choice===c[0]).length+'</strong></p>').join("")+'</div>').join("")+'<p class="muted">Catatan: hasil JSON, waktu perangkat, dan skor dapat dimodifikasi oleh peserta yang memahami kode. Gunakan untuk diskusi formatif, bukan penilaian berintegritas tinggi.</p></section>';
document.getElementById("logout").onclick=()=>{teacherUnlocked=false;login()};document.getElementById("clear").onclick=()=>{if(confirm("Hapus seluruh hasil impor di browser dosen?")){localStorage.removeItem(IMPORTS);dashboard()}};
document.getElementById("import").onclick=async()=>{const files=Array.from(document.getElementById("files").files),data=read(IMPORTS,{});let count=0;for(const file of files){try{if(file.size>100000)throw Error("Berkas terlalu besar.");const parsed=JSON.parse(await file.text());if(!validSubmission(parsed))throw Error("Format hasil tidak sesuai.");const normal=normalize(parsed);data[normal.group]=normal;count++}catch(e){showError(file.name+": "+e.message)}}write(IMPORTS,data);if(count)dashboard()};
document.getElementById("export").onclick=()=>{const rows=[["Kelompok","Tahap selesai","Skor","Mulai"],...all.map(e=>[e.group,e.answers.length,e.score,new Date(e.startedAt).toISOString()])];const csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\r\n");const blob=URL.createObjectURL(new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"}));const a=document.createElement("a");a.href=blob;a.download="PSI11_Rekap_Kelas.csv";a.click();setTimeout(()=>URL.revokeObjectURL(blob),1000)}
}
document.getElementById("studentNav").onclick=()=>{mode="student";renderStart()};document.getElementById("teacherNav").onclick=()=>{mode="teacher";teacherUnlocked?dashboard():login()};renderStart();
</script></body></html>
