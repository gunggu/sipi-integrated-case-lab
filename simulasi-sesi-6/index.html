<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIPI Sesi 6 · Alur Transaksi ERP</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6f9;color:#183149;font:15px/1.5 system-ui,Arial}header{background:#173750;color:white;padding:20px}header>div,main{max-width:990px;margin:auto}h1{font-size:clamp(24px,4vw,33px);margin:3px 0}main{padding:20px 14px 60px}.card{background:#fff;border:1px solid #d3dfe9;border-radius:13px;padding:19px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.tag{display:inline-block;border-radius:20px;background:#e7eff5;color:#244d6d;padding:4px 10px;font-size:12px;font-weight:700;margin:2px}.btn{background:#25577a;color:white;border:0;padding:11px 15px;border-radius:8px;cursor:pointer;font:inherit;font-weight:700;margin:4px 4px 4px 0}.btn.alt{background:#e7eff5;color:#244b69}.btn:disabled{opacity:.45;cursor:not-allowed}.doc{border:1px solid #cad8e5;border-radius:10px;padding:12px;background:#fafcfe}.doc b{color:#244a67}.doc table{width:100%;border-collapse:collapse;font-size:13px}.doc td,.doc th{border-bottom:1px solid #dce5ec;padding:6px;text-align:left}.notice{background:#eaf4f4;border-left:4px solid #438a85;padding:11px;margin:12px 0}.warn{background:#fff3e4;border-left-color:#b67b37}.bad{background:#fff0f0;border-left-color:#af5c5c}.field{display:block;margin:9px 0;font-weight:600}input,select,textarea{font:inherit;border:1px solid #b6c6d4;border-radius:8px;padding:9px;max-width:100%;width:100%;background:white}textarea{min-height:85px}.muted{font-size:13px;color:#5f7487}.bar{display:flex;gap:5px;flex-wrap:wrap}.mod{flex:1;min-width:130px;border:1px solid #c6d6e2;padding:12px;border-radius:10px;background:#fff}.mod strong{display:block;margin-bottom:4px}.stephead{display:flex;align-items:center;justify-content:space-between;gap:12px}.metric{font-size:23px;font-weight:800}.nav{display:flex;justify-content:space-between;flex-wrap:wrap;margin-top:15px}.choice{width:100%;background:white;border:1px solid #bdcddc;border-radius:9px;padding:12px;margin:6px 0;text-align:left;font:inherit;cursor:pointer}.choice[aria-pressed=true]{background:#e1f0ed;border:2px solid #357e77;padding:11px}.good{color:#16766b}.danger{color:#a54c37}.progress{height:8px;background:#dde8ee;border-radius:9px;overflow:hidden}.progress div{height:100%;background:#418d87}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #df9a3e}details{margin-top:10px}.printonly{display:none}@media print{header,.nav,.noprint{display:none!important}body{background:white}.card{break-inside:avoid}.printonly{display:block}}.erpout{margin:14px 0;border:1px solid #bbcad7;border-radius:10px;background:#fff;overflow:hidden}.erpout header{background:#244861;color:#fff;padding:10px 13px;font-size:13px;font-weight:800}.erpout section{padding:12px}.erpout table{width:100%;border-collapse:collapse;font-size:12px}.erpout th,.erpout td{border:1px solid #d6e1e8;padding:7px;text-align:left}.erpout th{background:#edf3f7}.erpout .foot{color:#607588;font-size:12px;margin-top:9px}.erpout .scroll{overflow-x:auto}.erpout .kpis{display:flex;gap:8px;flex-wrap:wrap;margin:9px 0}.erpout .kpis span{background:#eaf3f7;border-radius:7px;padding:7px;font-size:12px;font-weight:bold}@media print{.erpout{break-inside:avoid}}</style></head><body><header><div><div style="font-size:12px;color:#e1d096;font-weight:bold">FEB UGM · SIPI SESI 6</div><h1>Alur Transaksi ERP</h1><div>Penjualan → Pembelian → Produksi → Akuntansi → Dashboard</div></div></header><main><div id="status"></div><div id="app"></div></main><script>
'use strict';
const KEY='sipi6-erpflow-v1',money=n=>'Rp'+Number(n).toLocaleString('id-ID'),safe=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fresh=()=>({step:0,team:'',sales:'',goods:'',invoice:'',production:'',scrap:'',calc:'',memo:'',finished:false});let s;try{s=JSON.parse(localStorage.getItem(KEY))||fresh()}catch{s=fresh()}if(!s||!Number.isInteger(s.step)||s.step<0||s.step>5)s=fresh();const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(s))}catch{}};const $=x=>document.getElementById(x);
const salesOK=()=>s.sales==='approve',goodsOK=()=>s.goods==='actual',invoiceOK=()=>s.invoice==='hold',productionOK=()=>s.production==='post',scrapOK=()=>s.scrap==='investigate';
function status(){return [{name:'Penjualan',info:s.sales?(salesOK()?'Otorisasi kredit diminta':'Pesanan dilepas berisiko'):'Belum diproses'},{name:'Persediaan',info:s.goods?(goodsOK()?'950 kg tercatat':'Penerimaan 1.000 kg berisiko'):'Belum diterima'},{name:'Utang',info:s.invoice?(invoiceOK()?'Faktur tertahan':'Faktur diteruskan berisiko'):'Belum dicocokkan'},{name:'Produksi',info:s.production?(productionOK()?'Pemakaian masuk WIP':'Posting tidak lengkap'):'Belum diproses'}]}
function choice(name,items){return items.map(([v,t])=>'<button class="choice" data-field="'+name+'" data-value="'+v+'" aria-pressed="'+(s[name]===v)+'">'+safe(t)+'</button>').join('')}
function doc(title,rows){return '<div class="doc"><div class="muted">PT NUSANIAGA DIGITAL · DOKUMEN SIMULASI</div><b>'+safe(title)+'</b><table>'+rows.map(([a,b])=>'<tr><th>'+safe(a)+'</th><td>'+safe(b)+'</td></tr>').join('')+'</table></div>'}
function score(){let calc=Number(String(s.calc).replace(/\./g,'').replace(/\s/g,''));return 20*Number(salesOK())+20*Number(goodsOK())+20*Number(invoiceOK())+15*Number(productionOK())+10*Number(scrapOK())+15*Number(calc===60000000)}

function outputTable(columns,rows){return '<div class="scroll"><table><thead><tr>'+columns.map(x=>'<th>'+safe(x)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(row=>'<tr>'+row.map(x=>'<td>'+safe(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}
function outputPanel(mod,body,note){return '<div class="erpout"><header>ERP NUSANIAGA · '+safe(mod)+' · OUTPUT SIMULASI</header><section>'+body+'<p class="foot">'+safe(note)+'</p></section></div>'}
function screenSales(){let stage=!s.sales?'DRAFT':salesOK()?'CREDIT REVIEW — HOLD':'CREDIT OVERRIDE — EXCEPTION';return outputPanel('SALES ORDER REGISTER',outputTable(['SO','Pelanggan','Qty','Total','Status'],[['SO-1468','CV Mitra Grosir','100',money(200000000),stage]])+'<div class="kpis"><span>Limit tersedia: '+money(120000000)+'</span><span>Selisih otorisasi: '+money(80000000)+'</span></div>','Surat jalan, faktur dan piutang belum diposting. Permintaan persetujuan kredit tidak sama dengan persetujuan yang telah diberikan.')}
function screenBuying(){let qty=s.goods?(goodsOK()?950:1000):0;let mismatch=s.goods?1000-qty:0;return outputPanel('INVENTORY & INVOICE MATCH',outputTable(['GRN','PO','Penerimaan (kg)','Persediaan','Status'],[['GRN-33','PO-772',qty,money(qty*50000),s.goods?(goodsOK()?'POSTED':'EXCEPTION'):'DRAFT']])+'<h3>Hasil pemeriksaan tiga dokumen</h3>'+outputTable(['Faktur','Ditagih','Diterima','Selisih','Status'],[['INV-V209','1.000 kg',qty+' kg',mismatch+' kg',s.invoice?(invoiceOK()?'ON HOLD':'RELEASED · RISK'):'NOT MATCHED']])+'<div class="kpis"><span>Nilai persediaan: '+money(qty*50000)+'</span><span>Selisih faktur: '+money(mismatch*50000)+'</span></div>','Angka memperlihatkan kartu gudang berdasarkan tindakan yang dipilih. Utang dan bank belum diposting dalam simulasi.')}
function screenProduction(){let valid=goodsOK()&&productionOK(),received=s.goods?(goodsOK()?950:1000):0,used=valid?800:0,total=valid?60000000:0;return outputPanel('MATERIAL LEDGER & COSTING',outputTable(['Material','Masuk GRN','Keluar RM-88','Saldo bahan'],[['RM-001',received+' kg',used+' kg',(received-used)+' kg']])+'<h3>Kartu biaya WIP · Batch B-21</h3>'+outputTable(['Komponen','Nilai','Status'],[['Bahan langsung',money(used*50000),valid?'POSTED':'PENDING'],['Tenaga kerja langsung',money(12000000),'SUMBER BATCH'],['Overhead',money(8000000),'SUMBER BATCH'],['Total biaya sementara',money(total),valid?'AVAILABLE':'PENDING']])+'<div class="kpis"><span>Produk baik: 180</span><span>Scrap: 20</span></div>','Posting bahan ke WIP membutuhkan pencatatan penerimaan aktual. Perlakuan biaya scrap belum diputuskan.')}
function screenDashboard(){let qty=s.goods?(goodsOK()?950:1000):0,used=goodsOK()&&productionOK()?800:0;return outputPanel('DASHBOARD LINTAS MODUL',outputTable(['Modul','Status register','Nilai/kuantitas','Informasi berikutnya'],[['Penjualan',s.sales?(salesOK()?'CREDIT HOLD':'EXCEPTION'):'DRAFT',money(200000000),'Belum ada faktur/piutang'],['Gudang',s.goods?(goodsOK()?'POSTED':'EXCEPTION'):'DRAFT',(qty-used)+' kg','Saldo material RM-001'],['Utang',s.invoice?(invoiceOK()?'MATCH HOLD':'RELEASE RISK'):'NOT MATCHED',money(50000000),'Bukti pembayaran belum ada'],['Produksi',used?'WIP MATERIAL POSTED':'PENDING',money(used*50000),scrapOK()?'Scrap ditinjau':'Scrap perlu telaah']]),'Output berasal dari keputusan simulator di browser. Tidak mewakili transaksi aktual pada buku besar perusahaan.')}

function nav(next=true){return '<div class="nav noprint"><button class="btn alt" data-act="back">← Kembali</button>'+(next?'<button class="btn" data-act="next">Lanjut →</button>':'')+'</div>'}
function render(){let h='';$('status').innerHTML='<div class="bar"><span class="tag">Langkah '+(s.step+1)+'/6</span><span class="tag">Target 25 menit</span><span class="tag">Data tersimpan di perangkat ini</span></div><div class="progress"><div style="width:'+(s.step/5*100)+'%"></div></div>';
if(s.step===0)h='<div class="card"><h2>Briefing · 2 menit</h2><p>Anda mengoperasikan sebagian alur transaksi PT NusaNiaga Digital Manufacturing. Perhatikan bagaimana satu keputusan mengubah status pesanan, persediaan, utang, biaya produksi, dan informasi manajemen.</p><div class="notice">Setiap layar berisi dokumen sumber, pilihan tindakan, dan keluaran ERP. Tidak semua tindakan boleh dilanjutkan tanpa pengendalian.</div><label class="field">Nama kelompok<input id="team" maxlength="80" value="'+safe(s.team)+'" placeholder="Contoh: Kelompok 3"></label><button class="btn" data-act="next">Mulai transaksi →</button><button class="btn alt" data-act="reset">Mulai ulang</button></div>';
if(s.step===1)h='<div class="card"><div class="stephead"><h2>1. Order-to-Cash · 5 menit</h2><span class="tag">Modul Penjualan</span></div><div class="grid">'+doc('Sales Order SO-1468',[['Pelanggan','CV Mitra Grosir'],['Jumlah','100 unit'],['Harga','Rp2.000.000 per unit'],['Total pesanan','Rp200.000.000']])+doc('Customer Master AR-102',[['Limit kredit tersedia','Rp120.000.000'],['Status kredit','Aktif'],['Persetujuan tambahan','Belum ada']])+'</div><h3>Tindakan saat klik “Proses pesanan”</h3>'+choice('sales',[['approve','Minta persetujuan tambahan atau pembayaran sesuai kebijakan sebelum pengiriman.'],['ship','Kirim barang otomatis karena stok cukup.'],['invoice','Terbitkan faktur tanpa mengecek kredit.']])+'<div class="notice">Output sistem: '+(s.sales?(salesOK()?'Order ditahan untuk otorisasi kredit; surat jalan belum diterbitkan.':'Order berisiko dilepas tanpa pemenuhan kontrol kredit.'):'Belum ada transaksi diproses.')+'</div>'+screenSales()+nav();
if(s.step===2)h='<div class="card"><div class="stephead"><h2>2. Procure-to-Pay · 6 menit</h2><span class="tag">Modul Pembelian & Gudang</span></div><div class="grid">'+doc('Purchase Order PO-772',[['Bahan','1.000 kg'],['Harga per kg','Rp50.000'],['Nilai PO','Rp50.000.000']])+doc('Penerimaan Fisik GRN-33',[['Hasil penimbangan','950 kg'],['Mutu','Sesuai'],['Tiba gudang','14 September']])+doc('Faktur INV-V209',[['Ditagih pemasok','1.000 kg'],['Nilai sebelum pajak','Rp50.000.000'],['Status','Belum dibayar']])+'</div><h3>Masukkan kuantitas penerimaan yang akan diposting</h3>'+choice('goods',[['actual','Posting penerimaan aktual 950 kg.'],['po','Posting 1.000 kg sesuai PO walaupun barang fisik belum lengkap.']])+'<h3>Saat sistem melakukan pencocokan tiga dokumen</h3>'+choice('invoice',[['hold','Tahan bagian faktur yang berbeda, minta klarifikasi 50 kg.'],['pay','Setujui seluruh faktur karena sudah ada PO.']])+'<div class="notice">Output ERP: Persediaan bahan = '+(s.goods?(goodsOK()?'950 kg ('+money(47500000)+')':'1.000 kg ('+money(50000000)+') — berisiko'):'belum dicatat')+'. Status faktur = '+(s.invoice?(invoiceOK()?'pengecualian 50 kg / '+money(2500000)+' belum diselesaikan':'pembayaran diproses tanpa penyelesaian selisih'):'belum dicocokkan')+'.</div>'+screenBuying()+nav();
if(s.step===3)h='<div class="card"><div class="stephead"><h2>3. Production-to-Cost · 7 menit</h2><span class="tag">Modul Produksi & Biaya</span></div><div class="grid">'+doc('Permintaan Bahan RM-88',[['Bahan dipakai','800 kg'],['Harga per kg','Rp50.000'],['Nilai bahan','Rp40.000.000']])+doc('Laporan Batch B-21',[['Produk baik','180 unit'],['Scrap','20 unit'],['Tenaga kerja langsung','Rp12.000.000'],['Overhead teralokasi','Rp8.000.000']])+'</div><h3>Proses pemakaian bahan dalam ERP</h3>'+choice('production',[['post','Kurangi kartu persediaan 800 kg dan posting nilai bahan Rp40 juta ke barang dalam proses (WIP).'],['skip','Catat hanya hasil produk baik tanpa posting bahan ke WIP.']])+'<h3>Perlakuan awal atas scrap</h3>'+choice('scrap',[['investigate','Tandai scrap untuk investigasi normal/abnormal dan tahan keputusan alokasi biaya final.'],['expense','Bebankan semua scrap sebagai kerugian abnormal tanpa verifikasi.']])+'<label class="field">Hitung total biaya batch sebelum keputusan perlakuan scrap (rupiah)<input id="calc" inputmode="numeric" placeholder="Masukkan jumlah rupiah" value="'+safe(s.calc)+'"></label><div class="notice">Output sistem: '+(s.production?(productionOK()?'Stok bahan berkurang 800 kg; WIP menerima biaya bahan '+money(40000000)+'.':'Biaya produksi belum terhubung ke WIP.'):'Menunggu posting bahan')+' '+(s.scrap?(scrapOK()?'Scrap menunggu klasifikasi.':'Scrap ditetapkan tanpa dasar memadai.'):'')+'</div>'+screenProduction()+nav();
if(s.step===4){let st=status();h='<div class="card"><h2>4. Dashboard antar-modul · 3 menit</h2><p>Bandingkan dampak setiap pilihan pada informasi sistem. Status ini disimulasikan dan memperlihatkan konsekuensi pengendalian terhadap data operasional serta akuntansi.</p><div class="grid">'+st.map(a=>'<div class="mod"><strong>'+safe(a.name)+'</strong>'+safe(a.info)+'</div>').join('')+'</div><div class="notice warn">Titik integrasi: dokumen pesanan memicu pemeriksaan kredit; penerimaan mengubah kartu persediaan; pencocokan faktur memengaruhi kelayakan pembayaran; pemakaian bahan memindahkan nilai ke WIP.</div><h3>Simpulan kelompok</h3><textarea id="memo" placeholder="Tulis 2–3 kalimat: bagaimana input, proses, penyimpanan, output, dan kontrol saling terkait?">'+safe(s.memo)+'</textarea>'+screenDashboard()+nav()+'</div>'}
if(s.step===5){h='<div class="card"><h2>5. Ringkasan & diskusi · 2 menit</h2><div class="metric">Skor keputusan: '+score()+'/100</div><p class="muted">Skor latihan hanya mencakup tindakan dan perhitungan. Kualitas memo diperiksa dalam diskusi kelas.</p><div class="grid">'+status().map(a=>'<div class="mod"><strong>'+safe(a.name)+'</strong>'+safe(a.info)+'</div>').join('')+'</div>'+screenDashboard()+'<p><b>Biaya batch yang dihitung:</b> '+safe(s.calc||'Belum diisi')+'</p><p><b>Memo:</b> '+safe(s.memo||'Belum ada')+'</p><details><summary>Pembahasan pengajar setelah pengerjaan</summary><p>Pesanan melebihi limit Rp80 juta, perlu otorisasi; penerimaan aktual 950 kg bernilai Rp47,5 juta; selisih faktur 50 kg senilai Rp2,5 juta; biaya batch Rp40 juta + Rp12 juta + Rp8 juta = Rp60 juta. Scrap perlu klasifikasi sebelum keputusan biaya akhir.</p></details><div class="nav noprint"><button class="btn alt" data-act="back">← Tinjau dashboard</button><button class="btn alt" data-act="download">Ekspor ringkasan (.txt)</button><button class="btn" data-act="print">Cetak / PDF</button></div></div>'}
$('app').innerHTML=h;save()}
function exportText(){return ['SIPI SESI 6 — ERP TRANSACTION FLOW','Kelompok: '+s.team,'Skor: '+score()+'/100','Penjualan: '+s.sales,'Penerimaan: '+s.goods,'Faktur: '+s.invoice,'Produksi: '+s.production,'Scrap: '+s.scrap,'Biaya batch: '+s.calc,'Memo: '+s.memo,'Dokumen dan angka merupakan simulasi pendidikan.'].join('\n')}
document.addEventListener('input',e=>{if(e.target.id==='team')s.team=e.target.value;if(e.target.id==='calc')s.calc=e.target.value;if(e.target.id==='memo')s.memo=e.target.value;save()});document.addEventListener('click',e=>{const b=e.target.closest('[data-field],[data-act]');if(!b)return;if(b.dataset.field){s[b.dataset.field]=b.dataset.value;render();return}let a=b.dataset.act;if(a==='reset'){if(confirm('Hapus progres?')){s=fresh();render()}return}if(a==='back'){s.step=Math.max(0,s.step-1);render();return}if(a==='next'){if(s.step===1&&!s.sales||s.step===2&&(!s.goods||!s.invoice)||s.step===3&&(!s.production||!s.scrap||!s.calc.trim())){alert('Lengkapi keputusan dan input terlebih dahulu.');return}s.step=Math.min(5,s.step+1);render();return}if(a==='download'){const u=URL.createObjectURL(new Blob([exportText()],{type:'text/plain;charset=utf-8'}));const x=document.createElement('a');x.href=u;x.download='SIPI6_ERP_'+(s.team||'Kelompok').replace(/[^a-z0-9_-]/gi,'_')+'.txt';x.click();setTimeout(()=>URL.revokeObjectURL(u),1000);return}if(a==='print')window.print()});render();
</script></body></html>
