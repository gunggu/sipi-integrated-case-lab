<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIPI Sesi 6 · ERP Transaction Flow</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f8;color:#183046;font:15px/1.5 system-ui,Arial}header{background:#17364c;color:white;padding:20px}header>div,main{max-width:1030px;margin:auto}main{padding:18px 15px 70px}h1{font-size:clamp(25px,4vw,34px);margin:3px 0}h2{font-size:21px;margin:0 0 10px}h3{font-size:16px}p{margin:9px 0}.card{background:#fff;border:1px solid #d3dfe7;border-radius:12px;padding:20px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(225px,1fr));gap:11px}.muted{color:#5d7183;font-size:13px}.small{font-size:12px}.tag{display:inline-block;background:#e6eef4;border-radius:18px;padding:4px 9px;font-size:12px;color:#264e68;font-weight:700}.btn{background:#245678;color:white;border:0;border-radius:8px;padding:10px 15px;cursor:pointer;font:inherit;font-weight:700}.btn.alt{background:#e7eef4;color:#234b65}.btn:disabled{opacity:.5}.nav{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:16px}.choice{display:block;width:100%;text-align:left;padding:11px;border:1px solid #c5d3df;border-radius:8px;background:white;margin:7px 0;font:inherit;cursor:pointer}.choice[aria-pressed=true]{background:#e5f2ef;border:2px solid #387e73;padding:10px}.notice{background:#eaf3f7;border-left:4px solid #4f859d;padding:11px;margin:12px 0}.warn{background:#fff2e5;border-left-color:#b57e3d}.field{font-weight:650;display:block;margin:12px 0}textarea,input{font:inherit;border:1px solid #afc1d1;border-radius:7px;padding:9px;width:100%;max-width:100%}textarea{min-height:100px}.progress{height:7px;background:#dbe4ec;border-radius:9px;margin:9px 0}.progress>div{height:100%;background:#34877c;border-radius:9px}.bar{display:flex;gap:7px;flex-wrap:wrap}.erp{margin:12px 0;border:1px solid #b7cad7;border-radius:10px;overflow:hidden;background:white}.erp-head{background:#234962;color:#fff;padding:9px 12px;font-weight:750;display:flex;justify-content:space-between;gap:10px}.erp-body{padding:12px}.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:12px}td,th{border:1px solid #d7e1e9;text-align:left;padding:8px;vertical-align:top}th{background:#ebf2f7}.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:8px;margin:10px 0}.kpi{background:#eef4f8;padding:9px;border-radius:7px;font-size:12px}.kpi b{display:block;font-size:17px}.doc{border:1px solid #cad9e3;padding:12px;border-radius:8px;background:#fcfdfe}.doc h3{margin:4px 0 9px}.status{font-weight:750}.good{color:#197459}.bad{color:#a74b30}.footer-note{font-size:12px;color:#627487;margin-top:9px}.metric{font-size:27px;font-weight:800}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #d7a14d}@media print{header,.nav,.noprint{display:none!important}body{background:white}.card,.erp{break-inside:avoid}main{padding:0}}
</style></head><body><header><div><div class="small" style="color:#ead094;font-weight:700">FEB UGM · SIPI SESI 6</div><h1>ERP Transaction Flow</h1><div>Pesanan · Penerimaan bahan · Pencocokan faktur · Integrasi informasi</div></div></header><main><div id="progress"></div><div id="app"></div></main><script>
'use strict';
const KEY='sipi6-recon-v1',money=n=>'Rp'+Number(n).toLocaleString('id-ID'),safe=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','"':'&#39;'}[c]));
const fresh=()=>({step:0,team:'',trace:'',recon:'',tax:'',release:'',memo:'',finished:false});
let s;try{s=JSON.parse(localStorage.getItem(KEY))||fresh()}catch{s=fresh()}if(!s||!Number.isInteger(s.step)||s.step<0||s.step>5)s=fresh();const $=id=>document.getElementById(id),save=()=>{try{localStorage.setItem(KEY,JSON.stringify(s))}catch{}};
const options={
trace:[['delivery','Gunakan data GRN fisik sebagai pembanding utama dan telusuri jurnal penerimaan yang sudah masuk ERP.',20],['credit','Mulai dari nota kredit pemasok untuk menentukan kuantitas final, kemudian tinjau dokumen penerimaan.',12],['ledger','Mulai dari saldo GL dan AP yang telah diposting, kemudian mintakan pembuktian dari gudang.',10]],
recon:[['split','Pertahankan bukti penerimaan 950 unit, telaah kelebihan posting 50 unit pada inventori dan kewajiban, lalu buat koreksi berjejak audit setelah verifikasi.',25],['hold','Blokir proses terkait sampai rekonsiliasi selesai; koreksi GL dan AP hanya sesudah investigasi bersama.',18],['net','Gunakan nota kredit Oktober untuk mengompensasi seluruh perbedaan September tanpa koreksi entri September.',8]],
tax:[['verify','Cocokkan invoice dan dokumen pajak pemasok dengan GRN serta nota kredit; klarifikasi jenis dan waktu dokumen pembetulan sebelum pembukuan pajak.',20],['defer','Tandai dokumen pajak untuk telaah berikutnya dan tahan pengakuan koreksi pajak sampai dokumen pendukung diterima.',14],['offset','Langsung kurangi nilai faktur dan pajak September dengan nota kredit bertanggal Oktober tanpa pemeriksaan dokumen.',5]],
release:[['partial','Lepas hanya bagian transaksi yang didukung bukti; pertahankan pengecualian 50 unit dan pekerjaan koreksi antarmodul secara terpisah.',20],['freeze','Tahan seluruh aktivitas pembelian pemasok tersebut sampai semua dokumen selesai diverifikasi.',13],['auto','Setujui faktur penuh dan biarkan proses penyesuaian otomatis pada penutupan bulan berikutnya.',6]]
};
const selected=(key)=>options[key].find(a=>a[0]===s[key]),points=key=>selected(key)?.[2]||0,subtotal=()=>['trace','recon','tax','release'].reduce((a,k)=>a+points(k),0);
function table(cols,rows){return '<div class="scroll"><table><thead><tr>'+cols.map(x=>'<th>'+safe(x)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(row=>'<tr>'+row.map(x=>'<td>'+safe(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}
function panel(name,body,note=''){return '<div class="erp"><div class="erp-head"><span>NUSANIAGA ERP · '+safe(name)+'</span><span class="small">SIMULASI</span></div><div class="erp-body">'+body+(note?'<p class="footer-note">'+safe(note)+'</p>':'')+'</div></div>'}
function doc(title,rows){return '<div class="doc"><div class="muted">DOKUMEN TRANSAKSI</div><h3>'+safe(title)+'</h3>'+table(['Kolom','Data'],rows)+'</div>'}
function choice(key){return options[key].map(([id,label])=>'<button type="button" class="choice" data-field="'+key+'" data-value="'+id+'" aria-pressed="'+(s[key]===id)+'">'+safe(label)+'</button>').join('')}
function nav(){return '<div class="nav noprint"><button class="btn alt" data-act="back">← Sebelumnya</button><button class="btn" data-act="next">Lanjut →</button></div>'}
function statusLabel(key){const maps={trace:{delivery:'Jejak GRN dipilih',credit:'Jejak nota kredit dipilih',ledger:'Jejak ledger dipilih'},recon:{split:'Koreksi terpisah diajukan',hold:'Penahanan menyeluruh diajukan',net:'Kompensasi periode berikutnya diajukan'},tax:{verify:'Verifikasi dokumen diminta',defer:'Telaah dokumen dijadwalkan',offset:'Kompensasi pajak diajukan'},release:{partial:'Pelepasan parsial diajukan',freeze:'Penahanan menyeluruh diajukan',auto:'Persetujuan penuh diajukan'}};return maps[key]?.[s[key]]||'Belum ditentukan'}
function physical(){return panel('RECEIVING / INVENTORY',table(['Referensi','Tanggal','Sumber','Kuantitas','Nilai'],[['PO-772','26 Sep','Purchase Order','1.000 unit',money(50000000)],['GRN-33','29 Sep','Berita acara timbang','950 unit',money(47500000)],['INV-POST-09','30 Sep','Inventory register','1.000 unit',money(50000000)],['CN-SUP-17','2 Okt','Nota kredit pemasok','50 unit',money(2500000)]]),'Entri inventori telah diposting pada 30 September. Nota kredit diterima sesudah tanggal pelaporan.')}
function ledger(){return panel('AP / GENERAL LEDGER',table(['Dokumen','Tanggal','Akun / modul','Debit','Kredit'],[['GR-09','30 Sep','Persediaan',money(50000000),'—'],['GR-09','30 Sep','Akun penampung penerimaan','—',money(50000000)],['AP-09','30 Sep','Akun penampung penerimaan',money(50000000),'—'],['AP-09','30 Sep','Utang usaha','—',money(50000000)]]),'Ilustrasi jurnal sebelum pajak. Jenis akun penampung disederhanakan untuk tujuan rekonsiliasi; tidak merepresentasikan konfigurasi ERP perusahaan tertentu.')}
function taxDocs(){return panel('DOCUMENT CONTROL / TAX',table(['Referensi','Tanggal','Data yang tersedia','Status dokumen'],[['INV-V209','30 Sep','Tagihan 1.000 unit / '+money(50000000),'Diterima'],['TAX-209','30 Sep','Dokumen pajak pemasok terkait INV-V209','Perlu pencocokan'],['CN-SUP-17','2 Okt','Nota kredit 50 unit / '+money(2500000),'Diterima'],['TAX-ADJ','—','Dokumen koreksi pajak, bila dipersyaratkan','Belum dibuktikan']]),'Penanganan dokumen perpajakan bergantung pada jenis transaksi, status dokumen, dan ketentuan yang berlaku. Simulasi tidak menetapkan tarif atau akibat pajak final.')}
function cockpit(){return panel('RECONCILIATION WORKBENCH',table(['Sumber','Kuantitas','Nilai sebelum pajak','Tanggal'],[['Penerimaan fisik', '950 unit',money(47500000),'29 Sep'],['Inventory / GL','1.000 unit',money(50000000),'30 Sep'],['AP dan faktur','1.000 unit',money(50000000),'30 Sep'],['Nota kredit','50 unit',money(2500000),'2 Okt']])+table(['Keputusan proses','Status pencatatan'],[['Penelusuran sumber',statusLabel('trace')],['Rekonsiliasi ledger',statusLabel('recon')],['Dokumen pajak',statusLabel('tax')],['Pelepasan transaksi',statusLabel('release')]]),'Perbedaan data ditampilkan sesuai dokumen. Status keputusan dicatat tanpa penilaian sebelum pekerjaan selesai.')}
function rubric(){const rows=[
['Penelusuran sumber data',20,points('trace'),'Prioritaskan penerimaan yang dapat diverifikasi dan jejak posting; nota kredit setelah tanggal laporan memerlukan telaah periode.'],
['Rekonsiliasi inventori, AP, dan GL',25,points('recon'),'Telusuri kesalahan posting Rp2,5 juta dan tindak lanjut per modul. Penahanan seluruh transaksi dapat dipertanggungjawabkan sementara, tetapi tidak selalu efisien.'],
['Pengendalian dokumen perpajakan',20,points('tax'),'Cocokkan dokumen pajak, faktur dan bukti transaksi sebelum menentukan pembetulan, periode, maupun perlakuan pajak.'],
['Keputusan pelepasan transaksi',20,points('release'),'Pisahkan transaksi yang dapat dibuktikan dari bagian yang masih disengketakan; pertahankan jejak persetujuan.']
];return '<section class="erp"><div class="erp-head">RUBRIK EVALUASI AKHIR · '+subtotal()+'/85 poin otomatis</div><div class="erp-body">'+table(['Aspek','Maksimum','Diperoleh','Dasar evaluasi'],rows.map(r=>[r[0],r[1],r[2],r[3]]))+'<h3>Argumentasi tertulis · 15 poin (penilaian dosen)</h3>'+table(['Kriteria','Maksimum'],[['Hubungan bukti fisik, ERP, AP/GL dan dokumen pajak','5'],['Ketepatan tindakan berikutnya dan penanganan perbedaan periode','5'],['Pertimbangan alternatif serta batas kepastian bukti','5']])+'<p><b>Total akhir:</b> '+subtotal()+'/85 poin otomatis + nilai memo dosen (maksimum 15) = maksimum 100.</p><p>Nilai parsial diberikan untuk alternatif yang masih dapat dipertanggungjawabkan, walaupun belum menyelesaikan seluruh persoalan.</p></div></section>'}
function render(){let h='';$('progress').innerHTML='<div class="bar"><span class="tag">Tahap '+(s.step+1)+'/6</span><span class="tag">25 menit</span><span class="tag">Progres tersimpan di perangkat</span></div><div class="progress"><div style="width:'+(s.step/5*100)+'%"></div></div>';
if(s.step===0)h='<div class="card"><h2>Ruang kerja transaksi · 3 menit</h2><p>Tim diminta merekonsiliasi penerimaan bahan dan pencatatan pembelian menjelang penutupan September. Beberapa dokumen berasal dari periode yang berbeda. Tentukan langkah yang dapat dipertanggungjawabkan berdasarkan bukti.</p><label class="field">Nama kelompok<input id="team" maxlength="70" value="'+safe(s.team)+'" placeholder="Kelompok 1"></label><div class="notice">Baca dokumen, catat keputusan pada setiap tahap, lalu serahkan simpulan. Hasil evaluasi ditampilkan setelah laporan selesai.</div><div class="nav"><button class="btn alt" data-act="reset">Mulai ulang</button><button class="btn" data-act="next">Masuk sistem →</button></div></div>';
if(s.step===1)h='<div class="card"><h2>1. Pemeriksaan dokumen sumber · 5 menit</h2><div class="grid">'+doc('PO-772',[['Pemasok','PT Cakrawala Komponen'],['Kuantitas','1.000 unit'],['Harga','Rp50.000/unit'],['Nilai',money(50000000)]])+doc('GRN-33',[['Diterima','29 September'],['Kuantitas hasil timbang','950 unit'],['Disetujui petugas gudang','Ya']])+doc('CN-SUP-17',[['Tanggal','2 Oktober'],['Jumlah','50 unit'],['Keterangan pemasok','Penyesuaian atas tagihan September']])+'</div>'+physical()+'<h3>Jejak pemeriksaan mana yang didahulukan?</h3>'+choice('trace')+nav()+'</div>';
if(s.step===2)h='<div class="card"><h2>2. Rekonsiliasi ERP dan buku besar · 6 menit</h2><p>Jurnal September menunjukkan persediaan dan utang masing-masing Rp50 juta. Bandingkan dengan bukti penerimaan dan nota kredit yang diterbitkan pada Oktober.</p>'+ledger()+panel('DIFFERENCE MONITOR',table(['Uji rekonsiliasi','Perhitungan','Nilai'],[['Jumlah pada GL − fisik','1.000 − 950','50 unit'],['Selisih nilai','50 × Rp50.000',money(2500000)],['Dokumen setelah periode','2 Okt dibanding penutupan 30 Sep','Perlu telaah cut-off']]))+'<h3>Bagaimana penanganan rekonsiliasi diajukan?</h3>'+choice('recon')+nav()+'</div>';
if(s.step===3)h='<div class="card"><h2>3. Rekonsiliasi dokumen pajak · 5 menit</h2><p>Dokumen pemasok menunjukkan tagihan September dan nota kredit Oktober. Tentukan langkah pemeriksaan sebelum transaksi dipakai untuk pelaporan.</p>'+taxDocs()+'<h3>Apa instruksi yang diberikan kepada tim administrasi?</h3>'+choice('tax')+nav()+'</div>';
if(s.step===4)h='<div class="card"><h2>4. Otorisasi dan integrasi · 5 menit</h2>'+cockpit()+'<h3>Tentukan status transaksi yang akan diteruskan</h3>'+choice('release')+nav()+'</div>';
if(s.step===5)h='<div class="card"><h2>5. Memo dan laporan · 6 menit</h2>'+cockpit()+'<label class="field">Memo kelompok (3–5 kalimat)<textarea id="memo" maxlength="1200" '+(s.finished?'disabled':'')+' placeholder="Tuliskan temuan, hubungan antarregister, tindak lanjut dokumen, dan alasan memilih strategi.">'+safe(s.memo)+'</textarea></label>'+(s.finished?rubric()+'<div class="nav noprint"><button class="btn alt" data-act="download">Unduh laporan dan rubrik</button><button class="btn" data-act="print">Cetak / PDF</button><button class="btn alt" data-act="reset">Mulai ulang</button></div>':'<div class="nav noprint"><button class="btn alt" data-act="back">← Periksa kembali</button><button class="btn" data-act="finish">Selesaikan dan tampilkan rubrik</button></div>')+'</div>';
$('app').innerHTML=h;save()}
function report(){return ['SIPI SESI 6 — REKONSILIASI TRANSAKSI ERP','Kelompok: '+s.team,'','Data: PO 1.000 unit, GRN fisik 950 unit, ERP/AP 1.000 unit, nota kredit 50 unit tanggal 2 Oktober','Selisih: 50 unit = '+money(2500000),'','KEPUTUSAN',...['trace','recon','tax','release'].map(k=>k+': '+(selected(k)?.[1]||'-')),'','MEMO',s.memo,'','RUBRIK AKHIR',...['trace','recon','tax','release'].map(k=>k+': '+points(k)+' / '+({trace:20,recon:25,tax:20,release:20}[k])),'Subtotal otomatis: '+subtotal()+'/85','Memo: maksimal 15 poin, penilaian dosen','Total akhir = subtotal + nilai memo','Dokumen dan angka fiktif untuk pembelajaran.'].join('\n')}
document.addEventListener('input',e=>{if(e.target.id==='team')s.team=e.target.value;if(e.target.id==='memo'&&!s.finished)s.memo=e.target.value;save()});
document.addEventListener('click',e=>{let b=e.target.closest('[data-field],[data-act]');if(!b)return;if(b.dataset.field){if(s.finished)return;s[b.dataset.field]=b.dataset.value;render();return}let a=b.dataset.act;if(a==='reset'){if(confirm('Hapus progres kelompok?')){s=fresh();render()}return}if(a==='back'){if(s.finished)return;s.step=Math.max(0,s.step-1);render();return}if(a==='next'){let needed={1:'trace',2:'recon',3:'tax',4:'release'}[s.step];if(needed&&!s[needed]){alert('Pilih keputusan sebelum melanjutkan.');return}s.step=Math.min(5,s.step+1);render();return}if(a==='finish'){if(s.step!==5)return;if(s.memo.trim().length<80){alert('Lengkapi memo dengan temuan dan dasar rekomendasi.');return}s.finished=true;render();return}if(a==='download'||a==='print'){if(!s.finished){alert('Selesaikan simulasi terlebih dahulu.');return}if(a==='print'){window.print();return}let u=URL.createObjectURL(new Blob([report()],{type:'text/plain;charset=utf-8'})),l=document.createElement('a');l.href=u;l.download='SIPI6_Rekonsiliasi_'+(s.team||'Kelompok').replace(/[^a-z0-9_-]/gi,'_')+'.txt';l.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}});render();
</script></body></html>
