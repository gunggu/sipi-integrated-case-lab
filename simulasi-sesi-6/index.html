<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIPI Sesi 6 | Ruang Kendali Manufaktur</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#183149;font:15px/1.52 system-ui,Arial}header{background:#17364d;color:white;padding:23px 16px}header>div,main{max-width:970px;margin:auto}h1{font-size:clamp(25px,4vw,35px);margin:3px 0}h2{font-size:21px;margin:0 0 10px}h3{font-size:17px;margin:14px 0 8px}main{padding:18px 15px 70px}.card{background:white;border:1px solid #d4dfe8;border-radius:14px;padding:20px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:12px}.muted{color:#607387}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:11px}.chip{background:#e4edf4;border-radius:30px;padding:5px 10px;font-size:12px;font-weight:700;color:#345a72}.choice{display:block;width:100%;padding:12px;margin:8px 0;background:white;text-align:left;font:inherit;border:1px solid #b6c9d7;border-radius:9px;cursor:pointer}.choice.selected{background:#e6f3ef;border:2px solid #398875;padding:11px}.btn{font:inherit;font-weight:700;border:0;border-radius:9px;padding:11px 16px;color:white;background:#235777;cursor:pointer}.btn.alt{color:#24516d;background:#e5eef5}.btn:disabled{opacity:.5;cursor:not-allowed}.nav{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:16px}.doc{border:1px solid #c7d4e1;border-radius:10px;padding:13px;background:#fff}.doc .meta{font-size:11px;color:#54748b;letter-spacing:.04em;font-weight:750}.doc h3{border-bottom:2px solid #285a77;padding-bottom:6px;font-size:15px}.doc table{border-collapse:collapse;width:100%;font-size:13px}.doc td,.doc th{border-bottom:1px solid #e3eaf0;padding:6px;text-align:left;vertical-align:top}.doc th{width:45%}.note{padding:12px;background:#f0f6fa;border-left:4px solid #47859d;border-radius:3px}.danger{color:#9a4a13}.good{color:#237d67}.pill{display:inline-block;padding:4px 9px;border-radius:18px;background:#f1e3ce;font-size:12px;font-weight:800;color:#795222}.pill.green{background:#d9efe7;color:#236e5a}.pill.blue{background:#dcebf8;color:#2c6282}input,textarea{font:inherit;width:100%;padding:10px;border:1px solid #afbfce;border-radius:8px}textarea{min-height:80px}.field{max-width:330px}label{display:block;margin:10px 0 5px;font-weight:700}.timeline{display:flex;gap:8px;flex-wrap:wrap}.step{border:1px solid #c3d3df;border-radius:10px;padding:10px;background:#f6fafc}.score{font-size:32px;font-weight:800;color:#286f81}.bar{height:8px;border-radius:10px;background:#d9e5eb;overflow:hidden;margin:8px 0 12px}.bar div{height:100%;background:#418c89}.foot{font-size:12px;color:#698092}.mini{font-size:12px}.result{border-left:4px solid #467e99;padding:5px 12px;margin:10px 0}@media print{header,.nav,.noprint{display:none!important}body{background:white}.card,.doc{break-inside:avoid}}
</style></head><body><header><div><div class="mini">FEB UGM · SIPI SESI 6</div><h1>Ruang Kendali Manufaktur</h1><div>Aliran dokumen · barang · uang · biaya</div></div></header><main><div id="top"></div><div id="app"></div></main><script>
"use strict";
const STORE="sipi6-control-v3",$=x=>document.getElementById(x),escapeHtml=x=>String(x??"").replace(/[&<>"']/g,k=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[k]));
const tasks=[
{name:"Pelepasan pesanan",part:"Pendapatan",duration:"5 menit",docs:[{name:"Pesanan Penjualan SO-1468",rows:[["Pelanggan","CV Mitra Grosir"],["Kuantitas","100 unit"],["Harga per unit","Rp2.000.000"],["Nilai pesanan","Rp200.000.000"],["Sisa limit kredit","Rp120.000.000"]]},{name:"Status Pengiriman WH-1468",rows:[["Stok tersedia","100 unit"],["Persetujuan kredit","Belum ada"],["Surat jalan","Belum diterbitkan"]]}],q:"Bagaimana menangani permintaan pengiriman ini?",choices:["Setujui pengiriman karena barang tersedia; penagihan dapat dilakukan setelahnya.","Tahan pengiriman sampai ada tambahan otorisasi kredit atau pembayaran sesuai kebijakan.","Buat faktur dahulu supaya sistem menganggap limit kredit tersedia."],answer:1,why:"Nilai pesanan Rp200 juta melebihi sisa limit Rp120 juta. Ketersediaan barang bukan pengganti otorisasi kredit.",effect:"Pengiriman ditahan sementara; penjualan belum dipastikan terjadi dan piutang belum boleh diakui hanya karena pesanan diterima."},
{name:"Pencocokan tiga dokumen",part:"Pengeluaran",duration:"6 menit",docs:[{name:"Purchase Order PO-772",rows:[["Pemasok","PT Prima Material"],["Bahan dipesan","1.000 kg"],["Harga per kg","Rp50.000"],["Jumlah","Rp50.000.000"]]},{name:"Goods Received Note GRN-33",rows:[["Bahan diterima","950 kg"],["Bahan lolos inspeksi","950 kg"],["Masuk kartu gudang","950 kg"]]},{name:"Faktur pemasok V-209",rows:[["Bahan ditagih","1.000 kg"],["Nilai sebelum pajak","Rp50.000.000"],["Status","Menunggu pencocokan"]]}],q:"Keputusan yang tepat sebelum pembayaran?",choices:["Bayar penuh karena faktur cocok dengan PO.","Ubah catatan penerimaan menjadi 1.000 kg agar seluruh dokumen cocok.","Tahan nilai yang masih diperselisihkan dan selesaikan pencocokan PO–penerimaan–faktur."],answer:2,why:"Penerimaan hanya 950 kg; ada 50 kg yang belum diterima. Selisih bernilai Rp2,5 juta sebelum pajak.",effect:"Bagian pembelian memerlukan klarifikasi 50 kg; kuantitas gudang yang tersedia untuk produksi tetap 950 kg."},
{name:"Penelusuran produksi dan biaya",part:"Produksi & biaya",duration:"7 menit",docs:[{name:"Kartu Bahan RM-88",rows:[["Bahan dikeluarkan ke batch","800 kg"],["Harga per kg","Rp50.000"],["Nilai pemakaian bahan","Rp40.000.000"]]},{name:"Kartu Biaya Batch B-21",rows:[["Tenaga kerja langsung","Rp12.000.000"],["Overhead dibebankan","Rp8.000.000"],["Unit jadi baik","180 unit"],["Unit cacat/scrap","20 unit"],["Investigasi scrap","Belum selesai"]]}],q:"Sebelum menentukan biaya per unit dan menyelesaikan batch, mana yang tepat?",choices:["Tetapkan seluruh scrap sebagai kehilangan abnormal dan langsung bebankan semuanya.","Rekonsiliasi pemakaian bahan dan selidiki scrap terlebih dahulu; klasifikasi normal atau abnormal memengaruhi perlakuan biaya.","Abaikan scrap lalu bagi seluruh biaya batch langsung ke seluruh 200 unit tanpa memeriksa status barang."],answer:1,why:"Bahan Rp40 juta, tenaga kerja Rp12 juta, overhead Rp8 juta; total Rp60 juta. Kebijakan scrap dan bukti penyebab diperlukan untuk menentukan biaya produk serta perlakuan kehilangan.",effect:"Biaya batch Rp60 juta masih perlu analisis alokasi; 20 unit scrap belum boleh otomatis dinilai normal/abnormal."}
];
const fresh=()=>({step:0,team:"",mode:null,decisions:[null,null,null],diff:"",batch:"",gate:null,controls:[null,null,null],memo:"",complete:false});let S;try{S=JSON.parse(localStorage.getItem(STORE))||fresh()}catch{S=fresh()}if(!S||!Number.isInteger(S.step)||S.step<0||S.step>5)S=fresh();
function save(){try{localStorage.setItem(STORE,JSON.stringify(S))}catch{}}
function choice(group,choices,selected){return choices.map((x,i)=>'<button type="button" class="choice '+(selected===i?'selected':'')+'" data-group="'+group+'" data-i="'+i+'" aria-pressed="'+(selected===i)+'">'+escapeHtml(x)+'</button>').join("")}
function documentCard(d){return '<div class="doc"><div class="meta">PT NUSANIAGA DIGITAL · SIMULASI</div><h3>'+escapeHtml(d.name)+'</h3><table><tbody>'+d.rows.map(r=>'<tr><th>'+escapeHtml(r[0])+'</th><td>'+escapeHtml(r[1])+'</td></tr>').join('')+'</tbody></table></div>'}
function normalizedNumber(s){let x=String(s||"").trim().replace(/[.\s]/g,"");return /^\d+$/.test(x)?Number(x):NaN}
function calcScore(){let m=S.mode===0?10:0,d=S.decisions.reduce((n,v,i)=>n+(v===tasks[i].answer?15:0),0),recon=normalizedNumber(S.diff)===2500000?15:0,batch=normalizedNumber(S.batch)===60000000?15:0,gate=S.gate===0?15:0;return {mode:m,decisions:d,recon,batch,gate,total:m+d+recon+batch+gate}}
function processStatus(){return S.decisions.map((v,i)=>v===tasks[i].answer?'Ditangani dengan kontrol':'Pengecualian belum tertangani')}
function render(){const stage=S.step;$("top").innerHTML='<div class="chips"><span class="chip">Tahap '+(stage+1)+' dari 6</span><span class="chip">Waktu sasaran: 25 menit</span></div><div class="bar"><div style="width:'+Math.round(stage/5*100)+'%"></div></div>';let html='';
if(stage===0)html='<div class="card"><h2>Briefing tim pengendalian internal</h2><p>PT NusaNiaga Digital menerima pesanan pelanggan, memesan bahan, dan memproduksi barang. Anda akan memilih model alur, menangani tiga pengecualian transaksi, menghitung nilai yang relevan, lalu menetapkan keputusan pelepasan.</p><p class="note">Tiga kasus berlangsung dalam satu perusahaan, tetapi transaksi dalam dokumen tidak otomatis merupakan transaksi atau batch yang sama. Setiap keputusan dapat memengaruhi status pengendalian pada dashboard akhir.</p><label>Nama kelompok</label><input maxlength="80" id="team" value="'+escapeHtml(S.team)+'" placeholder="Misalnya: Kelompok 3"><div class="nav"><button class="btn alt" data-action="reset">Mulai ulang</button><button class="btn" data-action="next">Mulai →</button></div></div>';
if(stage===1)html='<div class="card"><h2>1. Tentukan model alur yang sesuai</h2><p>Perusahaan memulai produksi setelah menerima pesanan khusus pelanggan, lalu memesan bahan sesuai kebutuhan. Pilih model yang paling mendekati.</p>'+choice('mode',["Make-to-order: pesanan → kebutuhan bahan/pembelian → produksi → pengiriman dan penagihan.","Make-to-stock: produksi rutin tanpa hubungan langsung dengan pesanan khusus.","Pengiriman → pembayaran pemasok → produksi → pesanan pelanggan."],S.mode)+'<div class="nav"><button class="btn alt" data-action="back">Kembali</button><button class="btn" data-action="next">Lanjut →</button></div></div>';
if(stage>=2&&stage<=4){let i=stage-2,t=tasks[i];html='<div class="card"><div class="chips"><span class="chip">'+escapeHtml(t.part)+'</span><span class="chip">'+escapeHtml(t.duration)+'</span></div><h2>'+escapeHtml(t.name)+'</h2><div class="grid">'+t.docs.map(documentCard).join('')+'</div><h3>'+escapeHtml(t.q)+'</h3>'+choice('decision',t.choices,S.decisions[i]);if(i===1)html+='<div class="note"><b>Rekonsiliasi nilai:</b> Berapa nilai bahan yang belum diterima, sebelum pajak? <label for="diff">Nilai selisih (Rp)</label><input class="field" id="diff" inputmode="numeric" placeholder="Masukkan nilai rupiah" value="'+escapeHtml(S.diff)+'"></div>';if(i===2)html+='<div class="note"><b>Akuntansi biaya:</b> Jumlahkan bahan baku, tenaga kerja langsung, dan overhead yang dibebankan. <label for="batch">Total biaya batch (Rp)</label><input class="field" id="batch" inputmode="numeric" placeholder="Masukkan nilai rupiah" value="'+escapeHtml(S.batch)+'"></div>';html+='<label for="reason">Alasan singkat (opsional)</label><textarea id="reason" maxlength="400" placeholder="Mengapa memilih tindakan ini?">'+escapeHtml(S.controls[i]||'')+'</textarea><div class="nav"><button class="btn alt" data-action="back">Kembali</button><button class="btn" data-action="next">'+(i===2?'Ke keputusan akhir →':'Lanjut →')+'</button></div></div>'}
if(stage===5){let statuses=processStatus(),z=calcScore();html='<div class="card"><h2>5. Dashboard keputusan lintas proses</h2><p>Periksa status pengendalian dari keputusan kelompok sebelum menentukan tindak lanjut akhir.</p><div class="grid">'+tasks.map((t,i)=>'<div class="doc"><div class="meta">'+escapeHtml(t.part)+'</div><h3>'+escapeHtml(t.name)+'</h3><span class="pill '+(statuses[i]==='Ditangani dengan kontrol'?'green':'')+'">'+escapeHtml(statuses[i])+'</span></div>').join('')+'</div><h3>Keputusan akhir</h3><p>Apa yang harus dilakukan terhadap transaksi atau batch terkait?</p>'+choice('gate',["Lanjutkan hanya bagian yang memenuhi kontrol; tahan pengiriman tanpa otorisasi, selesaikan selisih penerimaan, dan investigasi scrap sebelum finalisasi biaya.","Lepaskan semua transaksi agar target operasi tercapai; tindak lanjut menyusul.","Hentikan semua proses perusahaan, termasuk transaksi lain yang tidak terkait.","Catat seluruh selisih sebagai beban pajak tanpa pengujian tambahan."],S.gate)+'<h3>Memo hasil kelompok</h3><textarea id="memo" maxlength="700" placeholder="Tulis 2–3 kalimat: satu risiko, satu kontrol, dan satu dampak biaya/akuntansi/pajak.">'+escapeHtml(S.memo)+'</textarea><div class="nav noprint"><button class="btn alt" data-action="back">Periksa jawaban</button><button class="btn" data-action="finish">Selesaikan kasus</button></div></div>';if(S.complete)html+='<div class="card"><h2>Hasil kelompok</h2><div class="score">'+z.total+'/100</div><p class="foot">Skor otomatis menilai keputusan terstruktur dan perhitungan. Mutu memo dinilai dosen saat diskusi, bukan berdasarkan panjang tulisan.</p><div class="grid">'+tasks.map((t,i)=>'<div class="result"><b>'+escapeHtml(t.part)+'</b><p>'+escapeHtml(t.choices[S.decisions[i]]||'-')+'</p><span class="pill '+(S.decisions[i]===t.answer?'green':'')+'">'+(S.decisions[i]===t.answer?'Sesuai kontrol':'Perlu ditinjau')+'</span></div>').join('')+'</div><p><b>Selisih bahan:</b> '+escapeHtml(S.diff||'-')+' · <b>Total biaya batch:</b> '+escapeHtml(S.batch||'-')+'</p><p><b>Memo:</b> '+escapeHtml(S.memo||'-')+'</p><details><summary>Pembahasan dan evaluasi</summary>'+tasks.map(t=>'<p><b>'+escapeHtml(t.part)+':</b> '+escapeHtml(t.why)+' '+escapeHtml(t.effect)+'</p>').join('')+'<p>Persetujuan kredit, selisih penerimaan, dan investigasi scrap mempunyai konsekuensi berbeda; tidak semuanya menuntut seluruh perusahaan berhenti.</p></details><div class="nav noprint"><button class="btn alt" data-action="export">Unduh ringkasan (.txt)</button><button class="btn" data-action="print">Cetak / simpan PDF</button></div></div>'}
$("app").innerHTML=html;save()}
function exportResult(){let z=calcScore();return ["SIPI SESI 6 — RUANG KENDALI MANUFAKTUR","Kelompok: "+S.team,"Skor: "+z.total+"/100","Model alur: "+S.mode,...tasks.flatMap((t,i)=>["",t.name,"Keputusan: "+t.choices[S.decisions[i]],"Alasan: "+(S.controls[i]||'')]),"Selisih bahan: "+S.diff,"Total biaya batch: "+S.batch,"Keputusan akhir: "+S.gate,"Memo: "+S.memo,"Data seluruhnya fiktif."].join("\n")}
document.addEventListener('input',e=>{if(e.target.id==='team')S.team=e.target.value;if(e.target.id==='reason')S.controls[S.step-2]=e.target.value;if(e.target.id==='diff')S.diff=e.target.value;if(e.target.id==='batch')S.batch=e.target.value;if(e.target.id==='memo')S.memo=e.target.value;S.complete=false;save()});
document.addEventListener('click',e=>{let b=e.target.closest('[data-action],[data-group]');if(!b)return;if(b.dataset.group){let i=Number(b.dataset.i);if(b.dataset.group==='mode')S.mode=i;if(b.dataset.group==='decision')S.decisions[S.step-2]=i;if(b.dataset.group==='gate')S.gate=i;S.complete=false;render();return}let a=b.dataset.action;if(a==='reset'){if(confirm('Hapus seluruh hasil latihan ini?')){S=fresh();render()}return}if(a==='back'){S.step=Math.max(0,S.step-1);S.complete=false;render();return}if(a==='next'){if(S.step===1&&S.mode===null){alert('Pilih model proses.');return}if(S.step>=2&&S.step<=4&&S.decisions[S.step-2]===null){alert('Pilih tindakan pengendalian terlebih dahulu.');return}if(S.step===3&&!Number.isFinite(normalizedNumber(S.diff))){alert('Masukkan nilai selisih bahan.');return}if(S.step===4&&!Number.isFinite(normalizedNumber(S.batch))){alert('Masukkan biaya total batch.');return}S.step=Math.min(5,S.step+1);render();return}if(a==='finish'){if(S.gate===null){alert('Pilih keputusan pelepasan.');return}S.complete=true;render();return}if(a==='export'){let blob=new Blob([exportResult()],{type:'text/plain;charset=utf-8'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='SIPI6_'+(S.team||'Kelompok').replace(/[^a-z0-9_-]/gi,'_')+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);return}if(a==='print')window.print()});render();
</script></body></html>
