<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIPI Sesi 6 · ERP Transaction Flow</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f8;color:#183046;font:15px/1.5 system-ui,Arial}header{background:#17364c;color:white;padding:20px}header>div,main{max-width:1030px;margin:auto}main{padding:18px 15px 70px}h1{font-size:clamp(25px,4vw,34px);margin:3px 0}h2{font-size:21px;margin:0 0 10px}h3{font-size:16px}p{margin:9px 0}.card{background:#fff;border:1px solid #d3dfe7;border-radius:12px;padding:20px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(225px,1fr));gap:11px}.muted{color:#5d7183;font-size:13px}.small{font-size:12px}.tag{display:inline-block;background:#e6eef4;border-radius:18px;padding:4px 9px;font-size:12px;color:#264e68;font-weight:700}.btn{background:#245678;color:white;border:0;border-radius:8px;padding:10px 15px;cursor:pointer;font:inherit;font-weight:700}.btn.alt{background:#e7eef4;color:#234b65}.btn:disabled{opacity:.5}.nav{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:16px}.choice{display:block;width:100%;text-align:left;padding:11px;border:1px solid #c5d3df;border-radius:8px;background:white;margin:7px 0;font:inherit;cursor:pointer}.choice[aria-pressed=true]{background:#e5f2ef;border:2px solid #387e73;padding:10px}.notice{background:#eaf3f7;border-left:4px solid #4f859d;padding:11px;margin:12px 0}.warn{background:#fff2e5;border-left-color:#b57e3d}.field{font-weight:650;display:block;margin:12px 0}textarea,input{font:inherit;border:1px solid #afc1d1;border-radius:7px;padding:9px;width:100%;max-width:100%}textarea{min-height:100px}.progress{height:7px;background:#dbe4ec;border-radius:9px;margin:9px 0}.progress>div{height:100%;background:#34877c;border-radius:9px}.bar{display:flex;gap:7px;flex-wrap:wrap}.erp{margin:12px 0;border:1px solid #b7cad7;border-radius:10px;overflow:hidden;background:white}.erp-head{background:#234962;color:#fff;padding:9px 12px;font-weight:750;display:flex;justify-content:space-between;gap:10px}.erp-body{padding:12px}.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:12px}td,th{border:1px solid #d7e1e9;text-align:left;padding:8px;vertical-align:top}th{background:#ebf2f7}.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:8px;margin:10px 0}.kpi{background:#eef4f8;padding:9px;border-radius:7px;font-size:12px}.kpi b{display:block;font-size:17px}.doc{border:1px solid #cad9e3;padding:12px;border-radius:8px;background:#fcfdfe}.doc h3{margin:4px 0 9px}.status{font-weight:750}.good{color:#197459}.bad{color:#a74b30}.footer-note{font-size:12px;color:#627487;margin-top:9px}.metric{font-size:27px;font-weight:800}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #d7a14d}@media print{header,.nav,.noprint{display:none!important}body{background:white}.card,.erp{break-inside:avoid}main{padding:0}}
</style></head><body><header><div><div class="small" style="color:#ead094;font-weight:700">FEB UGM · SIPI SESI 6</div><h1>ERP Transaction Flow</h1><div>Penjualan · Penerimaan · Rekonsiliasi · Dokumen Pajak</div></div></header><main><div id="progress"></div><div id="app"></div></main><script>
'use strict';
const KEY='sipi6-erp-v5',money=n=>'Rp'+Number(n).toLocaleString('id-ID'),safe=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fresh=()=>({step:0,team:'',sales:'',receiving:'',recon:'',tax:'',release:'',difference:'',memo:'',finished:false});
let s;try{s=JSON.parse(localStorage.getItem(KEY))||fresh()}catch{s=fresh()}if(!s||!Number.isInteger(s.step)||s.step<0||s.step>5)s=fresh();const $=id=>document.getElementById(id),save=()=>{try{localStorage.setItem(KEY,JSON.stringify(s))}catch{}};
const opts={
sales:[['allocate','Cadangkan 30 unit tersedia, ajukan pemenuhan parsial dengan persetujuan pelanggan; status sisa 30 unit tetap terbuka.',15],['hold','Tahan pengiriman 60 unit sampai ketersediaan penuh, konfirmasi jadwal kepada pelanggan.',11],['transfer','Ajukan realokasi dari pesanan lain setelah memeriksa komitmen dan persetujuan pihak terkait.',8]],
receiving:[['actual','Gunakan penerimaan terverifikasi 950 unit sebagai saldo fisik dan tandai 50 unit untuk pemeriksaan transaksi.',15],['pending','Tahan penyesuaian sementara sampai gudang, pemasok, dan akuntansi menyepakati bukti.',11],['net','Pertahankan entri 1.000 unit dan rencanakan kompensasi lewat nota kredit Oktober.',5]],
recon:[['separate','Rekonsiliasi inventori, GR/IR, AP dan GL secara terpisah; ajukan penyesuaian September setelah verifikasi dan audit trail.',20],['suspend','Tahan close atas akun terkait sampai dokumen pendukung lengkap, kemudian tentukan jurnal koreksi.',15],['next','Biarkan pencatatan September dan kompensasikan kekurangan seluruhnya pada Oktober.',6]],
tax:[['verify','Rekonsiliasi faktur, dokumen pajak, berita acara kekurangan dan nota kredit; pastikan status serta mekanisme koreksi sebelum menentukan periode pajak.',15],['park','Catat sebagai dokumen pajak yang masih menunggu konfirmasi dan tetapkan tenggat telaah.',11],['nettax','Kurangi pajak September langsung berdasar nota kredit Oktober tanpa memeriksa dokumen pajak terkait.',4]],
release:[['controlled','Setujui pemrosesan hanya bagian yang didukung bukti; pertahankan item terbuka dan pisahkan koreksi inventori/AP/GL dari penelaahan dokumen pajak.',15],['freeze','Tangguhkan seluruh proses pembelian pemasok hingga dokumen dan koreksi semua modul disahkan.',11],['close','Lanjutkan semua transaksi dan serahkan selisih kepada prosedur penutupan Oktober.',5]]
};
const chosen=k=>opts[k].find(x=>x[0]===s[k]),pts=k=>chosen(k)?.[2]||0;
const number=x=>{let v=String(x??'').trim().replace(/[.\s]/g,'');return /^\d+$/.test(v)?Number(v):NaN};
const amountOK=()=>number(s.difference)===2500000;
const autoScore=()=>['sales','receiving','recon','tax','release'].reduce((a,k)=>a+pts(k),0)+(amountOK()?5:0);
function table(cols,rows){return '<div class="scroll"><table><thead><tr>'+cols.map(x=>'<th>'+safe(x)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+safe(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}
function panel(name,inside,foot=''){return '<div class="erp"><div class="erp-head"><span>PT NUSANIAGA · '+safe(name)+'</span><span class="small">ERP SIMULASI</span></div><div class="erp-body">'+inside+(foot?'<p class="footer-note">'+safe(foot)+'</p>':'')+'</div></div>'}
function doc(title,rows){return '<div class="doc"><div class="muted">DOKUMEN SUMBER</div><h3>'+safe(title)+'</h3>'+table(['Atribut','Data'],rows)+'</div>'}
function choices(k){return opts[k].map(x=>'<button type="button" class="choice" data-field="'+k+'" data-value="'+x[0]+'" aria-pressed="'+(s[k]===x[0])+'">'+safe(x[1])+'</button>').join('')}
function nav(){return '<div class="nav noprint"><button class="btn alt" data-act="back">← Kembali</button><button class="btn" data-act="next">Lanjut →</button></div>'}
function label(k){const map={sales:{allocate:'Reservasi 30 unit / persetujuan parsial',hold:'Pengiriman ditunda',transfer:'Permintaan realokasi'},receiving:{actual:'Rekonsiliasi fisik 950',pending:'Pemeriksaan bersama',net:'Penyesuaian direncanakan Oktober'},recon:{separate:'Koreksi per modul diajukan',suspend:'Close akun ditangguhkan',next:'Kompensasi Oktober diajukan'},tax:{verify:'Pencocokan dokumen pajak',park:'Tindak lanjut dijadwalkan',nettax:'Neto pajak September diajukan'},release:{controlled:'Pelepasan berbasis bukti',freeze:'Penahanan menyeluruh',close:'Lanjut penutupan reguler'}};return map[k]?.[s[k]]||'Belum ditentukan'}
function salesPanel(){return panel('SALES / FULFILMENT',table(['Transaksi','Permintaan','Stok siap tersedia','Komitmen lain','Keputusan tercatat'],[['SO-1468','60 unit','30 unit','40 unit terkunci untuk SO lain',label('sales')]])+'<div class="kpis"><div class="kpi">Kebutuhan order<b>60 unit</b></div><div class="kpi">Tersedia bebas<b>30 unit</b></div><div class="kpi">Sisa yang perlu dipenuhi<b>30 unit</b></div></div>','Stok 40 unit yang telah dialokasikan untuk pelanggan lain tidak termasuk 30 unit bebas. Belum ada delivery order yang diposting.')}
function receiptPanel(){let post=s.receiving==='actual'?950:1000;return panel('GOODS RECEIPT / INVENTORY',table(['Sumber','Tanggal','Kuantitas','Nilai sebelum pajak'],[['PO-772','26 September','1.000 unit',money(50000000)],['GRN-33 · berita acara timbang','29 September','950 unit',money(47500000)],['Log input GRN-33','30 September','1.000 unit',money(50000000)],['Penerimaan terpilih dalam simulasi','—',post+' unit',money(post*50000)]])+'<div class="kpis"><div class="kpi">Register mengikuti keputusan<b>'+post+' unit</b></div><div class="kpi">Nilai register<b>'+money(post*50000)+'</b></div></div>','Posting asli 1.000 unit tetap dicatat dalam log historis. Pilihan simulasi tidak menghapus jejak posting lama.')}
function ledgerPanel(){return panel('SUBLEDGER AP / GENERAL LEDGER',table(['Ref','Tanggal','Modul / akun','Debit','Kredit'],[['GR-09','30 Sep','Persediaan',money(50000000),'—'],['GR-09','30 Sep','GR/IR','—',money(50000000)],['AP-09','30 Sep','GR/IR',money(50000000),'—'],['AP-09','30 Sep','Utang usaha','—',money(50000000)]])+table(['Data pendukung','Keterangan'],[['DCR-29','Laporan perbedaan penerimaan 29 September: 50 unit tidak dikirim; ditandatangani gudang dan logistik pemasok.'],['CN-SUP-17','Nota kredit pemasok 2 Oktober untuk 50 unit yang tidak dikirim pada 29 September.'],['Rencana tindak lanjut',label('recon')]]),'GR/IR disederhanakan sebagai akun penampung. Buku besar September masih menunjukkan nilai transaksi asli; keputusan koreksi dicatat sebagai usulan, bukan posting jurnal otomatis.')}
function taxPanel(){return panel('TAX DOCUMENT REGISTER',table(['Ref','Tanggal','Jenis/status','Rincian'],[['INV-V209','30 Sep','Faktur komersial diterima','1.000 unit / '+money(50000000)],['TAX-209','30 Sep','Dokumen perpajakan pemasok belum diverifikasi','Nomor dan nilai referensi INV-V209; status validasi belum ada'],['DCR-29','29 Sep','Laporan kekurangan fisik','50 unit tidak dikirim'],['CN-SUP-17','2 Okt','Nota kredit komersial','50 unit / '+money(2500000)],['TAX-CORR','—','Dokumen pajak koreksi belum diterima','Jenis, kebutuhan, dan periode perlu diverifikasi']])+table(['Instruksi tim','Status'],[['Dokumen pajak',label('tax')]]),'Tarif, jenis pajak, status PKP, dan dokumen pembetulan tidak diasumsikan. Perlakuan pajak final memerlukan bukti serta dasar ketentuan yang relevan pada periode transaksi.')}
function cockpit(){return panel('INTEGRATED RECONCILIATION COCKPIT',table(['Modul','Bukti / angka','Keputusan atau tindak lanjut'],[['Sales','SO-1468: 60 unit; stok bebas 30',label('sales')],['Gudang','Fisik 950; log ERP 1.000',label('receiving')],['Inventory / AP / GL','Posting awal '+money(50000000)+'; bukti fisik '+money(47500000),label('recon')],['Dokumen pajak','INV-V209 / TAX-209 / CN-SUP-17',label('tax')],['Otorisasi','Proses transaksi lintas modul',label('release')]])+'<div class="kpis"><div class="kpi">Nilai beda yang dihitung kelompok<b>'+(s.difference?money(number(s.difference)||0):'—')+'</b></div><div class="kpi">Sisa order pelanggan<b>30 unit</b></div></div>','Tampilan keputusan tidak menunjukkan benar/salah. Entri dan rekomendasi koreksi tidak merepresentasikan jurnal yang sudah diposting.')}
function rubric(){const cells=[['Fulfilment dan data pelanggan',15,pts('sales'),'Tinjau ketersediaan bebas, komitmen order lain, dan persetujuan pengiriman parsial.'],['Validitas penerimaan',15,pts('receiving'),'Bedakan GRN fisik, log input ERP, dan jejak koreksi.'],['Rekonsiliasi AP, inventory, GL',20,pts('recon'),'Perbedaan sudah diketahui pada 29 September; koreksi harus berjejak audit dan sesuai bukti.'],['Pengendalian dokumen perpajakan',15,pts('tax'),'Verifikasi jenis, validitas dan perbaikan dokumen pajak; nota kredit komersial bukan otomatis dokumen pajak koreksi.'],['Otorisasi terintegrasi',15,pts('release'),'Pisahkan transaksi yang terbukti dari item terbuka, dengan otorisasi per modul.'],['Perhitungan selisih',5,amountOK()?5:0,'50 unit × Rp50.000 = Rp2.500.000 sebelum pajak.']];return '<section class="erp" id="rubric"><div class="erp-head">RUBRIK EVALUASI AKHIR · '+autoScore()+'/85 otomatis</div><div class="erp-body">'+table(['Aspek','Maks','Nilai','Umpan balik'],cells.map(x=>[x[0],x[1],x[2],(x[2]===x[1]?'Tercapai. ':'Perlu telaah. ')+x[3]]))+'<h3>Memo kelompok · maksimum 15 poin, dinilai dosen</h3>'+table(['Indikator','Poin'],[['Ketepatan alur data dan bukti sumber',5],['Penanganan periode dan koordinasi antarmodul',5],['Justifikasi keputusan serta ketidakpastian dokumen pajak',5]])+'<p>Total akhir = '+autoScore()+'/85 + nilai memo (maksimum 15). Penilaian alternatif bertingkat menurut kelengkapan tindakan.</p></div></section>'}
function render(){let h='';$('progress').innerHTML='<div class="bar"><span class="tag">Tahap '+(s.step+1)+'/6</span><span class="tag">25 menit</span><span class="tag">Tersimpan lokal</span></div><div class="progress"><div style="width:'+(s.step/5*100)+'%"></div></div>';
if(s.step===0)h='<div class="card"><h2>Ringkasan transaksi · 2 menit</h2><p>PT NusaNiaga menutup buku September. Terdapat pesanan pelanggan yang perlu dipenuhi dan perbedaan kuantitas pada pembelian bahan yang sudah masuk ERP. Tim diminta menentukan pemrosesan dan tindak lanjut berdasarkan dokumen sumber.</p><label class="field">Nama kelompok<input id="team" maxlength="70" value="'+safe(s.team)+'" placeholder="Kelompok 1"></label><div class="notice">Setiap tindakan dicatat. Evaluasi disajikan setelah seluruh proses dan memo diselesaikan.</div><div class="nav"><button class="btn alt" data-act="reset">Mulai ulang</button><button class="btn" data-act="next">Buka ERP →</button></div></div>';
if(s.step===1)h='<div class="card"><h2>1. Order fulfilment · 4 menit</h2><div class="grid">'+doc('Sales Order SO-1468',[['Customer','CV Mitra Grosir'],['Permintaan','60 unit barang jadi'],['Janji kirim','3 Oktober'],['Persetujuan pengiriman parsial','Belum ada']])+doc('Available-to-Promise',[['Stok barang jadi bebas','30 unit'],['Stok teralokasi pesanan lain','40 unit'],['Barang dalam perjalanan','Tidak ada konfirmasi']])+'</div>'+salesPanel()+'<h3>Pilih langkah pemenuhan pesanan</h3>'+choices('sales')+nav()+'</div>';
if(s.step===2)h='<div class="card"><h2>2. Penerimaan dan dokumen sumber · 5 menit</h2><div class="grid">'+doc('Purchase Order PO-772',[['Pemasok','PT Cakrawala Komponen'],['Pesanan','1.000 unit × '+money(50000)]])+doc('Goods Receipt GRN-33',[['Timbang fisik 29 Sep','950 unit'],['Log entri 30 Sep','1.000 unit']])+doc('Discrepancy Report DCR-29',[['Pemeriksaan','50 unit tidak dikirim pemasok'],['Bukti','Gudang dan logistik pemasok menyetujui pada 29 Sep']])+'</div>'+receiptPanel()+'<h3>Pilih penanganan data penerimaan</h3>'+choices('receiving')+nav()+'</div>';
if(s.step===3)h='<div class="card"><h2>3. Rekonsiliasi dan periode akuntansi · 6 menit</h2>'+ledgerPanel()+'<label class="field">Hitung selisih nilai sebelum pajak (rupiah)<input id="difference" inputmode="numeric" autocomplete="off" placeholder="Masukkan nilai rupiah" value="'+safe(s.difference)+'"></label><h3>Pilih instruksi koreksi modul terkait</h3>'+choices('recon')+nav()+'</div>';
if(s.step===4)h='<div class="card"><h2>4. Dokumen pajak · 4 menit</h2>'+taxPanel()+'<h3>Pilih instruksi penanganan dokumen</h3>'+choices('tax')+nav()+'</div>';
if(s.step===5)h='<div class="card"><h2>5. Keputusan integrasi dan memo · 4 menit</h2>'+cockpit()+'<h3>Instruksi akhir untuk pemrosesan transaksi</h3>'+(s.finished?'<p>'+safe(chosen('release')?.[1]||'')+'</p>':choices('release'))+'<label class="field">Memo kelompok (3–5 kalimat)<textarea id="memo" maxlength="1200" '+(s.finished?'disabled':'')+' placeholder="Jelaskan temuan, penanganan per modul, keputusan cut-off, dan dokumen yang masih memerlukan konfirmasi.">'+safe(s.memo)+'</textarea></label>'+(s.finished?rubric()+'<div class="nav noprint"><button class="btn alt" data-act="download">Unduh laporan dan rubrik</button><button class="btn" data-act="print">Cetak / PDF</button><button class="btn alt" data-act="reset">Mulai ulang</button></div>':'<div class="nav noprint"><button class="btn alt" data-act="back">← Kembali</button><button class="btn" data-act="finish">Selesaikan & tampilkan rubrik</button></div>')+'</div>';
$('app').innerHTML=h;save()}
function report(){return ['SIPI SESI 6 — INTEGRASI TRANSAKSI','Kelompok: '+s.team,'','DOKUMEN SO-1468: 60 unit, 30 stok bebas; PO-772: 1.000 unit; GRN fisik: 950; ERP/AP: 1.000; DCR-29: 50 tidak dikirim; nota kredit: 2 Okt','',...['sales','receiving','recon','tax','release'].map(k=>k+': '+(chosen(k)?.[1]||'-')),'Selisih dihitung: '+s.difference,'Memo: '+s.memo,'','RUBRIK',...['sales','receiving','recon','tax','release'].map(k=>k+': '+pts(k)), 'Selisih: '+(amountOK()?5:0)+'/5','Subtotal: '+autoScore()+'/85; memo maksimal 15 dinilai dosen','Simulasi fiktif.'].join('\n')}
document.addEventListener('input',e=>{if(e.target.id==='team')s.team=e.target.value;if(e.target.id==='difference'&&!s.finished)s.difference=e.target.value;if(e.target.id==='memo'&&!s.finished)s.memo=e.target.value;save()});
document.addEventListener('click',e=>{const b=e.target.closest('[data-field],[data-act]');if(!b)return;if(b.dataset.field){if(s.finished)return;s[b.dataset.field]=b.dataset.value;render();return}const a=b.dataset.act;if(a==='reset'){if(confirm('Hapus progres kelompok?')){s=fresh();render()}return}if(a==='back'){if(s.finished)return;s.step=Math.max(0,s.step-1);render();return}if(a==='next'){const field={1:'sales',2:'receiving',3:'recon',4:'tax'}[s.step];if(field&&!s[field]||s.step===3&&!s.difference.trim()){alert('Lengkapi data dan keputusan sebelum melanjutkan.');return}s.step=Math.min(5,s.step+1);render();return}if(a==='finish'){if(s.step!==5)return;if(!s.release||s.memo.trim().length<80){alert('Lengkapi keputusan akhir dan memo dengan dasar pertimbangan.');return}s.finished=true;render();return}if(a==='download'||a==='print'){if(!s.finished)return;if(a==='print'){window.print();return}let url=URL.createObjectURL(new Blob([report()],{type:'text/plain;charset=utf-8'})),link=document.createElement('a');link.href=url;link.download='SIPI6_'+(s.team||'Kelompok').replace(/[^a-z0-9_-]/gi,'_')+'.txt';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}});render();
</script></body></html>
