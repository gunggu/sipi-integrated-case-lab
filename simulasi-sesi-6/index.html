<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIPI Sesi 6 · Kendali Siklus Manufaktur</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f5f8;color:#172b41;font:15px/1.5 system-ui,Arial}header{background:#19364f;color:white;padding:26px 18px}header>div,main{max-width:950px;margin:auto}h1{margin:5px 0;font-size:clamp(25px,4vw,36px)}h2{font-size:21px}h3{font-size:17px;margin:10px 0}main{padding:20px 15px 65px}.card{background:white;border:1px solid #d5dfe8;border-radius:14px;padding:20px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.muted{color:#627588}.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.chip{background:#e5eef5;color:#264967;border-radius:24px;padding:5px 10px;font-size:12px;font-weight:700}.btn{border:0;background:#255374;color:white;padding:10px 15px;border-radius:9px;cursor:pointer;font:inherit;font-weight:600}.btn.alt{background:#e6eef4;color:#24425c}.btn:disabled{opacity:.5;cursor:not-allowed}.choice{display:block;width:100%;background:white;border:1px solid #c6d2df;border-radius:9px;text-align:left;padding:12px;margin:8px 0;font:inherit;cursor:pointer}.choice.selected{border:2px solid #276c75;background:#e8f4f1;padding:11px}.notice{background:#eef5f9;border-left:4px solid #407b98;padding:12px;margin:12px 0}.doc{border:1px solid #c9d5e0;background:#fff;padding:14px;border-radius:9px}.doc .id{font-size:11px;font-weight:800;letter-spacing:.07em;color:#607f95}.doc h3{border-bottom:2px solid #275577;padding-bottom:7px}.doc table{border-collapse:collapse;width:100%;font-size:13px}.doc td,.doc th{border-bottom:1px solid #dfe6ed;padding:7px 5px;text-align:left}.step{display:inline-block;border:1px dashed #a0b4c8;padding:9px 12px;margin:5px;border-radius:9px;cursor:pointer;background:#fff}.step.active{background:#dae9f4;border-style:solid}.nav{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-top:16px}.score{font-size:30px;color:#24647a;font-weight:850}input,textarea{font:inherit;padding:10px;width:100%;border:1px solid #b4c4d2;border-radius:9px}textarea{min-height:95px}.tiny{font-size:12px}.progress{height:8px;background:#dbe6ef;border-radius:20px;overflow:hidden}.progress>div{height:100%;background:#379287;transition:width .2s}.report{border-left:3px solid #467d93;padding-left:12px;margin:12px 0}@media print{header,.nav,.noprint{display:none!important}body{background:white}.card,.doc{break-inside:avoid;box-shadow:none}}
</style></head><body><header><div><div class="tiny">FEB UGM · SIPI SESI 6</div><h1>Ruang Kendali Manufaktur</h1><div>Siklus pendapatan · pengeluaran · produksi · akuntansi biaya</div></div></header><main><div id="top"></div><div id="app"></div></main><script>
"use strict";
const K="sipi6-controlroom-v1",esc=s=>String(s??"").replace(/[&<>"']/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[x]));
const scenario=[
{title:"Dari pesanan ke penerimaan kas",subtitle:"Pesanan, pengiriman, penagihan",docs:[{title:"Sales Order SO-1468",rows:[["Pelanggan","CV Mitra Grosir"],["Pesanan","100 unit @ Rp2.000.000"],["Nilai","Rp200.000.000"],["Limit kredit tersisa","Rp120.000.000"],["Status","Permintaan belum disetujui kredit"]]},{title:"Instruksi Gudang",rows:[["Barang siap kirim","100 unit"],["Surat jalan","Belum diterbitkan"],["Faktur","Belum diterbitkan"]]}],question:"Tindakan pengendalian apa yang harus dilakukan SEBELUM pengiriman?",options:["Minta persetujuan kredit atau pembayaran yang sesuai kebijakan sebelum barang dilepas.","Kirim karena barang tersedia, lalu lakukan evaluasi kredit saat penagihan.","Terbitkan faktur terlebih dahulu agar limit kredit dianggap cukup.","Hapus sisa limit kredit karena pelanggan sudah pernah membeli."],correct:0,explain:"Order Rp200 juta melebihi limit tersisa Rp120 juta. Pengendalian otorisasi kredit mendahului pengiriman. Jika tidak, risiko piutang tak tertagih meningkat.",cost:"Periksa risiko ketertagihan piutang dan kelengkapan dokumen order–pengiriman–faktur."},
{title:"Dari pembelian ke utang usaha",subtitle:"Permintaan, PO, penerimaan, faktur pemasok",docs:[{title:"PO-772 · Pembelian Bahan",rows:[["Pemasok","PT Prima Material"],["Pesanan","1.000 kg bahan @ Rp50.000"],["Jumlah PO","Rp50.000.000"]]},{title:"Berita Acara Penerimaan GRN-33",rows:[["Diterima dan ditimbang","950 kg"],["Diterima sesuai spesifikasi","950 kg"],["Dicatat gudang","950 kg"]]},{title:"Faktur Pemasok INV-V209",rows:[["Ditagih","1.000 kg"],["Nilai faktur sebelum pajak","Rp50.000.000"],["Status","Menunggu persetujuan pembayaran"]]}],question:"Apa tindakan paling tepat sebelum utang dan pembayaran disetujui?",options:["Lakukan pencocokan PO–penerimaan–faktur dan klarifikasi selisih 50 kg.","Bayar faktur karena jumlahnya sesuai PO yang disetujui.","Ubah penerimaan gudang menjadi 1.000 kg agar cocok.","Catat 50 kg selisih sebagai overhead produksi tanpa investigasi."],correct:0,explain:"PO dan faktur masing-masing 1.000 kg, tetapi penerimaan hanya 950 kg. Three-way match menemukan 50 kg belum diterima. Tidak tepat membayar atau mencatat tanpa tindak lanjut.",cost:"Selisih 50 kg × Rp50.000 = Rp2.500.000 sebelum pajak perlu ditangani; tidak otomatis menjadi utang atau beban."},
{title:"Dari bahan baku ke harga pokok produksi",subtitle:"Pemakaian bahan, WIP, scrap dan biaya",docs:[{title:"Kartu Pemakaian Bahan RM-88",rows:[["Bahan keluar produksi","800 kg"],["Harga bahan per kg","Rp50.000"],["Biaya bahan keluar","Rp40.000.000"]]},{title:"Laporan Produksi Batch B-21",rows:[["Barang baik","180 unit"],["Produk cacat/scrap","20 unit"],["Tarif tenaga kerja langsung batch","Rp12.000.000"],["Overhead dibebankan batch","Rp8.000.000"],["Status scrap","Penyebab belum diverifikasi"]]}],question:"Apa tindakan paling tepat atas laporan biaya dan scrap?",options:["Rekonsiliasi 800 kg bahan ke laporan batch/WIP; investigasi 20 unit scrap sebelum menentukan perlakuan biayanya.","Bebankan seluruh biaya scrap sebagai kerugian karena semua cacat pasti abnormal.","Abaikan scrap; cukup bagi total biaya batch dengan 180 barang baik.","Pindahkan overhead ke utang pemasok agar nilai WIP turun."],correct:0,explain:"Total biaya batch = Rp40 juta + Rp12 juta + Rp8 juta = Rp60 juta. Penyebab scrap harus diperiksa sebelum menentukan apakah biaya terkait merupakan kehilangan normal atau abnormal.",cost:"Bahan Rp40 juta + TKL Rp12 juta + OH Rp8 juta = Rp60 juta. Biaya per unit tidak dapat diputuskan tanpa kebijakan dan klasifikasi scrap."}
];
const init=()=>({stage:0,team:"",order:[],answers:[null,null,null],controls:[null,null,null],calc:"",decision:null,memo:"",done:false});
let S;try{S=JSON.parse(localStorage.getItem(K))||init()}catch{S=init()}if(!S||!Number.isInteger(S.stage)||S.stage<0||S.stage>5)S=init();
const persist=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch{}};
const el=id=>document.getElementById(id);
function doc(d){return '<div class="doc"><div class="id">PT NUSANIAGA DIGITAL · DOKUMEN SIMULASI</div><h3>'+esc(d.title)+'</h3><table><tbody>'+d.rows.map(r=>'<tr><th>'+esc(r[0])+'</th><td>'+esc(r[1])+'</td></tr>').join('')+'</tbody></table></div>'}
function options(name,items,value){return items.map((v,i)=>'<button class="choice '+(value===i?'selected':'')+'" data-opt="'+name+'" data-index="'+i+'" aria-pressed="'+(value===i)+'">'+esc(v)+'</button>').join('')}
function score(){let process=S.order.join(",")==="0,1,2"?15:0;let decisions=S.answers.reduce((a,v,i)=>a+(v===scenario[i].correct?15:0),0);let arithmetic=S.calc.trim().replace(/\./g,"").replace(/\s/g,"");let calc=(arithmetic==="2500000"||arithmetic==="2.500.000")?15:0;let gate=S.decision===0?15:0;let memo=S.memo.trim().length>=70?10:0;return {process,decisions,calc,gate,memo,total:process+decisions+calc+gate+memo};}
function render(){el("top").innerHTML='<div class="bar"><span class="chip">Tahap '+(S.stage+1)+'/6</span><span class="chip">Simulasi kelompok</span><span class="chip">±25 menit</span></div><div class="progress"><div style="width:'+Math.round(S.stage/5*100)+'%"></div></div>';let h='';
if(S.stage===0)h='<div class="card"><h2>Briefing</h2><p>Anda adalah tim pengendalian internal PT NusaNiaga Digital. Tiga proses saling terkait: pesanan pelanggan, pembelian bahan, dan produksi. Tugas Anda adalah menahan transaksi bermasalah, menelusuri dokumen, dan membuat rekomendasi yang dapat dipertanggungjawabkan.</p><div class="notice">Kegiatan: susun alur dokumen → putuskan tiga pengecualian → hitung nilai selisih → putuskan pelepasan transaksi → simpulkan.</div><label>Nama kelompok<input id="team" maxlength="80" placeholder="Kelompok 1" value="'+esc(S.team)+'"></label><div class="nav"><button class="btn alt" data-action="reset">Ulangi</button><button class="btn" data-action="next">Mulai simulasi →</button></div></div>';
if(S.stage===1){let labels=["Produksi & pemakaian bahan","Penjualan & penagihan","Pembelian & penerimaan bahan"];h='<div class="card"><h2>Susun alur keterkaitan proses</h2><p>Klik urutan siklus bisnis yang mencerminkan alur sederhana: permintaan pelanggan mendorong kebutuhan bahan dan dilanjutkan kegiatan produksi. Ini bukan satu-satunya konfigurasi manufaktur.</p><div class="grid">'+labels.map((x,i)=>'<button class="choice" data-pick="'+[2,0,1][i]+'" '+(S.order.includes([2,0,1][i])?'disabled':'')+'>'+esc(x)+'</button>').join('')+'</div><h3>Urutan pilihan kelompok</h3><p>'+S.order.map((x,i)=>'<span class="chip">'+(i+1)+'. '+esc(["Penjualan & penagihan","Pembelian & penerimaan bahan","Produksi & pemakaian bahan"][x])+'</span>').join(' ')+'</p><div class="nav"><button class="btn alt" data-action="clearorder">Hapus urutan</button><button class="btn" data-action="next">Lanjut →</button></div></div>'}
if(S.stage>=2&&S.stage<=4){let i=S.stage-2,c=scenario[i];h='<div class="card"><span class="chip">Ruang kendali '+(i+1)+'/3</span><h2>'+esc(c.title)+'</h2><p class="muted">'+esc(c.subtitle)+'</p><div class="grid">'+c.docs.map(doc).join('')+'</div><h3>'+esc(c.question)+'</h3>'+options("answer",c.options,S.answers[i])+'<label>Alasan kelompok (opsional, 1–2 kalimat)<textarea id="memoCase" placeholder="Dokumen apa yang menjadi dasar keputusan?">'+esc(S.controls[i]||"")+'</textarea></label>'+(i===1?'<div class="notice"><b>Tantangan hitung:</b> Berapa nilai selisih bahan belum diterima sebelum pajak? Masukkan angka rupiah tanpa Rp.<input inputmode="numeric" id="calc" value="'+esc(S.calc)+'" placeholder="Contoh: 2500000"></div>':'')+'<div class="nav"><button class="btn alt" data-action="back">Kembali</button><button class="btn" data-action="next">Lanjut →</button></div></div>'}
if(S.stage===5){let z=score();h='<div class="card"><h2>Keputusan pelepasan dan memo kendali</h2><p>Anda sudah meninjau tiga siklus. Apakah semua transaksi dapat langsung dilanjutkan tanpa tindak lanjut?</p>'+options("gate",["Tidak. Tahan bagian yang bermasalah, selesaikan otorisasi, selisih penerimaan, dan investigasi scrap sebelum pelepasan terkait.","Ya. Ketiga siklus secara umum berjalan, pengecualian dapat diselesaikan setelah penutupan bulan.","Tahan seluruh transaksi perusahaan termasuk yang tidak bermasalah.","Buat jurnal koreksi sebesar seluruh nilai order dan bahan tanpa pemeriksaan tambahan."],S.decision)+'<h3>Memo kelompok</h3><textarea id="memo" placeholder="Jelaskan dua risiko, kontrol prioritas, dan konsekuensi akuntansi atau pajak dalam 2–4 kalimat.">'+esc(S.memo)+'</textarea><div class="nav"><button class="btn alt" data-action="back">Kembali</button><button class="btn" data-action="finish">Selesaikan & lihat evaluasi</button></div></div>';if(S.done)h+='<div class="card"><h2>Ringkasan hasil</h2><div class="score">'+z.total+'/100</div><p class="muted">Skor formatif, bukan penilaian audit profesional yang tervalidasi.</p><div class="grid">'+scenario.map((c,i)=>'<div class="report"><b>'+esc(c.title)+'</b><div>'+esc(c.options[S.answers[i]]||"Belum dijawab")+'</div><p class="muted">'+esc(S.controls[i]||"")+'</p></div>').join('')+'</div><details><summary>Pembahasan ketiga kasus</summary>'+scenario.map((c,i)=>'<p><b>'+esc(c.title)+':</b> '+esc(c.explain)+' <i>'+esc(c.cost)+'</i></p>').join('')+'</details><p><b>Memo:</b> '+esc(S.memo)+'</p><div class="nav noprint"><button class="btn alt" data-action="export">Unduh hasil (.txt)</button><button class="btn" data-action="print">Cetak / simpan PDF</button></div></div>'}
el("app").innerHTML=h;persist()}
function resultText(){let z=score();return ["SIPI Sesi 6 — HASIL SIMULASI", "Kelompok: "+S.team, "Skor: "+z.total+"/100", "Urutan proses: "+S.order.join("-"), ...scenario.flatMap((c,i)=>["",c.title,"Keputusan: "+c.options[S.answers[i]],"Alasan: "+(S.controls[i]||"")]),"Selisih bahan (Rp): "+S.calc,"Gate: "+S.decision,"Memo: "+S.memo,"Semua dokumen dan organisasi fiktif."].join("\n")}
document.addEventListener("input",e=>{if(e.target.id==="team")S.team=e.target.value;if(e.target.id==="memoCase")S.controls[S.stage-2]=e.target.value;if(e.target.id==="calc")S.calc=e.target.value;if(e.target.id==="memo")S.memo=e.target.value;persist()});
document.addEventListener("click",e=>{const b=e.target.closest("[data-action],[data-opt],[data-pick]");if(!b)return;if(b.dataset.pick!==undefined){let v=Number(b.dataset.pick);if(!S.order.includes(v)&&S.order.length<3)S.order.push(v);render();return}if(b.dataset.opt){let i=Number(b.dataset.index);if(b.dataset.opt==="answer")S.answers[S.stage-2]=i;else S.decision=i;S.done=false;render();return}let a=b.dataset.action;if(a==="reset"){if(confirm("Hapus hasil simulasi di perangkat ini?")){S=init();render()}return}if(a==="clearorder"){S.order=[];render();return}if(a==="back"){S.stage=Math.max(0,S.stage-1);render();return}if(a==="next"){if(S.stage===1&&S.order.length!==3){alert("Lengkapi ketiga urutan proses.");return}if(S.stage>=2&&S.stage<=4&&S.answers[S.stage-2]===null){alert("Pilih keputusan sebelum melanjutkan.");return}S.stage=Math.min(5,S.stage+1);render();return}if(a==="finish"){if(S.decision===null){alert("Tentukan keputusan pelepasan terlebih dahulu.");return}S.done=true;render();return}if(a==="export"){let blob=new Blob([resultText()],{type:"text/plain;charset=utf-8"}),u=URL.createObjectURL(blob),link=document.createElement("a");link.href=u;link.download="SIPI6_Hasil_"+(S.team||"Kelompok").replace(/[^a-z0-9_-]/gi,"_")+".txt";link.click();setTimeout(()=>URL.revokeObjectURL(u),1000);return}if(a==="print")window.print()});
render();
</script></body></html>
