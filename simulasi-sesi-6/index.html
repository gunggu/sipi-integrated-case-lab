<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIPI Sesi 6 · ERP Transaction Flow</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f8;color:#183046;font:15px/1.5 system-ui,Arial}header{background:#17364c;color:white;padding:20px}header>div,main{max-width:1030px;margin:auto}main{padding:18px 15px 70px}h1{font-size:clamp(25px,4vw,34px);margin:3px 0}h2{font-size:21px;margin:0 0 10px}h3{font-size:16px}p{margin:9px 0}.card{background:#fff;border:1px solid #d3dfe7;border-radius:12px;padding:20px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(225px,1fr));gap:11px}.muted{color:#5d7183;font-size:13px}.small{font-size:12px}.tag{display:inline-block;background:#e6eef4;border-radius:18px;padding:4px 9px;font-size:12px;color:#264e68;font-weight:700}.btn{background:#245678;color:white;border:0;border-radius:8px;padding:10px 15px;cursor:pointer;font:inherit;font-weight:700}.btn.alt{background:#e7eef4;color:#234b65}.btn:disabled{opacity:.5}.nav{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:16px}.choice{display:block;width:100%;text-align:left;padding:11px;border:1px solid #c5d3df;border-radius:8px;background:white;margin:7px 0;font:inherit;cursor:pointer}.choice[aria-pressed=true]{background:#e5f2ef;border:2px solid #387e73;padding:10px}.notice{background:#eaf3f7;border-left:4px solid #4f859d;padding:11px;margin:12px 0}.warn{background:#fff2e5;border-left-color:#b57e3d}.field{font-weight:650;display:block;margin:12px 0}textarea,input{font:inherit;border:1px solid #afc1d1;border-radius:7px;padding:9px;width:100%;max-width:100%}textarea{min-height:100px}.progress{height:7px;background:#dbe4ec;border-radius:9px;margin:9px 0}.progress>div{height:100%;background:#34877c;border-radius:9px}.bar{display:flex;gap:7px;flex-wrap:wrap}.erp{margin:12px 0;border:1px solid #b7cad7;border-radius:10px;overflow:hidden;background:white}.erp-head{background:#234962;color:#fff;padding:9px 12px;font-weight:750;display:flex;justify-content:space-between;gap:10px}.erp-body{padding:12px}.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:12px}td,th{border:1px solid #d7e1e9;text-align:left;padding:8px;vertical-align:top}th{background:#ebf2f7}.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:8px;margin:10px 0}.kpi{background:#eef4f8;padding:9px;border-radius:7px;font-size:12px}.kpi b{display:block;font-size:17px}.doc{border:1px solid #cad9e3;padding:12px;border-radius:8px;background:#fcfdfe}.doc h3{margin:4px 0 9px}.status{font-weight:750}.good{color:#197459}.bad{color:#a74b30}.footer-note{font-size:12px;color:#627487;margin-top:9px}.metric{font-size:27px;font-weight:800}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #d7a14d}@media print{header,.nav,.noprint{display:none!important}body{background:white}.card,.erp{break-inside:avoid}main{padding:0}}
</style></head><body><header><div><div class="small" style="color:#ead094;font-weight:700">FEB UGM · SIPI SESI 6</div><h1>ERP Transaction Flow</h1><div>Pesanan · Penerimaan bahan · Pencocokan faktur · Integrasi informasi</div></div></header><main><div id="progress"></div><div id="app"></div></main><script>
'use strict';
const KEY='sipi6-erpflow-v4',money=n=>'Rp'+Number(n).toLocaleString('id-ID'),safe=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fresh=()=>({step:0,team:'',sales:'',goods:'',invoice:'',interpret:'',memo:'',finished:false});
let s;try{s=JSON.parse(localStorage.getItem(KEY))||fresh()}catch{s=fresh()}if(!s||!Number.isInteger(s.step)||s.step<0||s.step>5)s=fresh();if(typeof s.finished!=='boolean')s.finished=false;
const $=id=>document.getElementById(id),persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(s))}catch{}};
const salesOK=()=>s.sales==='review',goodsOK=()=>s.goods==='actual',invoiceOK=()=>s.invoice==='hold',interpretOK=()=>s.interpret==='source';
function scores(){return {sales:salesOK()?20:0,receipt:goodsOK()?20:0,invoice:invoiceOK()?20:0,interpret:interpretOK()?25:0,integration:(salesOK()&&goodsOK()&&invoiceOK()&&interpretOK())?15:0}}
function score(){return Object.values(scores()).reduce((a,b)=>a+b,0)}
function table(cols,rows){return '<div class="scroll"><table><thead><tr>'+cols.map(v=>'<th>'+safe(v)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(row=>'<tr>'+row.map(v=>'<td>'+safe(v)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}
function panel(name,body,note=''){return '<div class="erp"><div class="erp-head"><span>ERP NUSANIAGA · '+safe(name)+'</span><span class="small">DATA SIMULASI</span></div><div class="erp-body">'+body+(note?'<p class="footer-note">'+safe(note)+'</p>':'')+'</div></div>'}
function kpis(items){return '<div class="kpis">'+items.map(([a,b])=>'<div class="kpi">'+safe(a)+'<b>'+safe(b)+'</b></div>').join('')+'</div>'}
function doc(title,rows){return '<div class="doc"><div class="muted">DOKUMEN SUMBER · SIMULASI</div><h3>'+safe(title)+'</h3>'+table(['Atribut','Isi'],rows)+'</div>'}
function choice(field,opts){return opts.map(([id,label])=>'<button type="button" class="choice" data-field="'+field+'" data-value="'+id+'" aria-pressed="'+(s[field]===id)+'">'+safe(label)+'</button>').join('')}

function salesRegister(){return panel('SALES ORDER REGISTER',table(['SO','Customer','Qty','Nilai','Status proses'],[['SO-1468','CV Mitra Grosir','100 unit',money(200000000),!s.sales?'DRAFT':s.sales==='review'?'APPROVAL REQUESTED':s.sales==='ship'?'SHIPPING REQUESTED':'INVOICE REQUESTED']])+kpis([['Limit tersedia',money(120000000)],['Nilai pesanan',money(200000000)]]),'Status mencerminkan tindakan yang diajukan dalam simulasi. Dokumen hilir tidak diposting otomatis.')}
function receiptRegister(){let q=s.goods?(s.goods==='actual'?950:1000):0;return panel('GOODS RECEIPT REGISTER',table(['Dokumen','PO','Ditimbang','Diajukan ERP','Perbedaan kuantitas','Status proses'],[['GRN-33','PO-772','950 kg',q+' kg',(q-950)+' kg',s.goods?'ENTRY RECORDED':'DRAFT']])+kpis([['Nilai entri ERP',money(q*50000)],['Nilai fisik diterima',money(47500000)]]),'Register memperlihatkan data fisik dan data yang dipilih untuk entri ERP, tanpa memberikan kesimpulan evaluatif.')}
function matchReport(){let q=s.goods?(s.goods==='actual'?950:1000):0;return panel('3-WAY MATCH · AP REGISTER',table(['Dokumen','PO','GRN fisik','Faktur','Perbedaan faktur-fisik'],[['INV-V209','1.000 kg','950 kg','1.000 kg','50 kg']])+table(['Sumber','Data','Catatan sistem'],[['PO','1.000 kg','PO-772'],['Penerimaan fisik','950 kg','GRN-33'],['Entri penerimaan ERP',q+' kg','Inventory register'],['Keputusan invoice',!s.invoice?'NOT PROCESSED':s.invoice==='hold'?'REVIEW REQUESTED':'FULL APPROVAL REQUESTED','INV-V209']]),'Informasi hasil pencocokan merekam data sumber dan tindakan kelompok. Interpretasi profesional diberikan setelah simulasi.')}
function cockpit(){let q=s.goods?(s.goods==='actual'?950:1000):0;return panel('CROSS-MODULE COCKPIT',table(['Modul','Referensi','Nilai/Qty','Aktivitas tercatat'],[['Sales / AR','SO-1468',money(200000000),!s.sales?'DRAFT':s.sales==='review'?'Approval requested':s.sales==='ship'?'Shipping requested':'Invoice requested'],['Inventory','GRN-33',q+' kg',s.goods?'Goods receipt entered':'Not entered'],['AP / Procurement','INV-V209',money(50000000),!s.invoice?'Not processed':s.invoice==='hold'?'Review requested':'Full invoice approval requested'],['Production planning','RM-001 feed',q+' kg','Data tersedia untuk telaah perencanaan']])+kpis([['Limit kredit tersedia',money(120000000)],['Selisih faktur & fisik',money(2500000)],['Entri persediaan',money(q*50000)]]),'Tampilan status ini menunjukkan tindakan dan nilai transaksi, bukan penilaian benar atau salah atas keputusan kelompok.')}
function rubric(){let checks=[['Validasi kredit pelanggan',20,salesOK(),'Order Rp200 juta, limit tersisa Rp120 juta; otorisasi tambahan diperlukan sebelum pengiriman.'],['Akurasi pencatatan penerimaan',20,goodsOK(),'GRN fisik menunjukkan 950 kg senilai Rp47,5 juta; nilai PO 1.000 kg bukan bukti penerimaan.'],['Pencocokan tiga dokumen',20,invoiceOK(),'Invoice 1.000 kg berbeda dari penerimaan 950 kg sebesar 50 kg / Rp2,5 juta; selisih perlu diklarifikasi.'],['Interpretasi lintas modul',25,interpretOK(),'Rekonsiliasi PO, penerimaan fisik, entri ERP dan faktur diperlukan untuk menelusuri sumber perbedaan.'],['Konsistensi keputusan terintegrasi',15,salesOK()&&goodsOK()&&invoiceOK()&&interpretOK(),'Kombinasi empat keputusan yang konsisten menjaga keterlacakan transaksi dari dokumen ke register dan laporan.']];return '<section class="erp" id="rubrik"><div class="erp-head">RUBRIK EVALUASI AKHIR <span>'+score()+'/100</span></div><div class="erp-body"><p>Hasil penilaian baru dibuka setelah laporan kelompok diselesaikan.</p>'+table(['Kompetensi','Bobot','Nilai','Umpan balik'],checks.map(c=>[c[0],c[1]+' poin',c[2]?c[1]+' poin':'0 poin',(c[2]?'Sesuai: ':'Perlu ditinjau: ')+c[3]]))+'<h3>Umpan balik memo</h3><p>Memo diperiksa dosen berdasarkan ketepatan hubungan input–proses–output, kejelasan diagnosis sumber data, dan tindakan korektif. Tidak ada skor otomatis berdasarkan panjang tulisan.</p></div></section>'}
function nav(){return '<div class="nav noprint"><button class="btn alt" data-act="back">← Kembali</button><button class="btn" data-act="next">Lanjut →</button></div>'}
function render(){let h='';$('progress').innerHTML='<div class="bar"><span class="tag">Tahap '+(s.step+1)+'/6</span><span class="tag">Target 25 menit</span><span class="tag">Progres tersimpan lokal</span></div><div class="progress"><div style="width:'+(s.step/5*100)+'%"></div></div>';
if(s.step===0)h='<div class="card"><h2>Briefing · 2 menit</h2><p>Anda bertugas memproses transaksi dan memeriksa data yang terbentuk pada ERP. Identifikasi bagaimana dokumen sumber, master data, posting, pengecualian, dan output manajemen saling terkait.</p><div class="notice">Enam tahap, tiga keputusan operasional, satu interpretasi data dan simpulan kelompok. Dokumen dan organisasi bersifat fiktif.</div><label class="field">Nama kelompok<input id="team" maxlength="70" value="'+safe(s.team)+'" placeholder="Kelompok 1"></label><div class="nav"><button class="btn alt" data-act="reset">Mulai ulang</button><button class="btn" data-act="next">Mulai →</button></div></div>';
if(s.step===1)h='<div class="card"><h2>1. Sales order & customer master · 5 menit</h2><div class="grid">'+doc('Sales Order SO-1468',[['Pelanggan','CV Mitra Grosir'],['Pesanan','100 unit × Rp2.000.000'],['Nilai',money(200000000)]])+doc('Customer Master AR-102',[['Limit kredit tersedia',money(120000000)],['Tambahan persetujuan','Belum ada']])+'</div><h3>Proses pesanan</h3>'+choice('sales',[['ship','Kirim karena barang tersedia; evaluasi kredit menyusul.'],['review','Tahan pengiriman dan ajukan otorisasi tambahan atau pembayaran sesuai kebijakan.'],['invoice','Terbitkan faktur tanpa validasi kredit.']])+salesRegister()+nav()+'</div>';
if(s.step===2)h='<div class="card"><h2>2. Goods receipt & inventory register · 5 menit</h2><div class="grid">'+doc('PO-772',[['Dipesan','1.000 kg'],['Harga bahan',money(50000)+'/kg'],['Total',money(50000000)]])+doc('GRN-33',[['Ditimbang fisik','950 kg'],['Mutu','Sesuai'],['Gudang','Material RM-001']])+'</div><h3>Pilih kuantitas posting penerimaan</h3>'+choice('goods',[['po','Posting 1.000 kg karena jumlah PO sudah disetujui.'],['actual','Posting sesuai hasil penimbangan fisik 950 kg.']])+receiptRegister()+nav()+'</div>';
if(s.step===3)h='<div class="card"><h2>3. Invoice matching & exception queue · 5 menit</h2><div class="grid">'+doc('Faktur INV-V209',[['Ditagih','1.000 kg'],['Nilai sebelum pajak',money(50000000)],['Status','Belum disetujui untuk pembayaran']])+doc('GRN-33 (referensi)',[['Fisik diterima','950 kg'],['Nilai diterima',money(47500000)]])+'</div><h3>Jalankan pemeriksaan tiga dokumen</h3>'+choice('invoice',[['pay','Teruskan persetujuan faktur penuh karena sesuai PO.'],['hold','Tahan selisih 50 kg dan minta klarifikasi pemasok / gudang.']])+matchReport()+nav()+'</div>';
if(s.step===4)h='<div class="card"><h2>4. Diagnosis data antarmodul · 5 menit</h2><p>Perhatikan hasil dari masing-masing modul. Pilih diagnosis yang paling tepat tentang sumber selisih dan tindakan berikutnya.</p>'+cockpit()+'<h3>Temuan integrasi mana yang paling kuat?</h3>'+choice('interpret',[['erp','Angka posting ERP selalu menjadi bukti penerimaan final meskipun berbeda dari fisik.'],['source','Bandingkan PO, bukti fisik GRN, posting gudang, dan faktur; koreksi posting yang tidak sesuai serta tahan selisih tagihan sampai terselesaikan.'],['pay','Meneruskan faktur ke pembayaran dapat menghilangkan selisih pada gudang secara otomatis.']])+nav()+'</div>';
if(s.step===5)h='<div class="card"><h2>5. Laporan kelompok · 3 menit</h2><p>Periksa ringkasan transaksi dan tulis simpulan kelompok. Rubrik penilaian ditampilkan setelah laporan diselesaikan.</p>'+cockpit()+'<label class="field">Memo kelompok (2–3 kalimat, wajib)<textarea id="memo" maxlength="850" '+(s.finished?'disabled':'')+' placeholder="Jelaskan hubungan input–proses–output, satu perbedaan antarsumber data, dan tindak lanjutnya.">'+safe(s.memo)+'</textarea></label>'+(s.finished?rubric()+'<div class="nav noprint"><button class="btn alt" data-act="download">Unduh laporan dan rubrik (.txt)</button><button class="btn" data-act="print">Cetak / simpan PDF</button><button class="btn alt" data-act="reset">Mulai ulang</button></div>':'<div class="nav noprint"><button class="btn alt" data-act="back">← Tinjau dashboard</button><button class="btn" data-act="finish">Selesaikan simulasi & tampilkan rubrik</button></div>')+'</div>';
$('app').innerHTML=h;persist()}
function report(){let marks=scores();return ['SIPI SESI 6 · ERP TRANSACTION FLOW','Kelompok: '+s.team,'', 'SO-1468: '+money(200000000)+'; limit tersedia '+money(120000000),'Keputusan sales: '+({review:'Minta otorisasi tambahan',ship:'Ajukan pengiriman',invoice:'Ajukan faktur'}[s.sales]||'-'),'GRN-33: fisik 950 kg, entri '+(s.goods?(s.goods==='actual'?950:1000):0)+' kg','Keputusan invoice: '+({hold:'Ajukan peninjauan faktur',pay:'Ajukan persetujuan faktur penuh'}[s.invoice]||'-'),'Diagnosis: '+({source:'Rekonsiliasi sumber data',erp:'Gunakan data ERP',pay:'Teruskan faktur'}[s.interpret]||'-'),'','MEMO:',s.memo,'','RUBRIK AKHIR — '+score()+'/100','Validasi kredit: '+marks.sales+'/20','Penerimaan: '+marks.receipt+'/20','Invoice matching: '+marks.invoice+'/20','Diagnosa integrasi: '+marks.interpret+'/25','Konsistensi: '+marks.integration+'/15','Pembahasan: selisih kredit Rp80 juta; selisih faktur-fisik 50 kg senilai Rp2,5 juta; penerimaan fisik 950 kg.','Data simulasi pendidikan.'].join('\n')}

document.addEventListener('input',e=>{if(e.target.id==='team')s.team=e.target.value;if(e.target.id==='memo')s.memo=e.target.value;persist()});
document.addEventListener('click',e=>{const b=e.target.closest('[data-field],[data-act]');if(!b)return;if(b.dataset.field){if(s.finished)return;s[b.dataset.field]=b.dataset.value;render();return}const a=b.dataset.act;if(a==='reset'){if(confirm('Hapus progres kelompok pada perangkat ini?')){s=fresh();render()}return}if(a==='back'){if(s.finished)return;s.step=Math.max(0,s.step-1);render();return}if(a==='next'){if(s.finished)return;if((s.step===1&&!s.sales)||(s.step===2&&!s.goods)||(s.step===3&&!s.invoice)||(s.step===4&&!s.interpret)){alert('Lengkapi keputusan terlebih dahulu.');return}s.step=Math.min(5,s.step+1);render();return}if(a==='finish'){if(s.step!==5)return;if(s.memo.trim().length<30){alert('Tuliskan memo kelompok sebelum menyelesaikan simulasi.');return}s.finished=true;render();return}if(a==='download'||a==='print'){if(!s.finished){alert('Selesaikan simulasi untuk melihat rubrik dan mengunduh hasil.');return}if(s.memo.trim().length<30){alert('Isi memo kelompok minimal 30 karakter yang menjelaskan diagnosis dan tindak lanjut.');return}if(a==='print'){window.print();return}const u=URL.createObjectURL(new Blob([report()],{type:'text/plain;charset=utf-8'}));const link=document.createElement('a');link.href=u;link.download='SIPI6_ERP_'+(s.team||'Kelompok').replace(/[^a-z0-9_-]/gi,'_')+'.txt';link.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}});render();
</script></body></html>
